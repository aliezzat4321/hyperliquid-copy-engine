[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hyperliquid-copy-engine"
version = "0.1.0"
description = "Point-in-time Hyperliquid trader discovery and copyability research engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "polars>=1.8,<2",
  "psycopg[binary]>=3.2,<4",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
hlcopy = "hlcopy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hlcopy"]

[tool.hatch.build]
include = [
  "src/hlcopy/**/*.py",
  "src/hlcopy/db/schema.sql",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/hlcopy/resolver/reverse_index.py" = ["E501", "UP035"]
