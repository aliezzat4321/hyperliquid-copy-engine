[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hyperliquid-copy-engine"
version = "0.1.0"
description = "Point-in-time Hyperliquid trader discovery and copyability research engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "polars>=1.8,<2",
  "psycopg[binary]>=3.2,<4",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
hlcopy = "hlcopy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hlcopy"]

[tool.hatch.build]
include = [
  "src/hlcopy/**/*.py",
  "src/hlcopy/db/schema.sql",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/hlcopy/resolver/reverse_index.py" = ["E501", "UP035"]
"src/hlcopy/resolver/fingerprint_cli.py" = ["E501", "F401", "UP037"]
"src/hlcopy/resolver/size_agnostic_identifier.py" = ["E501"]
"src/hlcopy/profitability/live_cli.py" = ["E501"]
"src/hlcopy/profitability/position_copy.py" = ["E501", "UP035"]
"src/hlcopy/profitability/position_live_cli.py" = ["E501", "B007", "E702"]
"src/hlcopy/profitability/ranking_cli.py" = ["E501"]
"src/hlcopy/profitability/path_risk.py" = ["E501"]
"src/hlcopy/profitability/portfolio_position_copy.py" = ["E501"]
"src/hlcopy/profitability/streaming_path_truth.py" = ["UP035"]
"src/hlcopy/profitability/parquet_mark_stream.py" = ["E501"]
"src/hlcopy/profitability/streaming_path_pass.py" = ["E501"]
"src/hlcopy/profitability/parquet_stream_evaluator.py" = ["E501"]
"src/hlcopy/profitability/selective_path_truth_fast_cli.py" = ["E501"]
"tests/test_attribution_round_trip_fee_gate_v1.py" = ["E501"]
"tests/test_parquet_stream_evaluator_v4.py" = ["E501"]
