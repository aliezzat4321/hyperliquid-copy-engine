name: wallet-pipeline-ci

on:
  pull_request:
    paths:
      - "src/hlcopy/discovery/invo_*.py"
      - "src/hlcopy/third_party/**"
      - "deploy/systemd/hyperliquid-invo-*.service"
      - "deploy/systemd/hyperliquid-third-party-*.service"
      - "scripts/deploy_invo_universe_self_hosted.sh"
      - "tests/test_invo_*.py"
      - "tests/test_third_party_profitability_track_v1.py"
      - ".github/workflows/wallet-pipeline-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Lint wallet pipeline changes
        run: |
          ruff check \
            src/hlcopy/discovery/invo_direct_history_job.py \
            tests/test_invo_direct_history_v4.py
      - name: Test identity and third-party handoff
        run: |
          pytest -q \
            tests/test_invo_direct_history_v4.py \
            tests/test_invo_resolution_threshold_v3.py \
            tests/test_invo_identifier_job_v2.py \
            tests/test_third_party_profitability_track_v1.py
