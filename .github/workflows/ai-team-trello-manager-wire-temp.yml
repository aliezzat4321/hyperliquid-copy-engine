name: ai-team-trello-manager-wire-temp

on:
  push:
    branches: [trigger/pr153-exact-review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, linux]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b128904c3be0123f6d077a347da2595c9f4e0d1
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(id -u)" = 0
          test "$(git rev-parse HEAD)" = "4b128904c3be0123f6d077a347da2595c9f4e0d1"
          python3 -m py_compile scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py
          ! git diff origin/main...HEAD -- scripts/ai_team_orchestrator.py | grep -E '^\+.*(REAL_TRADING_ENABLED|LIVE_TRADING_ENABLED)\s*=\s*(YES|TRUE|1)'

      - name: Bounded Claude exact-SHA continuity review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=4b128904c3be0123f6d077a347da2595c9f4e0d1
          PR_NUMBER=153
          CLAUDE_HOME=/var/lib/hyperliquid-ai-team/agents/claude/home
          UID_C="$(id -u hl-claude-agent)"
          GID_C="$(id -g hl-claude-agent)"
          REVIEW_DIR="/var/lib/hyperliquid-ai-team/agents/claude/worktrees/pr153-review-${GITHUB_RUN_ID}"
          rm -rf "$REVIEW_DIR"
          mkdir -p "$REVIEW_DIR"
          cp -a "$GITHUB_WORKSPACE/." "$REVIEW_DIR/"
          chown -R hl-claude-agent:hl-claude-agent "$REVIEW_DIR"

          run_claude() {
            duration="$1"
            shift
            timeout --foreground "$duration" \
              setpriv --reuid="$UID_C" --regid="$GID_C" --init-groups \
              env -i HOME="$CLAUDE_HOME" CLAUDE_CONFIG_DIR="$CLAUDE_HOME/.claude" \
              XDG_CONFIG_HOME="$CLAUDE_HOME/.config" XDG_CACHE_HOME="$CLAUDE_HOME/.cache" \
              PATH=/usr/local/bin:/usr/bin:/bin \
              /usr/bin/claude "$@"
          }

          set +e
          ready="$(cd "$REVIEW_DIR" && run_claude 30s -p 'Reply exactly: CLAUDE_READY_OK' --model sonnet --output-format text --permission-mode dontAsk 2>/tmp/pr153-ready.err)"
          rc=$?
          set -e
          if [[ $rc -ne 0 || "$ready" != *CLAUDE_READY_OK* ]]; then
            echo 'CLAUDE_PR153_REVIEW=WAITING_RATE_LIMIT_OR_UNAVAILABLE'
            tail -c 600 /tmp/pr153-ready.err 2>/dev/null || true
            rm -rf "$REVIEW_DIR" /tmp/pr153-ready.err
            exit 0
          fi

          cat >/tmp/pr153-review.txt <<EOF
          You are CLAUDE, the independent adversarial exact-SHA reviewer for Hyperliquid PR #153.
          Review EXACT SHA $TARGET_SHA only. Read AGENTS.md, Issue #151 context already represented in the changed code/docs, and git diff origin/main...HEAD plus necessary callers. Do not modify files.

          Main goal: ensure the AI engineering team never stops on recoverable outcomes. Verify these loops are complete and safe:
          - Claude/provider rate limit -> WAITING_RATE_LIMIT, bounded repo-free probe, no attempt burn, worker released, same checkpoint resumes.
          - interrupted/stale worker -> reaped and requeued.
          - review FAIL -> Codex REPAIR on same PR.
          - CI FAIL -> Codex REPAIR on same PR, not terminal BLOCKED.
          - PR head movement -> replacement exact-SHA review.
          - transient merge/API rejection -> retry merge stage without another model call.
          - ordinary bounded failures may still trip a circuit breaker; safety/auth/corrupted-state failures remain fail-closed.
          - no weakening of protected-path, live-trading, capital, deploy, credential, or Polymarket boundaries.

          Try to find any other recoverable path that still falls into BLOCKED incorrectly, duplicate-task/infinite-loop risks, lost checkpoints, stale SHA merge, or worker monopolization.
          CI, ai-team-contract and live-sensitive-guard are green on this SHA.

          End EXACTLY with:
          REVIEWED_SHA=$TARGET_SHA
          VERDICT=PASS
          BLOCKERS_JSON=[]
          or VERDICT=FAIL with concrete JSON blockers.
          EOF

          set +e
          review_json="$(cd "$REVIEW_DIR" && run_claude 7m -p "$(cat /tmp/pr153-review.txt)" --model sonnet --output-format json --permission-mode dontAsk 2>/tmp/pr153-review.err)"
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            if [[ $rc -eq 124 ]]; then
              echo 'CLAUDE_PR153_REVIEW=TIMED_OUT_WILL_RETRY'
              exit 0
            fi
            tail -c 1000 /tmp/pr153-review.err >&2 || true
            exit $rc
          fi
          printf '%s' "$review_json" >/tmp/pr153-review.json
          python3 - "$TARGET_SHA" /tmp/pr153-review.json >/tmp/pr153-result.txt <<'PY'
          import json, re, sys
          sha = sys.argv[1]
          row = json.load(open(sys.argv[2], encoding='utf-8'))
          result = str(row.get('result') or '')
          print(result)
          sm = re.search(r'(?mi)^\s*REVIEWED_SHA\s*=\s*([0-9a-f]{40})\s*$', result)
          vm = re.search(r'(?mi)^\s*VERDICT\s*=\s*(PASS|FAIL)\s*$', result)
          if not sm or sm.group(1) != sha:
              raise SystemExit('stale/missing reviewed SHA')
          if not vm or vm.group(1) != 'PASS':
              raise SystemExit('Claude exact-SHA continuity review did not PASS')
          PY
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr153-result.txt
          echo 'CLAUDE_PR153_EXACT_SHA_REVIEW=PASS'
          rm -rf "$REVIEW_DIR" /tmp/pr153-ready.err /tmp/pr153-review.txt /tmp/pr153-review.err /tmp/pr153-review.json /tmp/pr153-result.txt
