name: ai-team-trello-manager-wire-temp

on:
  push:
    branches: [trigger/pr153-final-review]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel obsolete exact-SHA review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/33582806380/cancel || true
          echo 'STALE_REVIEW_CANCEL_REQUESTED=33582806380'

  review:
    needs: cancel-stale
    runs-on: [self-hosted, linux]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c9fb51a2fef992d549c5ffb1b75c089d70e3a9a1
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify exact target and boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(id -u)" = 0
          test "$(git rev-parse HEAD)" = "c9fb51a2fef992d549c5ffb1b75c089d70e3a9a1"
          python3 -m py_compile scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py
          ! git diff origin/main...HEAD -- scripts/ai_team_orchestrator.py | grep -E '^\+.*(REAL_TRADING_ENABLED|LIVE_TRADING_ENABLED)\s*=\s*(YES|TRUE|1)'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'

      - name: Bounded Claude exact-SHA continuity audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=c9fb51a2fef992d549c5ffb1b75c089d70e3a9a1
          PR_NUMBER=153
          CLAUDE_HOME=/var/lib/hyperliquid-ai-team/agents/claude/home
          UID_C="$(id -u hl-claude-agent)"
          GID_C="$(id -g hl-claude-agent)"
          REVIEW_DIR="/var/lib/hyperliquid-ai-team/agents/claude/worktrees/pr153-final-${GITHUB_RUN_ID}"
          rm -rf "$REVIEW_DIR"
          mkdir -p "$REVIEW_DIR"
          cp -a "$GITHUB_WORKSPACE/." "$REVIEW_DIR/"
          chown -R hl-claude-agent:hl-claude-agent "$REVIEW_DIR"

          run_claude() {
            duration="$1"
            shift
            timeout --foreground "$duration" \
              setpriv --reuid="$UID_C" --regid="$GID_C" --init-groups \
              env -i HOME="$CLAUDE_HOME" CLAUDE_CONFIG_DIR="$CLAUDE_HOME/.claude" \
              XDG_CONFIG_HOME="$CLAUDE_HOME/.config" XDG_CACHE_HOME="$CLAUDE_HOME/.cache" \
              PATH=/usr/local/bin:/usr/bin:/bin \
              /usr/bin/claude "$@"
          }

          set +e
          ready="$(cd "$REVIEW_DIR" && run_claude 30s -p 'Reply exactly: CLAUDE_READY_OK' --model sonnet --output-format text --permission-mode dontAsk 2>/tmp/pr153-final-ready.err)"
          rc=$?
          set -e
          if [[ $rc -ne 0 || "$ready" != *CLAUDE_READY_OK* ]]; then
            echo 'CLAUDE_PR153_FINAL_REVIEW=WAITING_RATE_LIMIT_OR_UNAVAILABLE'
            tail -c 600 /tmp/pr153-final-ready.err 2>/dev/null || true
            rm -rf "$REVIEW_DIR" /tmp/pr153-final-ready.err
            exit 0
          fi

          cat >/tmp/pr153-final-review.txt <<EOF
          You are CLAUDE, independent adversarial exact-SHA reviewer for Hyperliquid PR #153.
          Review EXACT SHA $TARGET_SHA. Do not modify files. Read AGENTS.md, the PR diff origin/main...HEAD, and only necessary adjacent callers.

          Audit the COMPLETE automation continuity state machine, not just the original Claude limit bug. Recoverable outcomes must remain autonomous:
          1. Claude/provider usage/rate limit -> WAITING_RATE_LIMIT, no attempt burn, short repo-free probe, worker released, same task/session resumes.
          2. interrupted/stale worker -> reap + requeue.
          3. review FAIL -> Codex REPAIR on same PR.
          4. CI FAIL -> Codex REPAIR on same PR, never terminal BLOCKED.
          5. PR head movement -> replacement exact-SHA review.
          6. transient merge/API rejection -> retry merge stage without another model call.
          7. recoverable Codex postprocess/finalize/push/API failures -> bounded retry, not immediate BLOCKED.
          8. terminal BLOCKED only for safety/auth/corrupt identity-state or exhausted bounded circuit breaker.
          9. no duplicate/infinite repair loops, stale-SHA merge, lost checkpoint, worker monopolization, or weakening of live/trading/deploy/capital/credential/Polymarket boundaries.

          CI, ai-team-contract and live-sensitive-guard must be green for this exact SHA before merge; independently verify code logic and regression tests.

          End EXACTLY with:
          REVIEWED_SHA=$TARGET_SHA
          VERDICT=PASS
          BLOCKERS_JSON=[]
          or VERDICT=FAIL with concrete JSON blockers.
          EOF

          set +e
          review_json="$(cd "$REVIEW_DIR" && run_claude 7m -p "$(cat /tmp/pr153-final-review.txt)" --model sonnet --output-format json --permission-mode dontAsk 2>/tmp/pr153-final-review.err)"
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            if [[ $rc -eq 124 ]]; then
              echo 'CLAUDE_PR153_FINAL_REVIEW=TIMED_OUT_WILL_RETRY'
              exit 0
            fi
            tail -c 1000 /tmp/pr153-final-review.err >&2 || true
            exit $rc
          fi
          printf '%s' "$review_json" >/tmp/pr153-final-review.json
          python3 - "$TARGET_SHA" /tmp/pr153-final-review.json >/tmp/pr153-final-result.txt <<'PY'
          import json, re, sys
          sha = sys.argv[1]
          row = json.load(open(sys.argv[2], encoding='utf-8'))
          result = str(row.get('result') or '')
          print(result)
          sm = re.search(r'(?mi)^\s*REVIEWED_SHA\s*=\s*([0-9a-f]{40})\s*$', result)
          vm = re.search(r'(?mi)^\s*VERDICT\s*=\s*(PASS|FAIL)\s*$', result)
          if not sm or sm.group(1) != sha:
              raise SystemExit('stale/missing reviewed SHA')
          if not vm or vm.group(1) != 'PASS':
              raise SystemExit('Claude exact-SHA continuity audit did not PASS')
          PY
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr153-final-result.txt
          echo 'CLAUDE_PR153_FINAL_EXACT_SHA_REVIEW=PASS'
          rm -rf "$REVIEW_DIR" /tmp/pr153-final-ready.err /tmp/pr153-final-review.txt /tmp/pr153-final-review.err /tmp/pr153-final-review.json /tmp/pr153-final-result.txt
