name: ai-team-pr153-final-exact-review-temp

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'schedule' || github.event.head_commit.message == 'Run PR153 final repaired exact review'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Confirm exact PR head and skip completed review
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=6ed0686ebf2d2635b90eb66111f180b89965f86d
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/153" --jq .head.sha)"
          if [[ "$CURRENT_SHA" != "$TARGET_SHA" ]]; then
            echo 'run_review=no' >> "$GITHUB_OUTPUT"
            echo "STALE_TARGET current=$CURRENT_SHA expected=$TARGET_SHA"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/issues/153/comments?per_page=100" --paginate --jq '.[].body' \
            | grep -Fq "REVIEWED_SHA=$TARGET_SHA"; then
            echo 'run_review=no' >> "$GITHUB_OUTPUT"
            echo 'EXACT_SHA_ALREADY_REVIEWED=YES'
            exit 0
          fi
          echo 'run_review=yes' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run_review == 'yes'
        with:
          ref: 6ed0686ebf2d2635b90eb66111f180b89965f86d
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify exact target and boundaries
        if: steps.gate.outputs.run_review == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(id -u)" = 0
          test "$(git rev-parse HEAD)" = "6ed0686ebf2d2635b90eb66111f180b89965f86d"
          python3 -m py_compile scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'

      - name: Bounded Claude exact-SHA continuity audit
        if: steps.gate.outputs.run_review == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=6ed0686ebf2d2635b90eb66111f180b89965f86d
          CLAUDE_HOME=/var/lib/hyperliquid-ai-team/agents/claude/home
          UID_C="$(id -u hl-claude-agent)"
          GID_C="$(id -g hl-claude-agent)"
          REVIEW_DIR="/var/lib/hyperliquid-ai-team/agents/claude/worktrees/pr153-final-${GITHUB_RUN_ID}"
          rm -rf "$REVIEW_DIR"
          mkdir -p "$REVIEW_DIR"
          cp -a "$GITHUB_WORKSPACE/." "$REVIEW_DIR/"
          chown -R hl-claude-agent:hl-claude-agent "$REVIEW_DIR"

          run_claude() {
            duration="$1"
            shift
            timeout --foreground "$duration" \
              setpriv --reuid="$UID_C" --regid="$GID_C" --init-groups \
              env -i HOME="$CLAUDE_HOME" CLAUDE_CONFIG_DIR="$CLAUDE_HOME/.claude" \
              XDG_CONFIG_HOME="$CLAUDE_HOME/.config" XDG_CACHE_HOME="$CLAUDE_HOME/.cache" \
              PATH=/usr/local/bin:/usr/bin:/bin \
              /usr/bin/claude "$@"
          }

          cleanup() { rm -rf "$REVIEW_DIR" /tmp/pr153-ready.* /tmp/pr153-review.* /tmp/pr153-result.txt; }
          trap cleanup EXIT

          set +e
          ready="$(cd "$REVIEW_DIR" && run_claude 30s -p 'Reply exactly: CLAUDE_READY_OK' --model sonnet --output-format text --permission-mode dontAsk 2>/tmp/pr153-ready.err)"
          ready_rc=$?
          set -e
          if [[ $ready_rc -ne 0 || "$ready" != *CLAUDE_READY_OK* ]]; then
            echo 'CLAUDE_PR153_REVIEW=WAITING_RATE_LIMIT_OR_UNAVAILABLE'
            tail -c 800 /tmp/pr153-ready.err 2>/dev/null || true
            exit 0
          fi

          cat >/tmp/pr153-review.prompt <<EOF
          You are CLAUDE, the independent adversarial exact-SHA reviewer for Hyperliquid PR #153.
          Review EXACT SHA $TARGET_SHA only. Do not modify files. Read AGENTS.md, git diff origin/main...HEAD, tests/test_ai_team_orchestrator.py, and only necessary adjacent callers.

          Audit the COMPLETE autonomous continuity state machine. Recoverable outcomes must not strand work:
          - Claude/provider limit -> WAITING_RATE_LIMIT, no attempt burn, bounded repo-free readiness probe, worker released, same session/checkpoint resumes.
          - A Claude readiness-probe failure that is NOT positively classified as rate/usage/provider unavailability must consume the ordinary bounded retry/failure budget, preserve the review session, and must not loop forever as WAITING_RATE_LIMIT.
          - Codex/provider limit -> WAITING_RATE_LIMIT, no attempt burn, bounded retry, worker released.
          - interrupted/stale worker -> safely reap and requeue.
          - BUILD/REPAIR -> REVIEW handoff survives restart/API mirror failure and is idempotently reconciled.
          - review FAIL -> Codex REPAIR on same PR; handoff survives restart/API mirror failure.
          - CI FAIL -> Codex REPAIR on same PR, never terminal BLOCKED.
          - PR head movement -> exact-SHA replacement REVIEW; handoff survives interruption.
          - transient merge/API rejection -> retry merge stage without rerunning model review.
          - recoverable Codex finalize/push/API failure -> bounded retry, not immediate BLOCKED.
          - terminal BLOCKED only for explicit safety/authorization/corrupt task identity-state or exhausted bounded failure circuit breaker.

          Look specifically for duplicate/infinite child creation, stale-SHA merge, attempt-budget errors, stale systemd-unit ownership, crash windows between parent terminal transition and child creation, GitHub-comment failures that strand local tasks, or any worker/provider wait that monopolizes the shared runner.

          Confirm no weakening of live-trading, capital, deploy, credential, protected-path, or Polymarket boundaries. REAL_TRADING remains disabled.

          End EXACTLY with either:
          REVIEWED_SHA=$TARGET_SHA
          VERDICT=PASS
          BLOCKERS_JSON=[]
          or:
          REVIEWED_SHA=$TARGET_SHA
          VERDICT=FAIL
          BLOCKERS_JSON=[...]
          EOF

          set +e
          review_json="$(cd "$REVIEW_DIR" && run_claude 7m -p "$(cat /tmp/pr153-review.prompt)" --model sonnet --output-format json --permission-mode dontAsk 2>/tmp/pr153-review.err)"
          review_rc=$?
          set -e
          printf '%s' "$review_json" >/tmp/pr153-review.json

          if [[ $review_rc -ne 0 ]]; then
            combined="$(cat /tmp/pr153-review.json /tmp/pr153-review.err 2>/dev/null || true)"
            if grep -Eqi 'rate limit|usage limit|session limit|quota|too many requests|429|hit your limit|limit reached' <<<"$combined"; then
              echo 'CLAUDE_PR153_REVIEW=WAITING_RATE_LIMIT_OR_UNAVAILABLE'
              printf '%s' "$combined" | tail -c 1000
              exit 0
            fi
            if [[ $review_rc -eq 124 ]]; then
              echo 'CLAUDE_PR153_REVIEW=TIMED_OUT_WILL_RETRY'
              exit 0
            fi
            printf '%s' "$combined" | tail -c 1500 >&2
            exit "$review_rc"
          fi

          python3 - "$TARGET_SHA" /tmp/pr153-review.json >/tmp/pr153-result.txt <<'PY'
          import json, re, sys
          sha = sys.argv[1]
          row = json.load(open(sys.argv[2], encoding='utf-8'))
          result = str(row.get('result') or '')
          print(result)
          sm = re.search(r'(?mi)^\s*REVIEWED_SHA\s*=\s*([0-9a-f]{40})\s*$', result)
          vm = re.search(r'(?mi)^\s*VERDICT\s*=\s*(PASS|FAIL)\s*$', result)
          if not sm or sm.group(1) != sha:
              raise SystemExit('stale/missing reviewed SHA')
          if not vm or vm.group(1) != 'PASS':
              raise SystemExit('Claude exact-SHA continuity audit did not PASS')
          PY
          gh pr comment 153 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr153-result.txt
          echo 'CLAUDE_PR153_FINAL_EXACT_SHA_REVIEW=PASS'
