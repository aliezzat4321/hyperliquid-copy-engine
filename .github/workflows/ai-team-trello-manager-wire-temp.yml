name: ai-team-trello-manager-wire-temp

on:
  push:
    branches: [trigger/pr153-postprocess-retry]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auto-151-5cc33cdb
          fetch-depth: 0
          persist-credentials: false

      - name: Close recoverable postprocess dead-end
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(git branch --show-current)" = "codex/auto-151-5cc33cdb"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/ai_team_orchestrator.py')
          text = p.read_text(encoding='utf-8')
          old = (
              '        except Exception as exc:\n'
              '            self.block(self.ledger.get(task["id"]), str(exc))\n'
              '            self.finish_runtime_run(\n'
              '                run_id,\n'
              '                str(task["id"]),\n'
              '                stdout=cp.stdout,\n'
              '                stderr=cp.stderr,\n'
              '                exit_code=1,\n'
              '                session_id=session_id,\n'
              '                usage=usage,\n'
              '                result=result,\n'
              '                error=str(exc),\n'
              '                status="BLOCKED",\n'
              '            )\n'
          )
          new = (
              '        except Exception as exc:\n'
              '            error = str(exc)\n'
              '            current = self.ledger.get(task["id"])\n'
              '            fail_closed_markers = (\n'
              '                "unsafe changed path",\n'
              '                "owner-sensitive live path",\n'
              '                "forbidden live-trading enablement",\n'
              '                "unsafe untracked symlink",\n'
              '                "untracked file too large for safety scan",\n'
              '            )\n'
              '            if any(marker in error for marker in fail_closed_markers):\n'
              '                self.block(current, error)\n'
              '            else:\n'
              '                self.retry_or_block(\n'
              '                    current,\n'
              '                    f"Codex postprocess/finalize failed: {error}",\n'
              '                    session_id=session_id,\n'
              '                )\n'
              '                updated = self.ledger.get(task["id"])\n'
              '                if updated["status"] != "BLOCKED":\n'
              '                    self.runtime.event(\n'
              '                        "CODEX_POSTPROCESS_RETRY_SCHEDULED",\n'
              '                        assignment_id=task["id"],\n'
              '                        issue=task["issue_number"],\n'
              '                        pr=task["pr_number"],\n'
              '                        retry_after=updated["retry_at"],\n'
              '                        error=error,\n'
              '                    )\n'
              '            updated = self.ledger.get(task["id"])\n'
              '            self.finish_runtime_run(\n'
              '                run_id,\n'
              '                str(task["id"]),\n'
              '                stdout=cp.stdout,\n'
              '                stderr=cp.stderr,\n'
              '                exit_code=1,\n'
              '                session_id=session_id,\n'
              '                usage=usage,\n'
              '                result=result,\n'
              '                error=error,\n'
              '                status=str(updated["status"]),\n'
              '            )\n'
          )
          if old not in text:
              raise SystemExit('expected Codex postprocess dead-end not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          tests = Path('tests/test_ai_team_orchestrator.py')
          test_text = tests.read_text(encoding='utf-8')
          if 'def test_codex_postprocess_retries_recoverable_failures()' not in test_text:
              test_text += (
                  '\n\n\n'
                  'def test_codex_postprocess_retries_recoverable_failures():\n'
                  '    source = MODULE_PATH.read_text()\n'
                  '    assert "CODEX_POSTPROCESS_RETRY_SCHEDULED" in source\n'
                  '    assert "Codex postprocess/finalize failed" in source\n'
                  '    assert "fail_closed_markers" in source\n'
                  '    assert "owner-sensitive live path" in source\n'
                  '    assert "forbidden live-trading enablement" in source\n'
              )
              tests.write_text(test_text, encoding='utf-8')
          PY
          python3 -m pip install 'ruff<1,>=0.9' 'pytest<9,>=8.3' >/dev/null
          ruff check --fix scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          ruff check scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          pytest -q tests/test_ai_team_orchestrator.py
          git config user.name 'AI Team Control'
          git config user.email 'ai-team-control@localhost'
          git add scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          git diff --cached --check
          git commit -m 'Retry recoverable Codex finalize failures'
          gh auth setup-git
          git push origin HEAD:codex/auto-151-5cc33cdb
          echo 'PR153_POSTPROCESS_RETRY_PUSHED=YES'
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
