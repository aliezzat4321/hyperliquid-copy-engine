name: ai-team-trello-manager-wire-temp

on:
  push:
    branches: [trigger/151-protected-lint-fix]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manager/151-protected-self-change
          fetch-depth: 0
          persist-credentials: false

      - name: Fix only known bootstrap lint and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(git branch --show-current)" = "manager/151-protected-self-change"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ai_team_orchestrator.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '                if any(name.startswith(prefix) for prefix in self.cfg["safety"]["no_auto_merge_path_prefixes"])\n',
              '                if any(\n'
              '                    name.startswith(prefix)\n'
              '                    for prefix in self.cfg["safety"]["no_auto_merge_path_prefixes"]\n'
              '                )\n',
          )
          text = text.replace(
              '            if not all(name in AUTO_APPLY_CONTROL_PLANE_PATHS for name in protected_files):\n'
              '                self.block(task, "protected change contains path outside AI control-plane allowlist")\n',
              '            if not all(\n'
              '                name in AUTO_APPLY_CONTROL_PLANE_PATHS for name in protected_files\n'
              '            ):\n'
              '                self.block(\n'
              '                    task, "protected change contains path outside AI control-plane allowlist"\n'
              '                )\n',
          )
          text = text.replace(
              '            if not acceptance_flag(str(issue.get("body") or ""), "AI_TEAM_PROTECTED_CHANGE"):\n'
              '                self.block(task, "protected AI-control-plane change lacks AI_TEAM_PROTECTED_CHANGE=YES")\n',
              '            if not acceptance_flag(\n'
              '                str(issue.get("body") or ""), "AI_TEAM_PROTECTED_CHANGE"\n'
              '            ):\n'
              '                self.block(\n'
              '                    task,\n'
              '                    "protected AI-control-plane change lacks "\n'
              '                    "AI_TEAM_PROTECTED_CHANGE=YES",\n'
              '                )\n',
          )
          p.write_text(text, encoding='utf-8')
          PY
          python3 -m pip install 'ruff<1,>=0.9' >/dev/null
          ruff check scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          python3 -m py_compile scripts/ai_team_orchestrator.py
          git config user.name 'AI Team Control'
          git config user.email 'ai-team-control@localhost'
          git add scripts/ai_team_orchestrator.py
          git diff --cached --check
          git commit -m 'Fix protected control-plane bootstrap lint'
          gh auth setup-git
          git push origin HEAD:manager/151-protected-self-change
          echo 'BOOTSTRAP_LINT_FIX_PUSHED=YES'
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
