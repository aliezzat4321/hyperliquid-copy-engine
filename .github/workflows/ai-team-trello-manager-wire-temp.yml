name: ai-team-trello-manager-wire-temp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run PR153 handoff hardening v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auto-151-5cc33cdb
          fetch-depth: 0
          persist-credentials: false

      - name: Apply hardening patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show origin/main:scripts/temp_pr153_handoff_hardening.py >/tmp/patch.py
          python3 /tmp/patch.py
          python3 -m pip install 'ruff<1,>=0.9' 'pytest<9,>=8.3' >/dev/null
          ruff check --fix scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          ruff check scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          pytest -q tests/test_ai_team_orchestrator.py
          git diff --check
          git config user.name 'AI Team Control'
          git config user.email 'ai-team-control@localhost'
          git add scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          git commit -m 'Harden autonomous handoffs and worker recovery'
          gh auth setup-git
          git push origin HEAD:codex/auto-151-5cc33cdb
          echo 'AUTOMATION_HANDOFF_HARDENING_PUSHED=YES'
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
