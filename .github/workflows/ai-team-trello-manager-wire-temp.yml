name: ai-team-trello-manager-wire-temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-team-trello-manager-wire-temp.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  wire:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Verify credential and boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(id -u)" = 0
          test -f /etc/hyperliquid-ai-team/trello.env
          test "$(stat -c '%a' /etc/hyperliquid-ai-team/trello.env)" = 600
          test "$(stat -c '%u' /etc/hyperliquid-ai-team/trello.env)" = 0
          echo 'TRELLO_CREDENTIAL_FILE=READY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'REAL_TRADING_CHANGE=NO'

      - name: Build protected manager wiring branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=manager/146-trello-vm-wire
          git switch -C "$BRANCH"

          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/trello_team_bridge.py')
          text = p.read_text(encoding='utf-8')
          if 'import re\n' not in text:
              text = text.replace('import os\nimport sqlite3\n', 'import os\nimport re\nimport sqlite3\n')
          text = text.replace('dt.datetime.now(dt.UTC)', 'dt.datetime.now(dt.timezone.utc)')
          text = text.replace('parsed.replace(tzinfo=dt.UTC)', 'parsed.replace(tzinfo=dt.timezone.utc)')
          old = '''    if kind in {"COMPLETED", "MERGED"} or status == "DONE":\n        return "DONE"\n    if kind in {"BLOCKED", "OWNER_ACTION", "AUTH_FAILURE"} or status in {"BLOCKED", "FAILED"}:\n        return "BLOCKED"\n'''
          new = '''    if kind in {"COMPLETED", "MERGED"} or status == "DONE":\n        return "DONE"\n    if kind in {"BLOCKED", "OWNER_ACTION", "AUTH_FAILURE"} or status in {"BLOCKED", "FAILED"}:\n        return "BLOCKED"\n    task_type = str(event.get("task_type", "")).upper()\n    if task_type in {"BUILD", "REPAIR", "RESEARCH"} and status in {\n        "PENDING", "RUNNING", "RETRY", "WAITING_RATE_LIMIT"\n    }:\n        return "IN_PROGRESS"\n'''
          if old not in text:
              raise SystemExit('bridge phase anchor missing')
          text = text.replace(old, new, 1)
          sync_anchor = '\n\ndef sync(event: dict[str, Any], client: Trello, state_path: Path, ledger: Path) -> dict[str, Any]:\n'
          discovery = '''\n\ndef existing_card_for_issue(client: Trello, issue: int) -> str | None:\n    """Reuse an existing open board card carrying this GitHub issue marker."""\n    rows = client.call(\n        "GET", f"/boards/{BOARD_ID}/cards", {"fields": "id,name,desc,closed"}\n    )\n    marker = re.compile(rf"(?<!\\d)#{issue}(?!\\d)")\n    for row in rows if isinstance(rows, list) else []:\n        if row.get("closed"):\n            continue\n        if marker.search(f"{row.get('name', '')}\\n{row.get('desc', '')}"):\n            return str(row["id"])\n    return None\n'''
          if 'def existing_card_for_issue(' not in text:
              if sync_anchor not in text:
                  raise SystemExit('bridge sync anchor missing')
              text = text.replace(sync_anchor, discovery + sync_anchor, 1)
          old = '''    card_id = cards.get(key)\n    title = f"[{event.get('priority', 'P?')}] #{issue} {event.get('title', 'AI team task')}"\n'''
          new = '''    card_id = cards.get(key)\n    if not card_id:\n        card_id = existing_card_for_issue(client, issue)\n        if card_id:\n            cards[key] = card_id\n    title = f"[{event.get('priority', 'P?')}] #{issue} {event.get('title', 'AI team task')}"\n'''
          if old not in text:
              raise SystemExit('bridge card anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('scripts/ai_team_runtime_ledger.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'import re\nimport sqlite3\nfrom pathlib import Path\n',
              'import re\nimport sqlite3\nimport subprocess\nimport sys\nfrom pathlib import Path\n', 1,
          )
          anchor = '''    def _db(self) -> sqlite3.Connection:\n        db = sqlite3.connect(self.db_path)\n        db.row_factory = sqlite3.Row\n        return db\n\n    def event(self, kind: str, **payload: Any) -> dict[str, Any]:\n'''
          replacement = '''    def _db(self) -> sqlite3.Connection:\n        db = sqlite3.connect(self.db_path)\n        db.row_factory = sqlite3.Row\n        return db\n\n    def _trello_event(self, event: dict[str, Any]) -> None:\n        """Project one durable event to Trello; observability can never block execution."""\n        raw_issue = event.get("issue")\n        if raw_issue is None:\n            return\n        try:\n            issue = int(raw_issue)\n        except (TypeError, ValueError):\n            return\n        bridge = Path(__file__).resolve().with_name("trello_team_bridge.py")\n        if not bridge.is_file():\n            return\n        task: dict[str, Any] = {}\n        try:\n            with self._db() as db:\n                row = None\n                assignment_id = event.get("assignment_id")\n                if assignment_id:\n                    row = db.execute("SELECT * FROM tasks WHERE id=? LIMIT 1", (str(assignment_id),)).fetchone()\n                if row is None:\n                    row = db.execute(\n                        "SELECT * FROM tasks WHERE issue_number=? ORDER BY updated_at DESC LIMIT 1",\n                        (issue,),\n                    ).fetchone()\n                if row is not None:\n                    task = dict(row)\n        except (sqlite3.Error, OSError):\n            task = {}\n        outgoing = dict(event)\n        outgoing.update({"repository": self.repository, "issue": issue})\n        if task:\n            outgoing.setdefault("task_type", task.get("task_type"))\n            outgoing.setdefault("agent", task.get("agent"))\n            outgoing.setdefault("model", task.get("model_class"))\n            outgoing.setdefault("status", task.get("status"))\n            outgoing.setdefault("pr", task.get("pr_number"))\n            outgoing.setdefault("sha", task.get("target_sha"))\n            outgoing.setdefault("task_started_at", task.get("created_at"))\n            outgoing.setdefault("phase_started_at", event.get("at") or task.get("updated_at"))\n            outgoing.setdefault("blocker", task.get("last_error"))\n            outgoing.setdefault("next_action", _next_step(task))\n            outgoing.setdefault("owner", task.get("agent"))\n            if str(task.get("task_type")) == "REVIEW":\n                outgoing.setdefault("reviewer_model", f"CLAUDE / {task.get('model_class') or 'SONNET'}")\n        kind = str(outgoing.get("event") or "").upper()\n        task_type = str(outgoing.get("task_type") or "").upper()\n        status = str(outgoing.get("status") or "").upper()\n        if kind == "RUN_STARTED":\n            outgoing["event"] = "REVIEW_STARTED" if task_type == "REVIEW" else "RESEARCH_STARTED" if task_type == "RESEARCH" else "BUILD_STARTED"\n        elif kind == "RUN_FINISHED" and task_type == "REVIEW":\n            if status == "PASS":\n                outgoing.update({"event": "REVIEW_PASS", "status": "WAITING_CI"})\n            elif status in {"FAIL", "FAILED"}:\n                outgoing.update({"event": "REVIEW_FAIL", "status": "FAILED"})\n        elif kind in {"TASK_BLOCKED", "BLOCKED"}:\n            outgoing.update({"event": "BLOCKED", "status": "BLOCKED"})\n        elif "RATE_LIMIT" in kind:\n            outgoing.update({"event": "RATE_LIMIT", "status": "WAITING_RATE_LIMIT"})\n        elif "CI" in kind:\n            outgoing["event"] = "CI_PASS" if status in {"PASS", "SUCCESS", "DONE"} else "CI_FAIL" if status in {"FAIL", "FAILED", "ERROR"} else "CI_PENDING"\n        elif "MERG" in kind:\n            outgoing.update({"event": "MERGED", "status": "DONE"})\n        outgoing.setdefault("result", outgoing.get("status") or outgoing.get("event"))\n        try:\n            meta = subprocess.run(\n                ["gh", "api", f"repos/{self.repository}/issues/{issue}"],\n                text=True, capture_output=True, timeout=10, check=False,\n            )\n            if meta.returncode == 0 and meta.stdout.strip():\n                issue_row = json.loads(meta.stdout)\n                title = str(issue_row.get("title") or "AI team task")\n                outgoing.setdefault("title", title)\n                upper = title.upper()\n                outgoing.setdefault("priority", "P0" if upper.startswith("P0") else "P1" if upper.startswith("P1") else "P?")\n        except (OSError, subprocess.SubprocessError, json.JSONDecodeError):\n            pass\n        try:\n            subprocess.run(\n                [sys.executable, str(bridge)], input=json.dumps(outgoing, separators=(",", ":")),\n                text=True, capture_output=True, timeout=25, check=False,\n            )\n        except (OSError, subprocess.SubprocessError):\n            pass\n\n    def event(self, kind: str, **payload: Any) -> dict[str, Any]:\n'''
          if anchor not in text:
              raise SystemExit('runtime ledger event anchor missing')
          text = text.replace(anchor, replacement, 1)
          tail = '''        with os.fdopen(fd, "a", encoding="utf-8") as handle:\n            handle.write(json.dumps(row, separators=(",", ":"), sort_keys=True) + "\\n")\n        return row\n'''
          tail_new = '''        with os.fdopen(fd, "a", encoding="utf-8") as handle:\n            handle.write(json.dumps(row, separators=(",", ":"), sort_keys=True) + "\\n")\n        self._trello_event(row)\n        return row\n'''
          if tail not in text:
              raise SystemExit('runtime ledger tail anchor missing')
          p.write_text(text.replace(tail, tail_new, 1), encoding='utf-8')

          p = Path('scripts/install_ai_team_orchestrator.sh')
          text = p.read_text(encoding='utf-8')
          text = text.replace('install -d -m 0700 /run/hyperliquid-ai-team "$OPT/scripts" "$OPT/config" "$ETC"\n', 'install -d -m 0700 /run/hyperliquid-ai-team "$OPT/scripts" "$OPT/config" "$ETC"\ninstall -d -m 0700 "$STATE/trello"\n', 1)
          text = text.replace('install -m 0644 "$ROOT/scripts/ai_team_runtime_ledger.py" "$OPT/scripts/ai_team_runtime_ledger.py"\n', 'install -m 0644 "$ROOT/scripts/ai_team_runtime_ledger.py" "$OPT/scripts/ai_team_runtime_ledger.py"\ninstall -m 0755 "$ROOT/scripts/trello_team_bridge.py" "$OPT/scripts/trello_team_bridge.py"\ninstall -m 0755 "$ROOT/scripts/trello_vm_auth.py" "$OPT/scripts/trello_vm_auth.py"\n', 1)
          text = text.replace('ln -sfn "$OPT/scripts/ai_team_auth_claude.sh" /usr/local/sbin/hl-ai-team-auth-claude\n', 'ln -sfn "$OPT/scripts/ai_team_auth_claude.sh" /usr/local/sbin/hl-ai-team-auth-claude\nln -sfn "$OPT/scripts/trello_vm_auth.py" /usr/local/sbin/hl-ai-team-auth-trello\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('.github/workflows/deploy-ai-team-orchestrator.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('      - "scripts/ai_team_runtime_ledger.py"\n', '      - "scripts/ai_team_runtime_ledger.py"\n      - "scripts/trello_team_bridge.py"\n      - "scripts/trello_vm_auth.py"\n', 1)
          text = text.replace('          python3 -m py_compile scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py\n', '          python3 -m py_compile scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py scripts/trello_team_bridge.py scripts/trello_vm_auth.py\n', 1)
          text = text.replace('          test -x /usr/local/sbin/hl-ai-team-auth-codex\n', '          test -x /usr/local/sbin/hl-ai-team-auth-codex\n          test -x /usr/local/sbin/hl-ai-team-auth-trello\n          test -x /opt/hyperliquid-ai-team/scripts/trello_team_bridge.py\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('pyproject.toml')
          text = p.read_text(encoding='utf-8')
          anchor = '"scripts/ai_team_orchestrator.py" = ["UP017"]\n'
          if '"scripts/trello_team_bridge.py" = ["UP017"]' not in text:
              if anchor not in text:
                  raise SystemExit('pyproject anchor missing')
              text = text.replace(anchor, anchor + '"scripts/trello_team_bridge.py" = ["UP017"]\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('docs/ai-team/SYSTEM_MAP.md')
          text = p.read_text(encoding='utf-8')
          if '## Trello team-management projection' not in text:
              text = text.rstrip() + '''\n\n## Trello team-management projection\n\n- `scripts/trello_team_bridge.py`: fail-open event-driven projection of the existing SQLite/GitHub AI-team ledger to Trello. Trello is never execution authority.\n- `scripts/trello_vm_auth.py`: root-only interactive credential setup; `/etc/hyperliquid-ai-team/trello.env` remains mode `0600` and is never exposed to model users.\n- The existing orchestrator/runtime ledger remains canonical. Trello is the durable operator-facing board for owner, reviewer/model, status, result, blocker, ETA and next checkpoint.\n'''
              p.write_text(text + '\n', encoding='utf-8')

          Path('.github/workflows/ai-team-trello-manager-wire-temp.yml').unlink(missing_ok=True)
          Path('.github/workflows/ai-team-trello-manager-review-temp.yml').unlink(missing_ok=True)
          PY

          python3 -m py_compile scripts/trello_team_bridge.py scripts/trello_vm_auth.py scripts/ai_team_runtime_ledger.py scripts/ai_team_orchestrator.py
          bash -n scripts/install_ai_team_orchestrator.sh
          git config user.name 'AI Team Manager'
          git config user.email 'ai-team-manager@localhost'
          git add -A
          git commit -m 'Wire Trello board into VM runtime'
          gh auth setup-git
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title 'Manager: wire Trello task board into VM runtime' \
            --body $'## Objective\nFinish #146 protected VM wiring for the reviewed Trello adapter.\n\n## Scope\nEvent-driven VM ledger → Trello; persistent helper install; Python 3.10 compatibility; existing-card reuse; deployment trigger; no second orchestrator.\n\n## Review\nProtected manager change: exact-SHA Claude Sonnet review + normal CI required before merge.\n\nLIVE-SENSITIVE: NO\nREAL_TRADING_ENABLED remains disabled. Polymarket remains out of scope.'
          echo 'MANAGER_WIRING_PR=OPEN'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
