name: p0-334-baseline-render

on:
  push:
    branches: [codex/334-ci-baseline-unblock]
    paths:
      - ".github/workflows/p0-334-baseline-render.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/334-ci-baseline-unblock
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      - name: Render generated AI-team state
        run: python scripts/render_ai_team_state.py
      - name: Validate AI-team contract
        run: python scripts/validate_ai_team_contract.py
      - name: Validate repository Ruff baseline
        run: ruff check .
      - name: Commit generated output and remove one-shot workflow
        run: |
          git config user.name "ci-baseline-renderer"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ai-team/CURRENT_STATE.md docs/ai-team/experiments/INDEX.md
          git rm .github/workflows/p0-334-baseline-render.yml
          git diff --cached --check
          git commit -m "Regenerate validated AI-team state (#334)"
          git push origin HEAD:codex/334-ci-baseline-unblock
