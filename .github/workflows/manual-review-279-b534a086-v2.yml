name: manual-review-282-deploy-hotfix-removal

on:
  push:
    branches: [manager/review-279-b534a086-v2]
    paths: ['.github/workflows/manual-review-279-b534a086-v2.yml']

permissions:
  contents: read

concurrency:
  group: manual-review-282-deploy-hotfix-removal
  cancel-in-progress: false

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ff31adb8b0b5b1ac31dafe5a9f4c0ec5303a875
          fetch-depth: 0
          persist-credentials: false
      - name: Independent exact-SHA Claude Sonnet review
        shell: bash
        run: |
          set -euo pipefail
          TARGET=9ff31adb8b0b5b1ac31dafe5a9f4c0ec5303a875
          BASE=17b5f88719012cf5d0da1446dc2c6dc5a734ad94
          HOME_DIR=/var/lib/hyperliquid-ai-team/agents/claude/home
          WORKDIR=/var/lib/hyperliquid-ai-team/agents/claude/worktrees/review-pr282
          sudo rm -rf "$WORKDIR" && sudo mkdir -p "$WORKDIR"
          sudo rsync -a --delete "$GITHUB_WORKSPACE/" "$WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$WORKDIR"
          cat > "$WORKDIR/.review_prompt" <<'PROMPT'
          Independently review Hyperliquid PR #282 at exact SHA 9ff31adb8b0b5b1ac31dafe5a9f4c0ec5303a875 with Sonnet.

          REAL TRADING MUST REMAIN DISABLED. Do not use credentials, place orders, change capital/risk authorization, or inspect/discuss Polymarket. You have no GitHub write authority.

          Review ONLY the diff:
          git diff 17b5f88719012cf5d0da1446dc2c6dc5a734ad94..9ff31adb8b0b5b1ac31dafe5a9f4c0ec5303a875 -- .github/workflows/deploy-ai-team-orchestrator.yml
          plus minimum adjacent source context needed.

          Objective: remove the now-obsolete deploy-time merge-405 source injection because #279 made that behavior durable in source. Verify the deletion does not remove required install, compile, service start, timer/status, Hyperliquid-only, or real-trading-off gates; verify it cannot reintroduce stale-PR process-wide fatal behavior because the durable source implementation exists at the reviewed base/main.

          End with exactly:
          REVIEWED_SHA=9ff31adb8b0b5b1ac31dafe5a9f4c0ec5303a875
          VERDICT=PASS
          BLOCKERS_JSON=[]
          Or VERDICT=FAIL with concrete blocker JSON if any merge-blocking defect exists.
          PROMPT
          sudo chown hl-claude-agent:hl-claude-agent "$WORKDIR/.review_prompt"
          PROMPT_TEXT="$(cat "$WORKDIR/.review_prompt")"
          set +e
          timeout 900 sudo systemd-run --pipe --wait --collect --quiet \
            --unit=hl-ai-claude-review-pr282 \
            --uid=hl-claude-agent --gid=hl-claude-agent \
            --working-directory="$WORKDIR" \
            --property=NoNewPrivileges=yes --property=PrivateTmp=yes \
            --property=ProtectHome=yes --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes --property=InaccessiblePaths=/mnt \
            --property="ReadWritePaths=$WORKDIR $HOME_DIR" \
            --setenv="HOME=$HOME_DIR" --setenv="CLAUDE_CONFIG_DIR=$HOME_DIR/.claude" \
            /usr/bin/claude -p --model sonnet --output-format json \
            --permission-mode dontAsk --allowedTools Read,Glob,Grep,Bash --max-turns 12 \
            "$PROMPT_TEXT" > /tmp/pr282-review.json 2>/tmp/pr282-review.err
          RC=$?
          set -e
          echo "CLAUDE_RC=$RC OUT_BYTES=$(wc -c </tmp/pr282-review.json) ERR_BYTES=$(wc -c </tmp/pr282-review.err)"
          if [[ -s /tmp/pr282-review.err ]]; then tail -c 3000 /tmp/pr282-review.err; fi
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          target='9ff31adb8b0b5b1ac31dafe5a9f4c0ec5303a875'
          raw=Path('/tmp/pr282-review.json').read_text(errors='replace')
          if not raw:
              print('REVIEW_OUTPUT=EMPTY'); sys.exit(31)
          try:
              row=json.loads(raw); result=row.get('result','')
              diag={k:v for k,v in row.items() if k not in {'result','usage','modelUsage'}}
              print('CLAUDE_JSON_DIAGNOSTIC='+json.dumps(diag, sort_keys=True)[:4000])
          except Exception:
              result=raw
          print('=== REVIEW RESULT ===')
          print(str(result)[-10000:])
          if not re.search(rf'(?m)^REVIEWED_SHA={target}\s*$',str(result)): sys.exit(32)
          verdict=re.search(r'(?m)^VERDICT=(PASS|FAIL)\s*$',str(result))
          blockers=re.search(r'(?m)^BLOCKERS_JSON=(\[.*\])\s*$',str(result))
          if not verdict or not blockers: sys.exit(33)
          print('MACHINE_VERDICT='+verdict.group(1))
          if verdict.group(1) != 'PASS': sys.exit(34)
          PY
          test "$RC" -eq 0
