name: manual-review-284-external-supervisor-final

on:
  push:
    branches: [manager/review-279-b534a086-v2]
    paths: ['.github/workflows/manual-review-279-b534a086-v2.yml']

permissions:
  contents: read

concurrency:
  group: manual-review-284-external-supervisor-final
  cancel-in-progress: false

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23411b89bb93b78f50de2cc6c23fd97ac76e1f3f
          fetch-depth: 0
          persist-credentials: false
      - name: Independent exact-SHA Claude Sonnet review
        shell: bash
        run: |
          set -euo pipefail
          TARGET=23411b89bb93b78f50de2cc6c23fd97ac76e1f3f
          BASE=dd21b0e88873ae88d9ed92aaa169e2c65d3ec413
          HOME_DIR=/var/lib/hyperliquid-ai-team/agents/claude/home
          WORKDIR=/var/lib/hyperliquid-ai-team/agents/claude/worktrees/review-pr284-final
          sudo rm -rf "$WORKDIR" && sudo mkdir -p "$WORKDIR"
          sudo rsync -a --delete "$GITHUB_WORKSPACE/" "$WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$WORKDIR"
          cat > "$WORKDIR/.review_prompt" <<'PROMPT'
          Independently adversarially review Hyperliquid PR #284 at EXACT SHA 23411b89bb93b78f50de2cc6c23fd97ac76e1f3f against base dd21b0e88873ae88d9ed92aaa169e2c65d3ec413 with Claude Sonnet.

          This is protected control-plane work authorized by owner issue #238. REAL TRADING MUST REMAIN DISABLED. Do not use credentials, place orders, alter capital/risk, or inspect/discuss Polymarket. You have no GitHub write authority.

          Review only the bounded PR diff plus necessary direct context; CI runs separately. Try to falsify:
          - true independence from main orchestrator and separate root-only state/fingerprint;
          - correct stale #130/dead timer/hung service/actionable-no-progress detection;
          - local timer/hang recovery works even if GitHub/#130 fetch is unavailable;
          - future provider waits do not false-trigger;
          - heartbeat/systemd noise cannot reset incident retry budget;
          - deferred recovery cannot burn attempt budget;
          - subprocess/systemctl timeouts are bounded and orchestrator restart is non-blocking;
          - no restart storm, duplicate side effect, review/evidence bypass, or first-install/deploy deadlock;
          - systemd hardening still allows the required supervisor actions and own state writes;
          - no live-trading/order/key/capital authorization and no Polymarket behavior.

          PASS only if there is no merge blocker. Finish with exactly:
          REVIEWED_SHA=23411b89bb93b78f50de2cc6c23fd97ac76e1f3f
          VERDICT=PASS
          BLOCKERS_JSON=[]
          Or VERDICT=FAIL with concrete blocker JSON.
          PROMPT
          sudo chown hl-claude-agent:hl-claude-agent "$WORKDIR/.review_prompt"
          PROMPT_TEXT="$(cat "$WORKDIR/.review_prompt")"
          set +e
          timeout 900 sudo systemd-run --pipe --wait --collect --quiet \
            --unit=hl-ai-claude-review-pr284-final \
            --uid=hl-claude-agent --gid=hl-claude-agent \
            --working-directory="$WORKDIR" \
            --property=NoNewPrivileges=yes --property=PrivateTmp=yes \
            --property=ProtectHome=yes --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes --property=InaccessiblePaths=/mnt \
            --property="ReadWritePaths=$WORKDIR $HOME_DIR" \
            --setenv="HOME=$HOME_DIR" --setenv="CLAUDE_CONFIG_DIR=$HOME_DIR/.claude" \
            /usr/bin/claude -p --model sonnet --output-format json \
            --permission-mode dontAsk --allowedTools Read,Glob,Grep,Bash --max-turns 32 \
            "$PROMPT_TEXT" > /tmp/pr284-final-review.json 2>/tmp/pr284-final-review.err
          RC=$?
          set -e
          echo "CLAUDE_RC=$RC OUT_BYTES=$(wc -c </tmp/pr284-final-review.json) ERR_BYTES=$(wc -c </tmp/pr284-final-review.err)"
          if [[ -s /tmp/pr284-final-review.err ]]; then tail -c 3000 /tmp/pr284-final-review.err; fi
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          target='23411b89bb93b78f50de2cc6c23fd97ac76e1f3f'
          raw=Path('/tmp/pr284-final-review.json').read_text(errors='replace')
          if not raw:
              print('REVIEW_OUTPUT=EMPTY'); sys.exit(31)
          try:
              row=json.loads(raw); result=row.get('result','')
              diag={k:v for k,v in row.items() if k not in {'result','usage','modelUsage'}}
              print('CLAUDE_JSON_DIAGNOSTIC='+json.dumps(diag, sort_keys=True)[:4000])
          except Exception:
              result=raw
          print('=== REVIEW RESULT ===')
          print(str(result)[-12000:])
          if not re.search(rf'(?m)^REVIEWED_SHA={target}\s*$',str(result)): sys.exit(32)
          verdict=re.search(r'(?m)^VERDICT=(PASS|FAIL)\s*$',str(result))
          blockers=re.search(r'(?m)^BLOCKERS_JSON=(\[.*\])\s*$',str(result))
          if not verdict or not blockers: sys.exit(33)
          print('MACHINE_VERDICT='+verdict.group(1))
          if verdict.group(1) != 'PASS': sys.exit(34)
          PY
          test "$RC" -eq 0
