name: manual-review-279-b534a086-v2

on:
  push:
    branches: [manager/review-279-b534a086-v2]
    paths: ['.github/workflows/manual-review-279-b534a086-v2.yml']

permissions:
  contents: read

concurrency:
  group: manual-review-279-b534a086-v2
  cancel-in-progress: false

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b534a0869502789458164b74b491aa7f46996f99
          fetch-depth: 0
          persist-credentials: false
      - name: Diagnose Claude executable and auth path
        shell: bash
        run: |
          set -euo pipefail
          echo "CLAUDE_LINK=$(readlink /usr/bin/claude || true)"
          echo "CLAUDE_REALPATH=$(readlink -f /usr/bin/claude || true)"
          ls -l /usr/bin/claude || true
          test -x /usr/bin/claude
          test -f /var/lib/hyperliquid-ai-team/agents/claude/home/.claude/.credentials.json
          if test -s /etc/hyperliquid-ai-team/claude.env; then echo 'CLAUDE_ENV_FILE=PRESENT'; else echo 'CLAUDE_ENV_FILE=ABSENT'; fi
          set +e
          sudo -u hl-claude-agent env HOME=/var/lib/hyperliquid-ai-team/agents/claude/home CLAUDE_CONFIG_DIR=/var/lib/hyperliquid-ai-team/agents/claude/home/.claude /usr/bin/claude --version > /tmp/claude-version.out 2>&1
          echo "VERSION_RC=$?"
          cat /tmp/claude-version.out | tail -c 1000
          set -e
      - name: Compare direct and sandboxed Claude probes
        shell: bash
        run: |
          set -euo pipefail
          HOME_DIR=/var/lib/hyperliquid-ai-team/agents/claude/home
          WORKDIR=/var/lib/hyperliquid-ai-team/agents/claude/worktrees/diagnose-pr279
          sudo rm -rf "$WORKDIR" && sudo mkdir -p "$WORKDIR"
          sudo rsync -a --delete "$GITHUB_WORKSPACE/" "$WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$WORKDIR"

          set +e
          sudo -u hl-claude-agent env HOME="$HOME_DIR" CLAUDE_CONFIG_DIR="$HOME_DIR/.claude" timeout 45 /usr/bin/claude -p --model sonnet --output-format json 'Reply exactly: CLAUDE_DIRECT_OK' > /tmp/direct.out 2>/tmp/direct.err
          DIRECT_RC=$?
          echo "DIRECT_RC=$DIRECT_RC DIRECT_OUT_BYTES=$(wc -c </tmp/direct.out) DIRECT_ERR_BYTES=$(wc -c </tmp/direct.err)"
          python3 - <<'PY'
          from pathlib import Path
          for p in ['/tmp/direct.out','/tmp/direct.err']:
              s=Path(p).read_text(errors='replace')
              print(Path(p).name+': '+s[-1500:].replace('\n',' ')[:1500])
          PY

          sudo systemd-run --pipe --wait --collect --quiet \
            --unit=hl-ai-claude-diagnose-pr279 \
            --uid=hl-claude-agent --gid=hl-claude-agent \
            --working-directory="$WORKDIR" \
            --property=NoNewPrivileges=yes --property=PrivateTmp=yes \
            --property=ProtectHome=yes --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes --property=InaccessiblePaths=/mnt \
            --property="ReadWritePaths=$WORKDIR $HOME_DIR" \
            --setenv="HOME=$HOME_DIR" --setenv="CLAUDE_CONFIG_DIR=$HOME_DIR/.claude" \
            /usr/bin/claude -p --model sonnet --output-format json 'Reply exactly: CLAUDE_SANDBOX_OK' > /tmp/sandbox.out 2>/tmp/sandbox.err
          SANDBOX_RC=$?
          echo "SANDBOX_RC=$SANDBOX_RC SANDBOX_OUT_BYTES=$(wc -c </tmp/sandbox.out) SANDBOX_ERR_BYTES=$(wc -c </tmp/sandbox.err)"
          python3 - <<'PY'
          from pathlib import Path
          for p in ['/tmp/sandbox.out','/tmp/sandbox.err']:
              s=Path(p).read_text(errors='replace')
              print(Path(p).name+': '+s[-1500:].replace('\n',' ')[:1500])
          PY
          set -e

          if [[ "$DIRECT_RC" -eq 0 && "$SANDBOX_RC" -eq 0 ]]; then
            echo 'CLAUDE_PROBE_CLASS=HEALTHY'
          elif [[ "$DIRECT_RC" -eq 0 ]]; then
            echo 'CLAUDE_PROBE_CLASS=SANDBOX_REGRESSION'
            exit 21
          else
            echo 'CLAUDE_PROBE_CLASS=AUTH_OR_PROVIDER_OR_INSTALL'
            exit 22
          fi
