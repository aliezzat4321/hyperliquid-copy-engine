name: manual-review-279-b534a086-v2

on:
  push:
    branches: [manager/review-279-b534a086-v2]
    paths: ['.github/workflows/manual-review-279-b534a086-v2.yml']

permissions:
  contents: read

concurrency:
  group: manual-review-279-b534a086-v2
  cancel-in-progress: false

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b534a0869502789458164b74b491aa7f46996f99
          fetch-depth: 0
          persist-credentials: false
      - name: Independent exact-SHA Claude Sonnet review
        shell: bash
        run: |
          set -euo pipefail
          TARGET=b534a0869502789458164b74b491aa7f46996f99
          BASE=e76ba0fde765cee70f73fb379bd701b6daf136e7
          HOME_DIR=/var/lib/hyperliquid-ai-team/agents/claude/home
          WORKDIR=/var/lib/hyperliquid-ai-team/agents/claude/worktrees/review-pr279-final
          sudo rm -rf "$WORKDIR" && sudo mkdir -p "$WORKDIR"
          sudo rsync -a --delete "$GITHUB_WORKSPACE/" "$WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$WORKDIR"
          cat > "$WORKDIR/.review_prompt" <<'PROMPT'
          You are CLAUDE, the independent adversarial reviewer for the Hyperliquid project. Review exactly PR #279 at exact SHA b534a0869502789458164b74b491aa7f46996f99 using Sonnet.

          Hard boundaries: REAL TRADING REMAINS DISABLED. Flag any attempt to enable live/real trading, add/use trading keys, place orders, change capital/risk authorization, or bypass LIVE_TRADING_GATE. Do not access or discuss Polymarket. You have no GitHub credentials and must not push, merge, or comment.

          Read AGENTS.md and docs/ai-team/CURRENT_STATE.md. Review ONLY the bounded delta:
          git diff e76ba0fde765cee70f73fb379bd701b6daf136e7..b534a0869502789458164b74b491aa7f46996f99 -- scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py tests/test_invo_durable_identity_attestation_v1.py
          plus necessary adjacent context. Do not recursively audit the repository.

          Objective: repair #277/#238 scheduler reconciliation so stale retries and false owner blocks cannot suppress unrelated lanes; retire closed-issue tasks; make wait/retry states task-local; preserve exact-SHA review, CI and safety gates. The Lane-2 test-only change aligns the regression with already-merged cf4b7a2 identity-local quarantine semantics.

          Try to falsify these claims: genuine owner authorization failures still fail closed; historical protected-scope mismatch is not falsely published as owner action; closed #146-like tasks cannot execute; READY admission does not create duplicate active work or bypass review; scheduling avoids stale-retry starvation without unsafe worker concurrency; errored builders cannot create invalid review handoffs; Lane-2 conflicting proof test matches production semantics without weakening identity safety; no live-trading boundary changes.

          Run only narrow relevant tests if useful. At the very end emit exactly these three machine-readable lines for a pass:
          REVIEWED_SHA=b534a0869502789458164b74b491aa7f46996f99
          VERDICT=PASS
          BLOCKERS_JSON=[]
          If any merge-blocking defect exists, use VERDICT=FAIL and put concrete blocker objects in BLOCKERS_JSON while preserving the exact REVIEWED_SHA.
          PROMPT
          sudo chown hl-claude-agent:hl-claude-agent "$WORKDIR/.review_prompt"

          PROMPT_TEXT="$(cat "$WORKDIR/.review_prompt")"
          set +e
          timeout 900 sudo systemd-run --pipe --wait --collect --quiet \
            --unit=hl-ai-claude-review-pr279-final \
            --uid=hl-claude-agent --gid=hl-claude-agent \
            --working-directory="$WORKDIR" \
            --property=NoNewPrivileges=yes --property=PrivateTmp=yes \
            --property=ProtectHome=yes --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes --property=InaccessiblePaths=/mnt \
            --property="ReadWritePaths=$WORKDIR $HOME_DIR" \
            --setenv="HOME=$HOME_DIR" --setenv="CLAUDE_CONFIG_DIR=$HOME_DIR/.claude" \
            /usr/bin/claude -p --model sonnet --output-format json \
            --permission-mode dontAsk --allowedTools Read,Glob,Grep,Bash --max-turns 12 \
            "$PROMPT_TEXT" > /tmp/pr279-final-review.json 2>/tmp/pr279-final-review.err
          RC=$?
          set -e
          echo "CLAUDE_RC=$RC OUT_BYTES=$(wc -c </tmp/pr279-final-review.json) ERR_BYTES=$(wc -c </tmp/pr279-final-review.err)"
          if [[ -s /tmp/pr279-final-review.err ]]; then tail -c 3000 /tmp/pr279-final-review.err; fi
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          target='b534a0869502789458164b74b491aa7f46996f99'
          raw=Path('/tmp/pr279-final-review.json').read_text(errors='replace')
          if not raw:
              print('REVIEW_OUTPUT=EMPTY')
              sys.exit(31)
          try:
              row=json.loads(raw)
              result=row.get('result','')
          except Exception:
              result=raw
          print('=== REVIEW RESULT ===')
          print(str(result)[-10000:])
          if not re.search(rf'(?m)^REVIEWED_SHA={target}\s*$',str(result)):
              sys.exit(32)
          verdict=re.search(r'(?m)^VERDICT=(PASS|FAIL)\s*$',str(result))
          blockers=re.search(r'(?m)^BLOCKERS_JSON=(\[.*\])\s*$',str(result))
          if not verdict or not blockers:
              sys.exit(33)
          print('MACHINE_VERDICT='+verdict.group(1))
          PY
          test "$RC" -eq 0
