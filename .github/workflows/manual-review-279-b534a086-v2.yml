name: manual-review-283-closed-task-reconciliation-v2

on:
  push:
    branches: [manager/review-279-b534a086-v2]
    paths: ['.github/workflows/manual-review-279-b534a086-v2.yml']

permissions:
  contents: read

concurrency:
  group: manual-review-283-closed-task-reconciliation-v2
  cancel-in-progress: false

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 01a228ad8ad802c08fe429003ad8d3a93843e462
          fetch-depth: 0
          persist-credentials: false
      - name: Independent exact-SHA Claude Sonnet re-review
        shell: bash
        run: |
          set -euo pipefail
          TARGET=01a228ad8ad802c08fe429003ad8d3a93843e462
          HOME_DIR=/var/lib/hyperliquid-ai-team/agents/claude/home
          WORKDIR=/var/lib/hyperliquid-ai-team/agents/claude/worktrees/review-pr283-v2
          sudo rm -rf "$WORKDIR" && sudo mkdir -p "$WORKDIR"
          sudo rsync -a --delete "$GITHUB_WORKSPACE/" "$WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$WORKDIR"
          cat > "$WORKDIR/.review_prompt" <<'PROMPT'
          Review Hyperliquid PR #283 at EXACT SHA 01a228ad8ad802c08fe429003ad8d3a93843e462. This is independent Sonnet review. REAL TRADING remains disabled. Do not use credentials, place orders, change capital/risk, or inspect Polymarket. No GitHub writes.

          Do NOT run tests; CI is already green. Do NOT inspect unrelated files. Spend your turns only on the bounded diff and direct call-sites:
          git diff dcf72f6fbd44983d5b8615c4d97b5514267a4044..01a228ad8ad802c08fe429003ad8d3a93843e462 -- scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py

          Decide whether these changes safely fix the two runtime defects:
          1) closed active tasks (specifically closed RETRY #146) must be proactively retired before admission/due dispatch, even if PENDING work always outranks RETRY;
          2) WAITING_EVIDENCE_WINDOW must count as active because due() already treats it as schedulable.

          Check only: closed vs open/unknown issue handling; row status/lifecycle clearing; ordering in cycle; duplicate/concurrency implications; ACTIVE_STATUSES consistency; no review/safety/live-trading bypass. The guarded full orchestrator tests, Ruff, compile and safety scan already passed; inspect code logic rather than repeating them.

          You MUST finish with exactly three machine lines, even if uncertain. PASS only if no merge blocker; otherwise FAIL with concrete blocker JSON:
          REVIEWED_SHA=01a228ad8ad802c08fe429003ad8d3a93843e462
          VERDICT=PASS
          BLOCKERS_JSON=[]
          PROMPT
          sudo chown hl-claude-agent:hl-claude-agent "$WORKDIR/.review_prompt"
          PROMPT_TEXT="$(cat "$WORKDIR/.review_prompt")"
          set +e
          timeout 900 sudo systemd-run --pipe --wait --collect --quiet \
            --unit=hl-ai-claude-review-pr283-v2 \
            --uid=hl-claude-agent --gid=hl-claude-agent \
            --working-directory="$WORKDIR" \
            --property=NoNewPrivileges=yes --property=PrivateTmp=yes \
            --property=ProtectHome=yes --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes --property=InaccessiblePaths=/mnt \
            --property="ReadWritePaths=$WORKDIR $HOME_DIR" \
            --setenv="HOME=$HOME_DIR" --setenv="CLAUDE_CONFIG_DIR=$HOME_DIR/.claude" \
            /usr/bin/claude -p --model sonnet --output-format json \
            --permission-mode dontAsk --allowedTools Read,Glob,Grep,Bash --max-turns 32 \
            "$PROMPT_TEXT" > /tmp/pr283-review-v2.json 2>/tmp/pr283-review-v2.err
          RC=$?
          set -e
          echo "CLAUDE_RC=$RC OUT_BYTES=$(wc -c </tmp/pr283-review-v2.json) ERR_BYTES=$(wc -c </tmp/pr283-review-v2.err)"
          if [[ -s /tmp/pr283-review-v2.err ]]; then tail -c 3000 /tmp/pr283-review-v2.err; fi
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          target='01a228ad8ad802c08fe429003ad8d3a93843e462'
          raw=Path('/tmp/pr283-review-v2.json').read_text(errors='replace')
          if not raw:
              print('REVIEW_OUTPUT=EMPTY'); sys.exit(31)
          try:
              row=json.loads(raw); result=row.get('result','')
              diag={k:v for k,v in row.items() if k not in {'result','usage','modelUsage'}}
              print('CLAUDE_JSON_DIAGNOSTIC='+json.dumps(diag, sort_keys=True)[:4000])
          except Exception:
              result=raw
          print('=== REVIEW RESULT ===')
          print(str(result)[-12000:])
          if not re.search(rf'(?m)^REVIEWED_SHA={target}\s*$',str(result)): sys.exit(32)
          verdict=re.search(r'(?m)^VERDICT=(PASS|FAIL)\s*$',str(result))
          blockers=re.search(r'(?m)^BLOCKERS_JSON=(\[.*\])\s*$',str(result))
          if not verdict or not blockers: sys.exit(33)
          print('MACHINE_VERDICT='+verdict.group(1))
          if verdict.group(1) != 'PASS': sys.exit(34)
          PY
          test "$RC" -eq 0
