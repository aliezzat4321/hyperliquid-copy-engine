name: manual-review-279-b534a086-v2

on:
  push:
    branches: [manager/review-279-b534a086-v2]
    paths: ['.github/workflows/manual-review-279-b534a086-v2.yml']

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: manual-review-279-b534a086-v2
  cancel-in-progress: false

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b534a0869502789458164b74b491aa7f46996f99
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight isolated Claude runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/claude
          test -f /var/lib/hyperliquid-ai-team/agents/claude/home/.claude/.credentials.json
          echo 'CLAUDE_BINARY=OK'
          echo 'CLAUDE_CREDENTIAL=AVAILABLE'
      - name: Independent exact-SHA Claude review with diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET=b534a0869502789458164b74b491aa7f46996f99
          BASE=e76ba0fde765cee70f73fb379bd701b6daf136e7
          WORKDIR=/var/lib/hyperliquid-ai-team/agents/claude/worktrees/manual-pr279-b534a086-v2
          CLAUDE_HOME=/var/lib/hyperliquid-ai-team/agents/claude/home
          sudo rm -rf "$WORKDIR"
          sudo mkdir -p "$WORKDIR"
          sudo rsync -a --delete "$GITHUB_WORKSPACE/" "$WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$WORKDIR"
          cat > /tmp/pr279-review-prompt-v2.txt <<'PROMPT'
          You are CLAUDE, the independent adversarial reviewer for the Hyperliquid project.
          Review exactly PR #279 at exact SHA b534a0869502789458164b74b491aa7f46996f99 using SONNET.
          REAL TRADING REMAINS DISABLED. Never enable/use keys/place orders/change capital authorization/bypass LIVE_TRADING_GATE. Do not access or discuss Polymarket. You have no GitHub credentials.
          Read AGENTS.md and docs/ai-team/CURRENT_STATE.md, then review ONLY:
          git diff e76ba0fde765cee70f73fb379bd701b6daf136e7..b534a0869502789458164b74b491aa7f46996f99 -- scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py tests/test_invo_durable_identity_attestation_v1.py
          plus only necessary adjacent context. Do not recursively audit the repository.

          Objective: repair #277/#238 scheduler reconciliation so stale retries and false owner blocks cannot suppress unrelated lanes; retire closed issue tasks; make waits/retries task-local; preserve review/safety gates. The Lane-2 test-only change aligns with already-merged cf4b7a2 identity-local quarantine semantics.

          Verify especially genuine owner-auth failures remain fail-closed; protected-scope mismatch does not falsely become owner action; closed #146-like tasks cannot execute; queue admission does not create duplicate active work or bypass review; scheduling does not introduce unsafe concurrency; Lane-2 conflicting proof test matches source semantics without weakening identity safety; no live-trading boundary changes.

          At the very end emit exactly three machine lines. For pass:
          REVIEWED_SHA=b534a0869502789458164b74b491aa7f46996f99
          VERDICT=PASS
          BLOCKERS_JSON=[]
          For failure use VERDICT=FAIL and a concrete JSON array in BLOCKERS_JSON while preserving the exact REVIEWED_SHA.
          PROMPT

          set +e
          sudo systemd-run --pipe --wait --collect --quiet \
            --unit=hl-ai-claude-manual-pr279-b534-v2 \
            --uid=hl-claude-agent --gid=hl-claude-agent \
            --working-directory="$WORKDIR" \
            --property=NoNewPrivileges=yes \
            --property=PrivateTmp=yes \
            --property=ProtectHome=yes \
            --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes \
            --property=InaccessiblePaths=/mnt \
            --property="ReadWritePaths=$WORKDIR $CLAUDE_HOME" \
            --setenv="HOME=$CLAUDE_HOME" \
            --setenv="CLAUDE_CONFIG_DIR=$CLAUDE_HOME/.claude" \
            /usr/bin/claude -p --model sonnet --output-format json \
            --permission-mode dontAsk --allowedTools Read,Glob,Grep,Bash --max-turns 12 \
            < /tmp/pr279-review-prompt-v2.txt > /tmp/pr279-review-v2.json 2> /tmp/pr279-review-v2.err
          rc=$?
          set -e
          echo "CLAUDE_RC=$rc"
          if [[ -s /tmp/pr279-review-v2.err ]]; then
            echo '=== CLAUDE STDERR (BOUNDED) ==='
            tail -c 5000 /tmp/pr279-review-v2.err | sed -E 's/(sk-ant-[A-Za-z0-9_-]+)/[REDACTED]/g'
          fi
          if [[ -s /tmp/pr279-review-v2.json ]]; then
            echo '=== CLAUDE OUTPUT SUMMARY ==='
            python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/pr279-review-v2.json').read_text(errors='replace')
          try:
              row=json.loads(raw)
              result=row.get('result','')
              print(str(result)[-6000:])
          except Exception:
              print(raw[-3000:])
          PY
          fi
          if [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          fi
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          target='b534a0869502789458164b74b491aa7f46996f99'
          row=json.loads(Path('/tmp/pr279-review-v2.json').read_text())
          result=row.get('result','')
          if not isinstance(result,str) or not re.search(rf'(?m)^REVIEWED_SHA={target}\s*$',result):
              raise SystemExit('review omitted exact target SHA')
          if not re.search(r'(?m)^VERDICT=(PASS|FAIL)\s*$',result):
              raise SystemExit('review omitted verdict')
          if not re.search(r'(?m)^BLOCKERS_JSON=\[.*\]\s*$',result):
              raise SystemExit('review omitted blockers JSON')
          Path('/tmp/pr279-review-comment-v2.txt').write_text(
              '<!-- MANUAL_ISOLATED_CLAUDE_REVIEW_V2 -->\nREVIEWER=CLAUDE\nMODEL_CLASS=SONNET\n'
              f'REVIEWED_SHA={target}\n\n'+result[:12000]
          )
          PY
          gh api repos/aliezzat4321/hyperliquid-copy-engine/issues/279/comments \
            -f body="$(cat /tmp/pr279-review-comment-v2.txt)"
