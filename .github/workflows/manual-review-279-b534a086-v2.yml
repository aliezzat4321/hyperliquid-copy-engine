name: manual-review-279-85686109

on:
  push:
    branches: [manager/review-279-b534a086-v2]
    paths: ['.github/workflows/manual-review-279-b534a086-v2.yml']

permissions:
  contents: read

concurrency:
  group: manual-review-279-85686109
  cancel-in-progress: false

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 856861095dad1a863c77a048a457e5cdd9fb382d
          fetch-depth: 0
          persist-credentials: false
      - name: Independent exact-SHA Claude Sonnet re-review
        shell: bash
        run: |
          set -euo pipefail
          TARGET=856861095dad1a863c77a048a457e5cdd9fb382d
          PREVIOUS=b534a0869502789458164b74b491aa7f46996f99
          HOME_DIR=/var/lib/hyperliquid-ai-team/agents/claude/home
          WORKDIR=/var/lib/hyperliquid-ai-team/agents/claude/worktrees/review-pr279-85686109
          sudo rm -rf "$WORKDIR" && sudo mkdir -p "$WORKDIR"
          sudo rsync -a --delete "$GITHUB_WORKSPACE/" "$WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$WORKDIR"
          cat > "$WORKDIR/.review_prompt" <<'PROMPT'
          You are CLAUDE SONNET, the independent adversarial reviewer for Hyperliquid PR #279. Review exact SHA 856861095dad1a863c77a048a457e5cdd9fb382d.

          Hard boundaries: REAL TRADING REMAINS DISABLED. Flag any attempt to enable live/real trading, add/use keys, place orders, change capital/risk authorization, or bypass LIVE_TRADING_GATE. Do not access or discuss Polymarket. You have no GitHub credentials and must not push, merge, or comment.

          This is a re-review after your prior exact-SHA FAIL at b534a0869502789458164b74b491aa7f46996f99. The prior blocker was deterministic PENDING starvation under sustained READY inflow because due() ordered newly admitted PENDING work newest-first and did not persist queue priority.

          Review the prior blocker plus ONLY this repair delta and necessary adjacent context:
          git diff b534a0869502789458164b74b491aa7f46996f99..856861095dad1a863c77a048a457e5cdd9fb382d -- scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py

          Verify specifically:
          - queue priority is persisted durably and safely migrated for existing SQLite ledgers;
          - PENDING selection is priority-first and starvation-safe for same-priority older admissions under sustained new arrivals;
          - stale RETRY work such as closed #146 cannot suppress runnable PENDING work;
          - the updated regression does not weaken intended retry/CI/provider semantics;
          - no unsafe concurrent worker behavior is introduced;
          - all previous #279 safety properties remain intact in necessary adjacent context.

          Narrow pre-push gate already passed the full tests/test_ai_team_orchestrator.py suite (131 passed), py_compile, ruff check and git diff safety scan. Independently try to falsify the implementation; do not trust that claim without inspection.

          At the very end emit exactly these machine-readable lines for a pass:
          REVIEWED_SHA=856861095dad1a863c77a048a457e5cdd9fb382d
          VERDICT=PASS
          BLOCKERS_JSON=[]
          If a merge-blocking defect exists, use VERDICT=FAIL with concrete blocker objects and preserve exact REVIEWED_SHA.
          PROMPT
          sudo chown hl-claude-agent:hl-claude-agent "$WORKDIR/.review_prompt"
          PROMPT_TEXT="$(cat "$WORKDIR/.review_prompt")"
          set +e
          timeout 900 sudo systemd-run --pipe --wait --collect --quiet \
            --unit=hl-ai-claude-review-pr279-85686109 \
            --uid=hl-claude-agent --gid=hl-claude-agent \
            --working-directory="$WORKDIR" \
            --property=NoNewPrivileges=yes --property=PrivateTmp=yes \
            --property=ProtectHome=yes --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes --property=InaccessiblePaths=/mnt \
            --property="ReadWritePaths=$WORKDIR $HOME_DIR" \
            --setenv="HOME=$HOME_DIR" --setenv="CLAUDE_CONFIG_DIR=$HOME_DIR/.claude" \
            /usr/bin/claude -p --model sonnet --output-format json \
            --permission-mode dontAsk --allowedTools Read,Glob,Grep,Bash --max-turns 12 \
            "$PROMPT_TEXT" > /tmp/pr279-85686109-review.json 2>/tmp/pr279-85686109-review.err
          RC=$?
          set -e
          echo "CLAUDE_RC=$RC OUT_BYTES=$(wc -c </tmp/pr279-85686109-review.json) ERR_BYTES=$(wc -c </tmp/pr279-85686109-review.err)"
          if [[ -s /tmp/pr279-85686109-review.err ]]; then tail -c 3000 /tmp/pr279-85686109-review.err; fi
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          target='856861095dad1a863c77a048a457e5cdd9fb382d'
          raw=Path('/tmp/pr279-85686109-review.json').read_text(errors='replace')
          if not raw:
              print('REVIEW_OUTPUT=EMPTY')
              sys.exit(31)
          try:
              row=json.loads(raw)
              result=row.get('result','')
          except Exception:
              result=raw
          print('=== REVIEW RESULT ===')
          print(str(result)[-10000:])
          if not re.search(rf'(?m)^REVIEWED_SHA={target}\s*$',str(result)):
              sys.exit(32)
          verdict=re.search(r'(?m)^VERDICT=(PASS|FAIL)\s*$',str(result))
          blockers=re.search(r'(?m)^BLOCKERS_JSON=(\[.*\])\s*$',str(result))
          if not verdict or not blockers:
              sys.exit(33)
          print('MACHINE_VERDICT='+verdict.group(1))
          if verdict.group(1) != 'PASS':
              sys.exit(34)
          PY
          test "$RC" -eq 0
