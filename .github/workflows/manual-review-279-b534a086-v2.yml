name: manual-review-284-external-supervisor

on:
  push:
    branches: [manager/review-279-b534a086-v2]
    paths: ['.github/workflows/manual-review-279-b534a086-v2.yml']

permissions:
  contents: read

concurrency:
  group: manual-review-284-external-supervisor
  cancel-in-progress: false

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d5dfc5c3a801d05ea933053c6c0b0047c564e68
          fetch-depth: 0
          persist-credentials: false
      - name: Independent exact-SHA Claude Sonnet review
        shell: bash
        run: |
          set -euo pipefail
          TARGET=0d5dfc5c3a801d05ea933053c6c0b0047c564e68
          BASE=dd21b0e88873ae88d9ed92aaa169e2c65d3ec413
          HOME_DIR=/var/lib/hyperliquid-ai-team/agents/claude/home
          WORKDIR=/var/lib/hyperliquid-ai-team/agents/claude/worktrees/review-pr284
          sudo rm -rf "$WORKDIR" && sudo mkdir -p "$WORKDIR"
          sudo rsync -a --delete "$GITHUB_WORKSPACE/" "$WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$WORKDIR"
          cat > "$WORKDIR/.review_prompt" <<'PROMPT'
          Independently adversarially review Hyperliquid PR #284 at EXACT SHA 0d5dfc5c3a801d05ea933053c6c0b0047c564e68 against base dd21b0e88873ae88d9ed92aaa169e2c65d3ec413 with Claude Sonnet.

          This is protected control-plane work authorized by owner issue #238. REAL TRADING MUST REMAIN DISABLED. Do not use credentials, place orders, alter capital/risk, or inspect/discuss Polymarket. You have no GitHub write authority.

          Review the bounded PR diff and only necessary direct context. Do not run the full test suite; CI is separate. Try to falsify these invariants:
          - supervisor is genuinely independent of the main orchestrator process/state machine and persists its own root-only state/fingerprint;
          - stale #130, dead timer, hung orchestrator and actionable no-progress are detected correctly;
          - legitimate future provider/rate-limit waits do not trigger false recovery;
          - incident identity remains stable across changing heartbeats/transient service state, so cooldown/budget cannot be reset by noise;
          - deferred recovery while the orchestrator is still legitimately active does not consume recovery attempts;
          - bounded recovery cannot create restart storms or bypass review/evidence gates;
          - installer + systemd unit + separate deploy workflow are practical, idempotent, and truly independent enough to recover the orchestrator when it stalls;
          - service hardening still permits required `systemctl`/GitHub-read actions and state writes;
          - no live-trading/order/key/capital authorization or Polymarket behavior is introduced.

          Pay special attention to runtime/systemd semantics, fingerprint/cooldown correctness, first-install deployment, and whether a fault can disable both orchestrator and supervisor through a shared dependency. If any merge-blocking defect exists, FAIL with concrete blockers.

          Finish with exactly:
          REVIEWED_SHA=0d5dfc5c3a801d05ea933053c6c0b0047c564e68
          VERDICT=PASS
          BLOCKERS_JSON=[]
          Or VERDICT=FAIL with concrete blocker JSON.
          PROMPT
          sudo chown hl-claude-agent:hl-claude-agent "$WORKDIR/.review_prompt"
          PROMPT_TEXT="$(cat "$WORKDIR/.review_prompt")"
          set +e
          timeout 900 sudo systemd-run --pipe --wait --collect --quiet \
            --unit=hl-ai-claude-review-pr284 \
            --uid=hl-claude-agent --gid=hl-claude-agent \
            --working-directory="$WORKDIR" \
            --property=NoNewPrivileges=yes --property=PrivateTmp=yes \
            --property=ProtectHome=yes --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes --property=InaccessiblePaths=/mnt \
            --property="ReadWritePaths=$WORKDIR $HOME_DIR" \
            --setenv="HOME=$HOME_DIR" --setenv="CLAUDE_CONFIG_DIR=$HOME_DIR/.claude" \
            /usr/bin/claude -p --model sonnet --output-format json \
            --permission-mode dontAsk --allowedTools Read,Glob,Grep,Bash --max-turns 32 \
            "$PROMPT_TEXT" > /tmp/pr284-review.json 2>/tmp/pr284-review.err
          RC=$?
          set -e
          echo "CLAUDE_RC=$RC OUT_BYTES=$(wc -c </tmp/pr284-review.json) ERR_BYTES=$(wc -c </tmp/pr284-review.err)"
          if [[ -s /tmp/pr284-review.err ]]; then tail -c 3000 /tmp/pr284-review.err; fi
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          target='0d5dfc5c3a801d05ea933053c6c0b0047c564e68'
          raw=Path('/tmp/pr284-review.json').read_text(errors='replace')
          if not raw:
              print('REVIEW_OUTPUT=EMPTY'); sys.exit(31)
          try:
              row=json.loads(raw); result=row.get('result','')
              diag={k:v for k,v in row.items() if k not in {'result','usage','modelUsage'}}
              print('CLAUDE_JSON_DIAGNOSTIC='+json.dumps(diag, sort_keys=True)[:4000])
          except Exception:
              result=raw
          print('=== REVIEW RESULT ===')
          print(str(result)[-12000:])
          if not re.search(rf'(?m)^REVIEWED_SHA={target}\s*$',str(result)): sys.exit(32)
          verdict=re.search(r'(?m)^VERDICT=(PASS|FAIL)\s*$',str(result))
          blockers=re.search(r'(?m)^BLOCKERS_JSON=(\[.*\])\s*$',str(result))
          if not verdict or not blockers: sys.exit(33)
          print('MACHINE_VERDICT='+verdict.group(1))
          if verdict.group(1) != 'PASS': sys.exit(34)
          PY
          test "$RC" -eq 0
