name: manual-review-279-85686109-v2

on:
  push:
    branches: [manager/review-279-b534a086-v2]
    paths: ['.github/workflows/manual-review-279-b534a086-v2.yml']

permissions:
  contents: read

concurrency:
  group: manual-review-279-85686109-v2
  cancel-in-progress: false

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 856861095dad1a863c77a048a457e5cdd9fb382d
          fetch-depth: 0
          persist-credentials: false
      - name: Independent exact-SHA Claude Sonnet re-review
        shell: bash
        run: |
          set -euo pipefail
          TARGET=856861095dad1a863c77a048a457e5cdd9fb382d
          HOME_DIR=/var/lib/hyperliquid-ai-team/agents/claude/home
          WORKDIR=/var/lib/hyperliquid-ai-team/agents/claude/worktrees/review-pr279-85686109-v2
          sudo rm -rf "$WORKDIR" && sudo mkdir -p "$WORKDIR"
          sudo rsync -a --delete "$GITHUB_WORKSPACE/" "$WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$WORKDIR"
          cat > "$WORKDIR/.review_prompt" <<'PROMPT'
          Independently re-review Hyperliquid PR #279 at exact SHA 856861095dad1a863c77a048a457e5cdd9fb382d with Sonnet.

          REAL TRADING MUST REMAIN DISABLED. Do not use credentials, place orders, change capital/risk authorization, or discuss Polymarket. You have no GitHub write authority.

          Prior reviewed SHA b534a0869502789458164b74b491aa7f46996f99 failed for one blocker: sustained READY arrivals could starve older PENDING tasks because priority was not durable and newest PENDING won.

          Review ONLY:
          git diff b534a0869502789458164b74b491aa7f46996f99..856861095dad1a863c77a048a457e5cdd9fb382d -- scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          plus the minimum adjacent lines necessary to verify the changed calls. Do not run tests or inspect unrelated files; repository CI handles tests.

          Falsify these claims: queue_priority is safely added/migrated on old SQLite ledgers; initial queued issue priority is persisted; PENDING selection is priority-first then oldest-first; same-priority old PENDING cannot starve under sustained new arrivals; PENDING still outranks stale RETRY #146-like work; no unsafe concurrency/safety regression.

          End with exactly:
          REVIEWED_SHA=856861095dad1a863c77a048a457e5cdd9fb382d
          VERDICT=PASS
          BLOCKERS_JSON=[]
          Or VERDICT=FAIL with concrete blocker JSON if any merge-blocking defect exists.
          PROMPT
          sudo chown hl-claude-agent:hl-claude-agent "$WORKDIR/.review_prompt"
          PROMPT_TEXT="$(cat "$WORKDIR/.review_prompt")"
          set +e
          timeout 900 sudo systemd-run --pipe --wait --collect --quiet \
            --unit=hl-ai-claude-review-pr279-85686109-v2 \
            --uid=hl-claude-agent --gid=hl-claude-agent \
            --working-directory="$WORKDIR" \
            --property=NoNewPrivileges=yes --property=PrivateTmp=yes \
            --property=ProtectHome=yes --property=ProtectSystem=strict \
            --property=RestrictSUIDSGID=yes --property=InaccessiblePaths=/mnt \
            --property="ReadWritePaths=$WORKDIR $HOME_DIR" \
            --setenv="HOME=$HOME_DIR" --setenv="CLAUDE_CONFIG_DIR=$HOME_DIR/.claude" \
            /usr/bin/claude -p --model sonnet --output-format json \
            --permission-mode dontAsk --allowedTools Read,Glob,Grep,Bash --max-turns 20 \
            "$PROMPT_TEXT" > /tmp/pr279-85686109-v2.json 2>/tmp/pr279-85686109-v2.err
          RC=$?
          set -e
          echo "CLAUDE_RC=$RC OUT_BYTES=$(wc -c </tmp/pr279-85686109-v2.json) ERR_BYTES=$(wc -c </tmp/pr279-85686109-v2.err)"
          if [[ -s /tmp/pr279-85686109-v2.err ]]; then tail -c 3000 /tmp/pr279-85686109-v2.err; fi
          python3 - <<'PY'
          import json,re,sys
          from pathlib import Path
          target='856861095dad1a863c77a048a457e5cdd9fb382d'
          raw=Path('/tmp/pr279-85686109-v2.json').read_text(errors='replace')
          if not raw:
              print('REVIEW_OUTPUT=EMPTY')
              sys.exit(31)
          try:
              row=json.loads(raw)
              result=row.get('result','')
              diag={k:v for k,v in row.items() if k not in {'result','usage','modelUsage'}}
              print('CLAUDE_JSON_DIAGNOSTIC='+json.dumps(diag, sort_keys=True)[:5000])
          except Exception:
              result=raw
          print('=== REVIEW RESULT ===')
          print(str(result)[-10000:])
          if not re.search(rf'(?m)^REVIEWED_SHA={target}\s*$',str(result)):
              sys.exit(32)
          verdict=re.search(r'(?m)^VERDICT=(PASS|FAIL)\s*$',str(result))
          blockers=re.search(r'(?m)^BLOCKERS_JSON=(\[.*\])\s*$',str(result))
          if not verdict or not blockers:
              sys.exit(33)
          print('MACHINE_VERDICT='+verdict.group(1))
          if verdict.group(1) != 'PASS':
              sys.exit(34)
          PY
          test "$RC" -eq 0
