name: inspect-identity-collision-v8

on:
  push:
    branches:
      - wallet-pipeline/inspect-identity-collision-v8
    paths:
      - ".github/workflows/inspect-identity-collision-v8.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'aliezzat4321/hyperliquid-copy-engine'
    runs-on:
      - self-hosted
      - hyperliquid
    timeout-minutes: 5
    steps:
      - name: Read sanitized verified publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          publication_path = Path('/var/lib/hyperliquid-copy-engine/invo/identified_wallets.json')
          registry_path = Path('/var/lib/hyperliquid-copy-engine/third-party/wallets.json')
          score_path = Path('/root/hyperliquid-audit/third-party/third_party_scorecard.json')

          def load(path):
              try:
                  value = json.loads(path.read_text())
              except Exception as exc:
                  return {'_error': f'{type(exc).__name__}: {exc}'}
              return value

          publication = load(publication_path)
          identities = []
          for row in publication.get('identities', []) if isinstance(publication, dict) else []:
              if isinstance(row, dict):
                  identities.append({
                      'username': row.get('username'),
                      'portfolio_id': row.get('portfolio_id'),
                      'wallet': row.get('wallet'),
                      'confidence': row.get('confidence'),
                      'attestation_status': row.get('attestation_status'),
                  })
          conflicts = publication.get('identity_conflicts', []) if isinstance(publication, dict) else []

          registry = load(registry_path)
          registry_rows = registry.get('wallets', registry.get('items', [])) if isinstance(registry, dict) else []
          enabled = []
          if isinstance(registry_rows, list):
              for row in registry_rows:
                  if not isinstance(row, dict) or not row.get('enabled'):
                      continue
                  enabled.append({
                      'label': row.get('label'),
                      'wallet': row.get('source_ref'),
                      'stage': row.get('stage'),
                  })

          score = load(score_path)
          cards = []
          for row in score.get('scorecards', []) if isinstance(score, dict) else []:
              if not isinstance(row, dict):
                  continue
              base = row.get('base_scenario') if isinstance(row.get('base_scenario'), dict) else {}
              cards.append({
                  'label': row.get('label'),
                  'wallet': row.get('wallet'),
                  'status': row.get('status'),
                  'events': row.get('prospective_events'),
                  'copyability': row.get('copyability_score'),
                  'net_bps_500ms': base.get('net_return_bps'),
                  'actions_500ms': base.get('realized_actions'),
              })

          print('POST_FIX_JSON=' + json.dumps({
              'verified_count': publication.get('verified_count') if isinstance(publication, dict) else None,
              'identities': identities,
              'conflicts': conflicts,
              'quarantined_identity_count': publication.get('quarantined_identity_count') if isinstance(publication, dict) else None,
              'enabled_registry': enabled,
              'score_wallet_count': score.get('wallet_count') if isinstance(score, dict) else None,
              'scorecards': cards,
          }, sort_keys=True))
          PY
