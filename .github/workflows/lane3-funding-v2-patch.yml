name: lane3-funding-v2-patch

on:
  push:
    branches: [codex/lane3-funding-v2-patcher]
    paths:
      - ".github/workflows/lane3-funding-v2-patch.yml"
      - "scripts/patch_lane3_funding_v2.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lane3-funding-v2-patcher
          path: patcher
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: codex/330-lane3-l2-net-cost
          path: target
          fetch-depth: 0
      - name: Normalize patch helper for duplicated status blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patcher/scripts/patch_lane3_funding_v2.py')
          s = p.read_text()
          old = """def rep(old: str, new: str) -> None:\n    global text\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'expected exactly one service replacement, found {count}: {old[:120]!r}')\n    text = text.replace(old, new, 1)\n"""
          new = """def rep(old: str, new: str) -> None:\n    global text\n    count = text.count(old)\n    if count not in {1, 2}:\n        raise SystemExit(f'expected one or two service replacements, found {count}: {old[:120]!r}')\n    text = text.replace(old, new, count)\n"""
          if old not in s:
              raise SystemExit('patch helper shape changed')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply funding v2 service patch
        id: patch
        continue-on-error: true
        run: python3 patcher/scripts/patch_lane3_funding_v2.py target > patcher/patch-result.txt 2>&1
      - name: Persist patch failure reason
        if: steps.patch.outcome != 'success'
        working-directory: patcher
        run: |
          git config user.name "lane3-funding-v2-patcher"
          git config user.email "actions@users.noreply.github.com"
          git add patch-result.txt
          git commit -m "Record funding patch failure diagnostic" || true
          git push origin HEAD:codex/lane3-funding-v2-patcher
      - name: Stop on patch failure
        if: steps.patch.outcome != 'success'
        run: |
          cat patcher/patch-result.txt
          exit 1
      - name: Test executor
        if: steps.patch.outcome == 'success'
        working-directory: target/services/invo-notification-executor
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit exact tested repair
        if: steps.patch.outcome == 'success'
        working-directory: target
        run: |
          git config user.name "lane3-funding-v2-patcher"
          git config user.email "actions@users.noreply.github.com"
          git add services/invo-notification-executor/src/service.ts \
                  services/invo-notification-executor/.env.example \
                  services/invo-notification-executor/README.md
          git diff --cached --check
          git commit -m "Fix Lane 3 oracle funding capture and partial-close carry"
          git push origin HEAD:codex/330-lane3-l2-net-cost
