name: claude-runtime-diagnostic-temp

on:
  push:
    branches: [ops/claude-runtime-diagnostic-20260902]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux]
    timeout-minutes: 4
    steps:
      - name: Diagnose isolated Claude runtime without secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          echo 'TARGET_PROJECT=HYPERLIQUID_AI_RUNTIME_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          /usr/bin/claude --version || true
          CLAUDE_HOME=/var/lib/hyperliquid-ai-team/agents/claude/home
          UID_C="$(id -u hl-claude-agent)"
          GID_C="$(id -g hl-claude-agent)"
          test -d "$CLAUDE_HOME"
          echo "CLAUDE_HOME_OWNER=$(stat -c '%U:%G' "$CLAUDE_HOME")"
          for p in "$CLAUDE_HOME/.claude" "$CLAUDE_HOME/.config"; do
            if [[ -e "$p" ]]; then echo "CONFIG_PRESENT=$(basename "$p") owner=$(stat -c '%U:%G' "$p") mode=$(stat -c '%a' "$p")"; fi
          done
          set +e
          timeout 45 setpriv --reuid="$UID_C" --regid="$GID_C" --init-groups \
            env -i HOME="$CLAUDE_HOME" CLAUDE_CONFIG_DIR="$CLAUDE_HOME/.claude" \
              XDG_CONFIG_HOME="$CLAUDE_HOME/.config" XDG_CACHE_HOME="$CLAUDE_HOME/.cache" \
              PATH=/usr/local/bin:/usr/bin:/bin \
              /usr/bin/claude -p 'Reply exactly: CLAUDE_RUNTIME_OK' \
                --model sonnet --output-format json --permission-mode dontAsk \
                >/tmp/claude-diagnostic.out 2>/tmp/claude-diagnostic.err
          RC=$?
          set -e
          echo "CLAUDE_DIAGNOSTIC_RC=$RC"
          echo "STDOUT_BYTES=$(wc -c </tmp/claude-diagnostic.out)"
          echo "STDERR_BYTES=$(wc -c </tmp/claude-diagnostic.err)"
          python3 - <<'PY'
          from pathlib import Path
          text=(Path('/tmp/claude-diagnostic.out').read_text(errors='replace')+'\n'+Path('/tmp/claude-diagnostic.err').read_text(errors='replace')).lower()
          checks={
            'AUTH_SIGNAL': any(x in text for x in ['not logged in','authentication','unauthorized','oauth','login required','invalid token']),
            'RATE_SIGNAL': any(x in text for x in ['rate limit','usage limit','too many requests','capacity']),
            'NETWORK_SIGNAL': any(x in text for x in ['network','connection','econn','timeout','timed out','dns']),
            'MODEL_SIGNAL': any(x in text for x in ['model','sonnet']) and any(x in text for x in ['unavailable','not found','invalid']),
            'SUCCESS_SIGNAL': 'claude_runtime_ok' in text,
          }
          for k,v in checks.items(): print(f'{k}={"YES" if v else "NO"}')
          PY
          rm -f /tmp/claude-diagnostic.out /tmp/claude-diagnostic.err
