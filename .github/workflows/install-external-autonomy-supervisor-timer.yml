name: install-external-autonomy-supervisor-timer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-external-autonomy-supervisor-timer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 10
    steps:
      - name: Install host-level supervisor
        shell: bash
        run: |
          set -euo pipefail

          sudo tee /usr/local/sbin/hyperliquid-ai-external-supervisor >/dev/null <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail

          ORCH=/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          LOCK=/run/hyperliquid-ai-team/external-supervisor.lock
          STATE=/var/lib/hyperliquid-ai-team/external-supervisor
          RUNNER_RESTART_COOLDOWN_SEC=600
          mkdir -p "$(dirname "$LOCK")" "$STATE"

          exec 9>"$LOCK"
          flock -n 9 || exit 0

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s start\n' "$now" >> "$STATE/supervisor.log"

          recover_actions_runner() {
            local unit active now_epoch last_epoch last_file rc
            local found=0
            now_epoch="$(date +%s)"
            last_file="$STATE/last_runner_restart_epoch"
            last_epoch=0
            if [ -r "$last_file" ]; then
              read -r last_epoch < "$last_file" || last_epoch=0
            fi
            case "$last_epoch" in
              ''|*[!0-9]*) last_epoch=0 ;;
            esac

            while read -r unit _; do
              [ -n "$unit" ] || continue
              found=1
              active="$(systemctl is-active "$unit" 2>/dev/null || true)"
              printf '%s runner_state unit=%s active=%s\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$unit" "$active" >> "$STATE/supervisor.log"

              if [ "$active" = "active" ]; then
                continue
              fi

              if [ $((now_epoch - last_epoch)) -lt "$RUNNER_RESTART_COOLDOWN_SEC" ]; then
                printf '%s runner_restart_cooldown unit=%s seconds_since_last=%s\n' \
                  "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$unit" "$((now_epoch - last_epoch))" \
                  >> "$STATE/supervisor.log"
                continue
              fi

              # Recovery is intentionally limited to restarting an already-installed
              # runner service. Never register/reconfigure a runner or touch tokens.
              printf '%s runner_restart_attempt unit=%s prior_state=%s\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$unit" "$active" >> "$STATE/supervisor.log"
              printf '%s\n' "$now_epoch" > "$last_file"
              systemctl reset-failed "$unit" >/dev/null 2>&1 || true
              systemctl restart "$unit" >/dev/null 2>&1
              rc=$?
              sleep 3
              active="$(systemctl is-active "$unit" 2>/dev/null || true)"
              if [ "$rc" -eq 0 ] && [ "$active" = "active" ]; then
                printf '%s runner_recovered unit=%s\n' \
                  "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$unit" >> "$STATE/supervisor.log"
                date -u +%Y-%m-%dT%H:%M:%SZ > "$STATE/last_runner_recovery_at"
              else
                printf '%s runner_recovery_failed unit=%s rc=%s active=%s\n' \
                  "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$unit" "$rc" "$active" \
                  >> "$STATE/supervisor.log"
              fi
            done < <(systemctl list-unit-files 'actions.runner.*.service' --type=service --no-legend 2>/dev/null || true)

            if [ "$found" -eq 0 ]; then
              printf '%s runner_unit_not_found action=none\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$STATE/supervisor.log"
            fi
          }

          # The host-level timer must be able to recover the existing Actions runner
          # without depending on a GitHub Actions job. This breaks the circular failure
          # where all self-hosted recovery workflows queue behind an unavailable runner.
          recover_actions_runner

          if [ ! -x "$ORCH" ]; then
            printf '%s preflight_fail orchestrator_missing\n' "$now" >> "$STATE/supervisor.log"
            exit 2
          fi

          # A supervisor tick must never wait indefinitely on the orchestrator.
          if timeout 90 "$ORCH" --once >>"$STATE/supervisor.log" 2>&1; then
            date -u +%Y-%m-%dT%H:%M:%SZ > "$STATE/last_success_at"
            timeout 30 "$ORCH" --status > "$STATE/last_status.txt" 2>&1 || true
            exit 0
          fi

          rc=$?
          printf '%s first_cycle_failed rc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$rc" >> "$STATE/supervisor.log"

          # If the primary orchestrator is wedged, terminate only that process and retry.
          pkill -TERM -f '/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py' || true
          sleep 5
          pkill -KILL -f '/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py' || true
          sleep 2

          if timeout 90 "$ORCH" --once >>"$STATE/supervisor.log" 2>&1; then
            date -u +%Y-%m-%dT%H:%M:%SZ > "$STATE/last_success_at"
            printf '%s recovered_after_restart\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$STATE/supervisor.log"
            timeout 30 "$ORCH" --status > "$STATE/last_status.txt" 2>&1 || true
            exit 0
          fi

          rc=$?
          printf '%s recovery_failed rc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$rc" >> "$STATE/supervisor.log"
          exit "$rc"
          SH
          sudo chmod 0755 /usr/local/sbin/hyperliquid-ai-external-supervisor

          sudo tee /etc/systemd/system/hyperliquid-ai-external-supervisor.service >/dev/null <<'UNIT'
          [Unit]
          Description=Hyperliquid AI external autonomy supervisor
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=root
          ExecStart=/usr/local/sbin/hyperliquid-ai-external-supervisor
          TimeoutStartSec=220
          Nice=5
          IOSchedulingClass=best-effort
          IOSchedulingPriority=6
          NoNewPrivileges=yes
          PrivateTmp=yes

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo tee /etc/systemd/system/hyperliquid-ai-external-supervisor.timer >/dev/null <<'UNIT'
          [Unit]
          Description=Run Hyperliquid AI external autonomy supervisor every 2 minutes

          [Timer]
          OnBootSec=45s
          OnUnitActiveSec=2min
          AccuracySec=10s
          Persistent=true
          Unit=hyperliquid-ai-external-supervisor.service

          [Install]
          WantedBy=timers.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable --now hyperliquid-ai-external-supervisor.timer

          # Prove installation and execute one immediate recovery tick.
          sudo systemctl start hyperliquid-ai-external-supervisor.service || true
          sudo systemctl is-enabled hyperliquid-ai-external-supervisor.timer
          sudo systemctl is-active hyperliquid-ai-external-supervisor.timer
          sudo systemctl list-timers hyperliquid-ai-external-supervisor.timer --no-pager

      - name: Verify persistent supervisor state
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/hyperliquid-ai-external-supervisor
          sudo systemctl is-enabled --quiet hyperliquid-ai-external-supervisor.timer
          sudo systemctl is-active --quiet hyperliquid-ai-external-supervisor.timer
          sudo systemctl show hyperliquid-ai-external-supervisor.timer -p NextElapseUSecRealtime -p LastTriggerUSec --no-pager
          sudo tail -n 60 /var/lib/hyperliquid-ai-team/external-supervisor/supervisor.log || true
