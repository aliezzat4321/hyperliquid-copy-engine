name: install-external-autonomy-supervisor-timer-retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy supervisor retired
        run: |
          set -euo pipefail
          echo 'LEGACY_EXTERNAL_SUPERVISOR=RETIRED'
          echo 'REASON=The old host timer used timeout 90 and pkill against legitimate long model work.'
          echo 'CANONICAL_REPLACEMENT=hyperliquid-ai-team-supervisor.timer'
          echo 'REAL_TRADING_CHANGE=NO'
          echo 'POLYMARKET_TOUCHED=NO'
