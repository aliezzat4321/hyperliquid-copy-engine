name: temp-pr153-probe-repair

on:
  push:
    branches: [trigger/pr153-probe-repair]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/auto-151-5cc33cdb
          fetch-depth: 0
      - name: Repair probe classification and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/ai_team_orchestrator.py')
          text = p.read_text()
          start = text.index('    def handle_claude_probe(')
          end = text.index('    def handle_codex(', start)
          replacement = '''    def handle_claude_probe(self, task: sqlite3.Row) -> None:
              """Run a bounded repo-free readiness probe and classify failures."""
              unit = f"hl-ai-claude-probe-{task['id'][:10]}-{int(time.time())}"
              command = [
                  "/usr/bin/claude", "-p", "--model",
                  "opus" if task["model_class"] == "OPUS" else "sonnet",
                  "--output-format", "json", "--permission-mode", "dontAsk", "--max-turns", "1",
              ]
              full = model_sandbox_command(
                  unit=unit, user=CLAUDE_USER, home=CLAUDE_HOME,
                  workdir=STATE_ROOT / "orchestrator", command=command,
              )
              timeout = int(self.cfg["claude_readiness_probe_timeout_seconds"])
              try:
                  cp = run(full, input_text="Reply with exactly CLAUDE_READY_OK", timeout=timeout)
                  combined = (cp.stdout + "\\n" + cp.stderr)[
                      -int(self.cfg["claude_readiness_probe_output_bytes"]):
                  ]
              except subprocess.TimeoutExpired as exc:
                  self.reap_stale_child({"systemd_unit": unit})
                  combined = str(exc)
                  cp = subprocess.CompletedProcess(full, 124, "", combined)
              limited, parsed_retry = rate_limit_info(
                  combined, int(self.cfg["claude_readiness_probe_seconds"])
              )
              ready = cp.returncode == 0 and "CLAUDE_READY_OK" in combined
              if ready:
                  self.ledger.update(
                      task["id"], status="PENDING", retry_at=utcnow(), last_error=None,
                      limit_text=None, systemd_unit=None,
                  )
                  self.runtime.event("CLAUDE_READINESS_PROBE_READY", assignment_id=task["id"])
                  return

              detail = bounded_limit_text(combined) or f"probe rc={cp.returncode}"
              if limited:
                  retry_at = parsed_retry or retry_at_after(
                      int(self.cfg["claude_readiness_probe_seconds"])
                  )
                  self.ledger.update(
                      task["id"], status="WAITING_RATE_LIMIT", retry_at=retry_at,
                      last_error="Claude provider still unavailable", limit_text=detail,
                      systemd_unit=None,
                  )
                  self.runtime.event(
                      "CLAUDE_READINESS_PROBE_WAITING", assignment_id=task["id"],
                      retry_after=retry_at, limit_text=detail, detected_limit=True,
                  )
                  return

              # A probe that fails without a positive quota/provider-limit signal is
              # an ordinary execution/auth/config failure. It must consume bounded
              # failure budget rather than masquerading as provider unavailability.
              next_attempt = int(task["attempt"]) + 1
              self.ledger.update(
                  task["id"], attempt=next_attempt, limit_text=None, systemd_unit=None
              )
              current = self.ledger.get(task["id"])
              error = (
                  f"Claude readiness probe ordinary failure rc={cp.returncode}: "
                  f"{detail[:800]}"
              )
              self.retry_or_block(current, error, session_id=task["session_id"])
              updated = self.ledger.get(task["id"])
              self.runtime.event(
                  "CLAUDE_READINESS_PROBE_FAILURE",
                  assignment_id=task["id"],
                  issue=task["issue_number"],
                  pr=task["pr_number"],
                  attempt=next_attempt,
                  status=updated["status"],
                  retry_after=updated["retry_at"],
                  detail=detail[:800],
              )

          '''
          p.write_text(text[:start] + replacement + text[end:])

          tests = Path('tests/test_ai_team_orchestrator.py')
          t = tests.read_text()
          marker = 'def test_watchdog_requeues_same_review_checkpoint(tmp_path):\n'
          test = '''def test_non_limit_probe_failure_consumes_budget_and_leaves_wait_state(tmp_path, monkeypatch):
              ledger = orch.Ledger(tmp_path / "ledger.sqlite3")
              task_id = ledger.create_task(
                  issue_number=2, pr_number=12, task_type="REVIEW", agent="CLAUDE",
                  model_class="SONNET", task_class="ROUTINE", status="WAITING_RATE_LIMIT",
                  retry_at=orch.utcnow(), session_id="same-session", attempt=0, target_sha="a" * 40,
              )
              team = object.__new__(orch.Orchestrator)
              team.ledger = ledger
              team.cfg = {
                  **orch.DEFAULT_CONFIG,
                  "max_attempts": 3,
                  "claude_readiness_probe_seconds": 300,
                  "claude_readiness_probe_timeout_seconds": 20,
                  "claude_readiness_probe_output_bytes": 4096,
              }

              class Events:
                  def event(self, *args, **kwargs):
                      return None

              team.runtime = Events()
              monkeypatch.setattr(orch, "model_sandbox_command", lambda **kw: kw["command"])
              monkeypatch.setattr(
                  orch,
                  "run",
                  lambda *args, **kwargs: subprocess.CompletedProcess(
                      [], 1, "", "authentication configuration failed"
                  ),
              )
              team.handle_claude_probe(ledger.get(task_id))
              row = ledger.get(task_id)
              assert row["status"] == "RETRY"
              assert row["attempt"] == 1
              assert row["session_id"] == "same-session"
              assert "ordinary failure" in row["last_error"]
              assert row["limit_text"] is None


          '''
          if 'def test_non_limit_probe_failure_consumes_budget_and_leaves_wait_state' not in t:
              if marker not in t:
                  raise SystemExit('test insertion marker missing')
              t = t.replace(marker, test + marker, 1)
              tests.write_text(t)
          PY
          python3 -m pip install 'ruff<1,>=0.9' 'pytest<9,>=8.3' >/dev/null
          ruff check --fix scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          ruff check scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          pytest -q tests/test_ai_team_orchestrator.py
          git diff --check
          git config user.name 'AI Team Repair'
          git config user.email 'ai-team-repair@localhost'
          git add scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          git commit -m 'Fix Claude probe non-limit failure recovery'
          git push origin HEAD:codex/auto-151-5cc33cdb
