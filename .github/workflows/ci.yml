name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hlcopy
          POSTGRES_PASSWORD: hlcopy
          POSTGRES_DB: hlcopy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hlcopy -d hlcopy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hlcopy:hlcopy@localhost:5432/hlcopy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
