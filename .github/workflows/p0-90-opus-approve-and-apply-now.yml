name: p0-90-opus-approve-and-apply-now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-90-opus-approve-and-apply-now.yml
      - scripts/p0_90_trusted_opus_review_now.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p0-90-opus-approve-and-apply-now
  cancel-in-progress: false

jobs:
  trusted-opus-review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 30
    env:
      PLAN_RUN_ID: '34766743062'
      CODE_SHA: 'd763b536edd9d6fc5fce76105996bfaf5858d85b'
      ARTIFACT_NAME: 'p0-90-storage-review-d763b536edd9d6fc5fce76105996bfaf5858d85b'
      BUNDLE_DIR: /tmp/p0-90-opus-current-${{ github.run_id }}

    steps:
      - name: Checkout trusted review runner
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Download latest immutable storage bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUNDLE_DIR }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PLAN_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Run restricted root-ledger Opus review and trusted verifier
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_TOKEN,BUNDLE_DIR python3 scripts/p0_90_trusted_opus_review_now.py
