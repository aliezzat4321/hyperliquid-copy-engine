name: p0-90-opus-approve-and-apply-now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-90-opus-approve-and-apply-now.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: p0-90-opus-approve-and-apply-now
  cancel-in-progress: false

jobs:
  trusted-opus-review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 45
    env:
      PLAN_RUN_ID: '34766743062'
      PLAN_COMPLETED_AT: '2026-09-13T16:39:27Z'
      CODE_SHA: 'd763b536edd9d6fc5fce76105996bfaf5858d85b'
      RETENTION_SHA: '1f4d4bc45405ab397decca395ea2848f777796afe06bcd6058d5a2b0beba1638'
      BOOTSTRAP_SHA: '76ef0efb586a6dd5099ca00ca5f1847a3d50d78081ecc2b7acba4e3b197b2f30'
      LIFECYCLE_SHA: 'ca0bcbd764a68d821c179e3e92f4ad8dc1246fbc71078f506ef6fa02c824b705'
      BINDING_SHA: '6c3f74a34d6e3f94872297c0445de075bc5d2fda1449869d54979fe9231bc661'
      ARTIFACT_NAME: 'p0-90-storage-review-d763b536edd9d6fc5fce76105996bfaf5858d85b'
      BUNDLE_DIR: /tmp/p0-90-storage-review-now-${{ github.run_id }}
      REVIEW_WORKDIR: /var/lib/hyperliquid-ai-team/agents/claude/worktrees/p0-90-storage-review-now-${{ github.run_id }}

    steps:
      - name: Checkout exact reviewed storage code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Download exact fresh immutable plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUNDLE_DIR }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PLAN_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify fresh plan hashes and safety binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CODE_SHA"
          test "$(sha256sum "$BUNDLE_DIR/retention/storage_retention_manifest.json" | awk '{print $1}')" = "$RETENTION_SHA"
          test "$(sha256sum "$BUNDLE_DIR/bootstrap-plan.json" | awk '{print $1}')" = "$BOOTSTRAP_SHA"
          test "$(sha256sum "$BUNDLE_DIR/lifecycle-plan.json" | awk '{print $1}')" = "$LIFECYCLE_SHA"
          test "$(sha256sum "$BUNDLE_DIR/review-binding.json" | awk '{print $1}')" = "$BINDING_SHA"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          b=json.loads((Path(os.environ['BUNDLE_DIR'])/'review-binding.json').read_text())
          required={
            'code_sha': os.environ['CODE_SHA'],
            'retention_manifest_sha256': os.environ['RETENTION_SHA'],
            'bootstrap_plan_sha256': os.environ['BOOTSTRAP_SHA'],
            'lifecycle_manifest_sha256': os.environ['LIFECYCLE_SHA'],
            'postgresql_filesystem_deletion': False,
            'polymarket_mutation': False,
            'real_trading_changed': False,
            'mutation_performed': False,
          }
          for k,v in required.items():
              assert b.get(k)==v, (k,b.get(k),v)
          print('FRESH_PLAN_BINDING=PASS')
          PY
          echo REAL_TRADING_ENABLED=NO
          echo POSTGRESQL_FILESYSTEM_DELETION=NO
          echo POLYMARKET_MUTATION=NO

      - name: Run native root-owned Claude Opus destructive review
        id: opus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo systemctl stop hyperliquid-ai-team-orchestrator.service || true
          cleanup() {
            sudo systemctl start hyperliquid-ai-team-orchestrator.service || true
          }
          trap cleanup EXIT

          sudo rm -rf "$REVIEW_WORKDIR"
          sudo mkdir -p "$REVIEW_WORKDIR"
          sudo cp -a "$GITHUB_WORKSPACE/." "$REVIEW_WORKDIR/"
          sudo mkdir -p "$REVIEW_WORKDIR/review_bundle"
          sudo cp -a "$BUNDLE_DIR/." "$REVIEW_WORKDIR/review_bundle/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$REVIEW_WORKDIR"

          sudo env \
            GH_TOKEN="$GH_TOKEN" \
            PLAN_RUN_ID="$PLAN_RUN_ID" PLAN_COMPLETED_AT="$PLAN_COMPLETED_AT" \
            CODE_SHA="$CODE_SHA" RETENTION_SHA="$RETENTION_SHA" BOOTSTRAP_SHA="$BOOTSTRAP_SHA" \
            LIFECYCLE_SHA="$LIFECYCLE_SHA" BINDING_SHA="$BINDING_SHA" \
            REVIEW_WORKDIR="$REVIEW_WORKDIR" \
            python3 - <<'PY'
          import os, sys, uuid
          from pathlib import Path
          sys.path.insert(0, '/opt/hyperliquid-ai-team/scripts')
          import ai_team_orchestrator as orch

          o = orch.Orchestrator()
          ledger = o.ledger
          active = ('PENDING','RETRY','WAITING_RATE_LIMIT','WAITING_CI','WAITING_EVIDENCE_WINDOW','RUNNING')
          phase_types = tuple(orch.COMPLETION_REQUIREMENTS['STORAGE_PROOF'])
          q1=','.join('?' for _ in active)
          q2=','.join('?' for _ in phase_types)
          rows=ledger.db.execute(
              f"SELECT id FROM tasks WHERE issue_number=90 AND status IN ({q1}) AND task_type IN ({q2})",
              (*active,*phase_types),
          ).fetchall()
          for row in rows:
              ledger.update(row['id'], status='STALE', retry_at=None, systemd_unit=None,
                            last_error='superseded by fresh plan-bound direct trusted Opus review')

          plan = {
              'plan_run_id': os.environ['PLAN_RUN_ID'],
              'plan_completed_at': os.environ['PLAN_COMPLETED_AT'],
              'retention_sha': os.environ['RETENTION_SHA'],
              'bootstrap_sha': os.environ['BOOTSTRAP_SHA'],
              'lifecycle_sha': os.environ['LIFECYCLE_SHA'],
              'binding_sha': os.environ['BINDING_SHA'],
              'bundle': {
                  'storage_retention_manifest.json': 'review_bundle/retention/storage_retention_manifest.json; inspect this exact file; sha256='+os.environ['RETENTION_SHA'],
                  'bootstrap-plan.json': 'review_bundle/bootstrap-plan.json; inspect this exact file; sha256='+os.environ['BOOTSTRAP_SHA'],
                  'lifecycle-plan.json': 'review_bundle/lifecycle-plan.json; inspect this exact file using targeted jq/python checks; sha256='+os.environ['LIFECYCLE_SHA'],
                  'review-binding.json': 'review_bundle/review-binding.json; inspect this exact file; sha256='+os.environ['BINDING_SHA'],
                  'lifecycle-plan.stdout': 'review_bundle/lifecycle-plan.stdout; supporting planner output',
                  'fresh_plan_summary': 'DELETE_CANDIDATE=3725421297 bytes; COMPRESS_CANDIDATE=15273794069 bytes; KEEP_RECENT_FULL_FIDELITY=1507873061 bytes; KEEP_ROBUST_FULL_FIDELITY=3549148606 bytes; PostgreSQL filesystem deletion forbidden; Polymarket mutation forbidden; real trading OFF',
              },
          }
          task_id = uuid.uuid4().hex[:16]
          ledger.create_task(
              id=task_id, issue_number=90, pr_number=288,
              task_type='DESTRUCTIVE_REVIEW', agent='CLAUDE', model_class='OPUS',
              task_class='ROUTINE', queue_priority=-100000, status='PENDING',
              target_sha=os.environ['CODE_SHA'], workdir=os.environ['REVIEW_WORKDIR'],
              lifecycle_phase='DESTRUCTIVE_REVIEW',
              completion_contract={'version':1,'close_on_merge':False,'requirements':['STORAGE_PROOF']},
              evidence={'requirement':'STORAGE_PROOF','trusted_plan':plan},
          )
          print('OPUS_ASSIGNMENT_ID='+task_id)
          Path('/tmp/p0-90-opus-assignment-id').write_text(task_id)

          for _ in range(3):
              task=ledger.get(task_id)
              if task['status']=='DONE':
                  break
              if task['status']=='WAITING_RATE_LIMIT':
                  raise SystemExit('OPUS_WAITING_RATE_LIMIT')
              if task['status']=='BLOCKED':
                  raise SystemExit('OPUS_BLOCKED: '+str(task['last_error']))
              if task['status']=='RETRY':
                  ledger.update(task_id,status='PENDING',retry_at=None,systemd_unit=None)
              o.handle_storage_destructive_review(ledger.get(task_id))
          final=ledger.get(task_id)
          print('OPUS_FINAL_STATUS='+str(final['status']))
          if final['status']!='DONE':
              raise SystemExit('trusted Opus review did not complete')
          PY

          assignment_id="$(cat /tmp/p0-90-opus-assignment-id)"
          echo "assignment_id=$assignment_id" >> "$GITHUB_OUTPUT"
          sudo python3 /opt/hyperliquid-ai-team/scripts/verify_trusted_opus_storage_review.py \
            --db /var/lib/hyperliquid-ai-team/orchestrator/ledger.sqlite3 \
            --runtime-root /var/lib/hyperliquid-ai-team \
            --assignment-id "$assignment_id" \
            --code-sha "$CODE_SHA" \
            --plan-run-id "$PLAN_RUN_ID" \
            --plan-completed-at "$PLAN_COMPLETED_AT" \
            --retention-sha "$RETENTION_SHA" \
            --bootstrap-sha "$BOOTSTRAP_SHA" \
            --lifecycle-sha "$LIFECYCLE_SHA" \
            --binding-sha "$BINDING_SHA"
          echo TRUSTED_OPUS_READY_FOR_APPLY=YES
          echo OPUS_ASSIGNMENT_ID="$assignment_id"
          echo PLAN_RUN_ID="$PLAN_RUN_ID"
          echo CODE_SHA="$CODE_SHA"
          echo RETENTION_MANIFEST_SHA256="$RETENTION_SHA"
          echo BOOTSTRAP_PLAN_SHA256="$BOOTSTRAP_SHA"
          echo LIFECYCLE_MANIFEST_SHA256="$LIFECYCLE_SHA"
          echo REVIEW_BINDING_SHA256="$BINDING_SHA"
