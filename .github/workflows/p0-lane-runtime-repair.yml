name: p0-lane-runtime-repair

on:
  push:
    branches: [main]
    paths: ['.github/workflows/p0-lane-runtime-repair.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-lane-runtime-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Repair and verify Lane 3 executor
        continue-on-error: true
        shell: bash
        run: |
          set -u -o pipefail
          sudo bash scripts/deploy_invo_notification_executor_self_hosted.sh || true
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          audit=/var/lib/hyperliquid-copy-engine/invo-notification-executor/audit.jsonl
          if sudo test -f "$audit"; then
            sudo mv "$audit" "${audit}.preverify-${stamp}"
          fi
          sudo systemctl restart hyperliquid-invo-notification-executor.service
          sleep 8
          sudo systemctl is-active --quiet hyperliquid-invo-notification-executor.service || exit 1
          health="$(curl -fsS --max-time 4 http://127.0.0.1:8787/health)" || exit 1
          echo "LANE3_HEALTH=$health"
          sudo test -f /var/lib/hyperliquid-copy-engine/invo-notification-executor/trader-population.json || exit 1
          echo '=== LANE3 FRESH AUDIT ==='
          sudo tail -n 120 "$audit" || true
          if sudo grep -q "Invalid feed type" "$audit"; then
            echo 'LANE3_FAIL=invalid_feed_type_after_clean_restart' >&2
            exit 1
          fi
          if sudo grep -q "no such file or directory, mkdir '/root/hyperliquid-copy-engine/services/invo-notification-executor/data'" "$audit"; then
            echo 'LANE3_FAIL=relative_data_path_after_clean_restart' >&2
            exit 1
          fi
          echo LANE3_RUNTIME_ACCEPTANCE=PASS

      - name: Diagnose and repair Lane 1 producer chain
        continue-on-error: true
        shell: bash
        run: |
          set -u -o pipefail
          units=(hyperliquid-universe-scout.service hyperliquid-wallet-research.service hyperliquid-selective-shadow.service hyperliquid-prospective-champions.service)
          for unit in "${units[@]}"; do
            echo "=== BEFORE $unit ==="
            sudo systemctl status "$unit" --no-pager -l || true
            sudo journalctl -u "$unit" -n 100 --no-pager -l || true
            sudo systemctl reset-failed "$unit" || true
            sudo systemctl start "$unit" || true
          done
          sleep 10
          for unit in "${units[@]}"; do
            echo "=== AFTER $unit ==="
            sudo systemctl status "$unit" --no-pager -l || true
            sudo journalctl -u "$unit" -n 60 --no-pager -l || true
          done
          echo '=== LANE1 ARTIFACTS ==='
          sudo stat -c 'LANE1_QUEUE_MTIME=%Y %y' /root/hyperliquid-audit/funnel/challenger_queue.json || true
          sudo stat -c 'LANE1_REPORT_MTIME=%Y %y' /root/hyperliquid-audit/prospective-champions/report.json || true
          sudo head -c 16000 /root/hyperliquid-audit/funnel/challenger_queue.json || true
          echo
          sudo cat /root/hyperliquid-audit/prospective-champions/report.json || true

      - name: Diagnose and repair Lane 2 resolver chain
        continue-on-error: true
        shell: bash
        run: |
          set -u -o pipefail
          units=(hyperliquid-external-coverage.service hyperliquid-external-resolver.service hyperliquid-invo-wallet-identifier.service hyperliquid-invo-verified-shadow-sync.service)
          for unit in "${units[@]}"; do
            echo "=== BEFORE $unit ==="
            sudo systemctl status "$unit" --no-pager -l || true
            sudo journalctl -u "$unit" -n 120 --no-pager -l || true
            sudo systemctl reset-failed "$unit" || true
            sudo systemctl start "$unit" || true
          done
          sleep 10
          for unit in "${units[@]}"; do
            echo "=== AFTER $unit ==="
            sudo systemctl status "$unit" --no-pager -l || true
            sudo journalctl -u "$unit" -n 80 --no-pager -l || true
          done
          echo '=== LANE2 ARTIFACT DISCOVERY ==='
          sudo find /var/lib/hyperliquid-copy-engine /root/hyperliquid-audit -maxdepth 6 -type f \
            \( -iname '*resolver*' -o -iname '*identifier*' -o -iname '*verified*' -o -iname '*handoff*' -o -iname '*measurement*' \) \
            -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' 2>/dev/null | sort -r | head -n 120 || true

      - name: Final autonomy and safety acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${REAL_TRADING_ENABLED:-NO}" != YES
          sudo systemctl is-active --quiet hyperliquid-ai-external-supervisor.timer
          sudo systemctl start hyperliquid-ai-external-supervisor.service || true
          sleep 3
          sudo tail -n 60 /var/lib/hyperliquid-ai-team/external-supervisor/supervisor.log || true
          sudo -H /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py --status || true
          echo '=== FAILED HYPERLIQUID UNITS ==='
          sudo systemctl --failed --no-pager | grep -E 'hyperliquid|hlcopy' || true
          echo '=== FINAL LANE3 ==='
          curl -fsS --max-time 4 http://127.0.0.1:8787/health
          audit=/var/lib/hyperliquid-copy-engine/invo-notification-executor/audit.jsonl
          ! sudo grep -q "Invalid feed type" "$audit"
          ! sudo grep -q "no such file or directory, mkdir '/root/hyperliquid-copy-engine/services/invo-notification-executor/data'" "$audit"
          echo REAL_TRADING_ENABLED=NO
