name: p0-373-direct-opus-review

on:
  push:
    branches:
      - codex/lane3-elite-admission-thin-depth-361-369
    paths:
      - .github/workflows/p0-373-direct-opus-review.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    env:
      PR_NUMBER: '373'
      REVIEW_WORKDIR: /var/lib/hyperliquid-ai-team/agents/claude/worktrees/p0-373-direct-opus-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Exact-head independent Opus review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          test "$TARGET_SHA" = "${GITHUB_SHA}"

          sudo rm -rf "$REVIEW_WORKDIR"
          sudo mkdir -p "$REVIEW_WORKDIR"
          sudo cp -a "$GITHUB_WORKSPACE/." "$REVIEW_WORKDIR/"
          sudo chown -R hl-claude-agent:hl-claude-agent "$REVIEW_WORKDIR"

          cat > /tmp/p0-373-opus-prompt.txt <<EOF
          You are Claude Opus, the independent exact-SHA reviewer for Hyperliquid Lane 3 PR #373.

          TARGET_SHA=$TARGET_SHA
          PR_NUMBER=$PR_NUMBER
          REAL_TRADING_ENABLED must remain NO.

          Review the exact checked-out tree. Do not modify tracked files. Do not inspect or touch Polymarket. This review is for shadow-only Lane 3.

          Context and required behavior:
          - Broad Invo discovery and exact CROWN/1D/1W/1M/1Y/AT leaderboard collection must remain independent and broad.
          - Leaderboard membership/rank alone must NOT authorize a shadow copy.
          - Dry NEW/ADD exposure must require the signal's exact portfolioId to have been ELITE_CANDIDATE using candidate evidence available before the source trade/decision.
          - Candidate state missing, malformed, stale, future-dated, absent, or non-elite must fail closed with an explicit reason.
          - No owner-level eligibility inheritance between portfolios.
          - No retroactive backfill or hindsight promotion.
          - Existing managed exposure must still CLOSE after demotion; demotion may stop NEW/ADD but cannot orphan exposure.
          - A requested close that is itself executable but sees < minimum total displayed causal depth must remain UNRESOLVED_EXPOSURE with bounded retry. It must NOT be terminally dust-reconciled/deleted.
          - True non-executable requested residual dust may terminate only as incomplete dust reconciliation and must not enter COMPLETE economics.
          - Missing, empty, or mismatched Hyperliquid L2 returned coin identity must fail closed.
          - No live-trading, signing, credential, capital-control, or live-routing enablement.

          Falsify the implementation. Inspect the diff and relevant surrounding code/tests, especially:
          services/invo-notification-executor/src/service.ts
          services/invo-notification-executor/src/elite-admission.ts
          services/invo-notification-executor/src/close-rejection.ts
          services/invo-notification-executor/src/shadow-market.ts
          services/invo-notification-executor/src/portfolio-candidates.ts
          services/invo-notification-executor/test/elite-admission.test.ts
          services/invo-notification-executor/test/close-rejection.test.ts
          services/invo-notification-executor/test/service-elite-admission-wiring.test.ts
          services/invo-notification-executor/test/shadow-market-integrity.test.ts

          CI on the prior code-only head passed executor tests, repo CI, ai-team-contract and live-sensitive guard. Re-check source semantics independently; you may run focused tests if useful. Do not accept merely because tests exist.

          If ANY material issue exists, explain it and end with exactly:
          LANE3_REVIEW=FAIL
          MODEL_CLASS=OPUS
          TARGET_SHA=$TARGET_SHA
          PR_NUMBER=$PR_NUMBER
          REAL_TRADING_ENABLED=NO

          If and only if the exact head satisfies all required semantics, end with EXACTLY these lines:
          LANE3_REVIEW=PASS
          MODEL_CLASS=OPUS
          TARGET_SHA=$TARGET_SHA
          PR_NUMBER=$PR_NUMBER
          ELITE_ADMISSION=PASS
          PORTFOLIO_IDENTITY=PASS
          NO_HINDSIGHT=PASS
          CLOSE_UNWIND=PASS
          THIN_DEPTH_INTEGRITY=PASS
          TRUE_DUST_INCOMPLETE=PASS
          L2_COIN_FAIL_CLOSED=PASS
          BROAD_DISCOVERY_INDEPENDENT=PASS
          REAL_TRADING_ENABLED=NO
          EOF

          uid="$(id -u hl-claude-agent)"
          gid="$(id -g hl-claude-agent)"
          home=/var/lib/hyperliquid-ai-team/agents/claude/home
          set +e
          timeout --foreground 900s setpriv \
            --reuid="$uid" --regid="$gid" --init-groups \
            env -i HOME="$home" CLAUDE_CONFIG_DIR="$home/.claude" \
            XDG_CONFIG_HOME="$home/.config" XDG_CACHE_HOME="$home/.cache" \
            PATH=/usr/local/bin:/usr/bin:/bin \
            /usr/bin/claude -p --model opus --max-turns 40 \
            --output-format json --permission-mode dontAsk \
            --allowedTools Read,Glob,Grep,Bash \
            "$(cat /tmp/p0-373-opus-prompt.txt)" \
            > /tmp/p0-373-opus.json 2> /tmp/p0-373-opus.err
          rc=$?
          set -e

          python3 - <<'PY' > /tmp/p0-373-opus-result.txt
          import json
          from pathlib import Path
          raw=Path('/tmp/p0-373-opus.json').read_text(errors='replace')
          try:
              data=json.loads(raw)
              print(data.get('result') or data.get('text') or raw)
          except Exception:
              print(raw)
          PY

          result="$(cat /tmp/p0-373-opus-result.txt)"
          if [[ $rc -ne 0 ]]; then
            err="$(tail -c 3000 /tmp/p0-373-opus.err || true)"
            printf 'Claude direct review failed rc=%s\n%s\n' "$rc" "$err"
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="DIRECT_OPUS_REVIEW=ERROR
TARGET_SHA=$TARGET_SHA
Claude direct review process failed with rc=$rc. No merge/deploy authorization was produced."
            exit 1
          fi

          required=(
            'LANE3_REVIEW=PASS'
            'MODEL_CLASS=OPUS'
            "TARGET_SHA=$TARGET_SHA"
            "PR_NUMBER=$PR_NUMBER"
            'ELITE_ADMISSION=PASS'
            'PORTFOLIO_IDENTITY=PASS'
            'NO_HINDSIGHT=PASS'
            'CLOSE_UNWIND=PASS'
            'THIN_DEPTH_INTEGRITY=PASS'
            'TRUE_DUST_INCOMPLETE=PASS'
            'L2_COIN_FAIL_CLOSED=PASS'
            'BROAD_DISCOVERY_INDEPENDENT=PASS'
            'REAL_TRADING_ENABLED=NO'
          )
          for marker in "${required[@]}"; do
            count="$(grep -Fxc "$marker" /tmp/p0-373-opus-result.txt || true)"
            if [[ "$count" != 1 ]]; then
              printf 'Missing/wrong marker: %s (count=%s)\n' "$marker" "$count"
              tail -c 8000 /tmp/p0-373-opus-result.txt
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                -f body="DIRECT_OPUS_REVIEW=FAIL
TARGET_SHA=$TARGET_SHA
Independent Opus did not emit the complete PASS contract. The PR must not merge/deploy. See workflow run $GITHUB_RUN_ID for review details."
              exit 1
            fi
          done

          if ! git -C "$REVIEW_WORKDIR" diff --quiet -- .; then
            echo 'Reviewer modified tracked files; refusing PASS.'
            exit 1
          fi

          {
            echo 'DIRECT_OPUS_REVIEW=PASS'
            echo "TARGET_SHA=$TARGET_SHA"
            echo 'MODEL_CLASS=OPUS'
            echo 'All exact-head Lane 3 review markers passed.'
            echo
            tail -c 10000 /tmp/p0-373-opus-result.txt
          } > /tmp/p0-373-review-comment.txt
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -F body=@/tmp/p0-373-review-comment.txt

          echo DIRECT_OPUS_REVIEW=PASS
          echo TARGET_SHA="$TARGET_SHA"
