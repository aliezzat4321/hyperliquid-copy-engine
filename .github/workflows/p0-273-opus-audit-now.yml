name: p0-273-opus-audit-now

'on':
  push:
    paths:
      - .github/workflows/p0-273-opus-audit-now.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  opus-audit:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run independent Claude Opus audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo git -C /root/hyperliquid-copy-engine fetch origin main
          sudo git -C /root/hyperliquid-copy-engine reset --hard origin/main
          sudo tee /tmp/issue-273-prompt.txt >/dev/null <<'PROMPT'
          You are Claude Opus acting as the independent senior quant and reliability auditor for Hyperliquid issue #273. Audit CURRENT main and CURRENT production runtime artifacts on this host. Do not modify code. Do not enable live trading. Do not trust stored summary metrics without independent recomputation.

          Audit Lane 1 issue #93, Lane 2 issue #92, Lane 3 issue #91, and runtime collection issue #267 end-to-end. Verify no look-ahead or future-book leakage; causal timestamp semantics; point-in-time market-book correctness; explicit rejects for stale or missing depth; realistic fills, slippage, fees, funding, leverage, margin, partial fills and sizing; correct position lifecycle; independently recompute realized, unrealized and net PnL from raw inputs; dedupe and idempotency across retries/restarts; Lane 1 prospective_start_ns and challenger freeze; Lane 2 identity proof and conflict quarantine; Lane 3 notification provenance and causal decision/reject behavior; measurable data gaps and sample-bias risk; reproducible code/policy/raw-data provenance; aggregate accounting reconciliation; and real trading OFF.

          Independently replay a representative stratified sample from EACH lane from raw source event plus market data through decision, fill and PnL. Any unexplained mismatch is FAIL. If fresh downstream records are insufficient, return INSUFFICIENT_EVIDENCE rather than inventing evidence.

          For EACH lane return PASS, FAIL, or INSUFFICIENT_EVIDENCE; exact sampled record identifiers/paths; independent recomputations; discrepancies and severity; whether current shadow results are safe for profitability analysis; and exact scoped repairs required. Finish with an overall verdict and explicit confirmation that real trading is OFF.
          PROMPT
          sudo bash -lc '
            set -euo pipefail
            set -a
            source /etc/hyperliquid-ai-team/claude.env
            set +a
            cd /root/hyperliquid-copy-engine
            CLAUDE_BIN="$(command -v claude || true)"
            if [ -z "$CLAUDE_BIN" ] && [ -x /root/.local/bin/claude ]; then CLAUDE_BIN=/root/.local/bin/claude; fi
            test -n "$CLAUDE_BIN"
            "$CLAUDE_BIN" -p --model opus --max-turns 40 "$(cat /tmp/issue-273-prompt.txt)" | tee /tmp/issue-273-opus-audit.txt
          '
          test -s /tmp/issue-273-opus-audit.txt
          gh issue comment 273 --repo aliezzat4321/hyperliquid-copy-engine --body-file /tmp/issue-273-opus-audit.txt
