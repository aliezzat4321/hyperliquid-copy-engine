name: ai-team-status-probe

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-status-probe.yml"]

permissions:
  contents: read

jobs:
  status:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Read Hyperliquid AI-team status only
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_AI_TEAM_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          hl-ai-team-status
          echo '=== AI TEAM SERVICE JOURNAL ==='
          journalctl -u hyperliquid-ai-team-orchestrator.service -n 120 --no-pager -l || true
          echo '=== INSTALLED CONTINUITY MARKERS ==='
          grep -nE 'WAITING_RATE_LIMIT|CLAUDE_READINESS_PROBE|retry_or_block|recover_interrupted' /usr/local/lib/hyperliquid-ai-team/ai_team_orchestrator.py 2>/dev/null | tail -n 80 || true
          echo 'PROBE_REVISION=4'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
