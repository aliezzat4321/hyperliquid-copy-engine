name: ai-team-status-probe

on:
  push:
    branches: [main, codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-status-probe.yml"]

permissions:
  contents: read

jobs:
  status:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Read Hyperliquid AI-team status only
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_AI_TEAM_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          echo '=== SERVICE STATUS ==='
          systemctl status hyperliquid-ai-team-orchestrator.service --no-pager -l || true
          echo '=== AI TEAM STATUS ==='
          hl-ai-team-status || true
          echo '=== AI TEAM SERVICE JOURNAL ==='
          journalctl -u hyperliquid-ai-team-orchestrator.service -n 160 --no-pager -l || true
          echo '=== INSTALLED OWNERSHIP HOTFIX ==='
          grep -n 'follow_symlinks=False' /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py || true
          echo 'PROBE_REVISION=4'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
