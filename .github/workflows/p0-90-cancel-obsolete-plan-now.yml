name: p0-90-cancel-obsolete-plan-now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-90-cancel-obsolete-plan-now.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-plan:
    if: >-
      github.repository == 'aliezzat4321/hyperliquid-copy-engine' &&
      contains(github.event.head_commit.message, '[CANCEL_OBSOLETE_STORAGE_PLAN]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded P0 #90 plan run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: '34766743062'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/cancel.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel")"
          cat /tmp/cancel.out || true
          case "$code" in
            202|409) ;;
            *) echo "unexpected_cancel_http=$code" >&2; exit 1 ;;
          esac
          echo "OBSOLETE_STORAGE_PLAN_CANCEL_REQUEST_HTTP=$code"
