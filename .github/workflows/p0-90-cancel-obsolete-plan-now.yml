name: p0-control-free-runner-now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-90-cancel-obsolete-plan-now.yml

permissions:
  actions: write
  contents: read

jobs:
  force-cancel-lane2-waiter:
    if: >-
      github.repository == 'aliezzat4321/hyperliquid-copy-engine' &&
      contains(github.event.head_commit.message, '[FORCE_CANCEL_LANE2_WAITER]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release self-hosted runner from blocking systemctl client
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: '34875913257'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/force.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/force-cancel")"
          cat /tmp/force.out || true
          case "$code" in 202|409) ;; *) exit 1 ;; esac
          echo "LANE2_WAITER_FORCE_CANCEL_HTTP=$code"
