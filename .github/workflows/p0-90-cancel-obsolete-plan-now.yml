name: p0-90-cancel-obsolete-plan-now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-90-cancel-obsolete-plan-now.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-storage-runs:
    if: >-
      github.repository == 'aliezzat4321/hyperliquid-copy-engine' &&
      contains(github.event.head_commit.message, '[CANCEL_OBSOLETE_STORAGE_PLAN]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded slow storage runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 34766743062 34874040439 34874153179; do
            code="$(curl -sS -o "/tmp/cancel-$run_id.out" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel")"
            cat "/tmp/cancel-$run_id.out" || true
            case "$code" in
              202|409) ;;
              *) echo "unexpected_cancel_http=$code run_id=$run_id" >&2; exit 1 ;;
            esac
            echo "CANCEL_REQUEST run_id=$run_id http=$code"
          done
