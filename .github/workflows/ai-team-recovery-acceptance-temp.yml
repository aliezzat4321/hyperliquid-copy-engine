name: ai-team-acceptance-continuation-temp

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths:
      - .github/workflows/ai-team-recovery-acceptance-temp.yml

permissions:
  contents: read

jobs:
  continue:
    runs-on: [self-hosted, linux]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
      - name: Finish recovery and review-repair drills
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'aliezzat4321/hyperliquid-copy-engine'
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          systemctl stop hyperliquid-ai-team-orchestrator.timer || true
          trap 'systemctl start hyperliquid-ai-team-orchestrator.timer || true' EXIT

          bash scripts/install_ai_team_orchestrator.sh

          PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import ai_team_orchestrator as orch
          team = orch.Orchestrator()
          row = team.ledger.db.execute("SELECT * FROM tasks WHERE issue_number=135 AND task_type='BUILD' ORDER BY created_at DESC LIMIT 1").fetchone()
          assert row and row['status'] == 'BLOCKED', dict(row) if row else None
          assert row['session_id'] and row['workdir']
          assert 'Codex failed rc=2' in (row['last_error'] or '')
          team.ledger.update(
              row['id'], status='RETRY', attempt=1, retry_at=orch.utcnow(),
              last_error='RESUME_AFTER_CODEX_CLI_FIX'
          )
          team.runtime.event('CODEX_CLI_FIX_RECOVERY_ARMED', assignment_id=row['id'], issue=135, session_id=row['session_id'])
          team.sync_runtime_checkpoint()
          print('ISSUE135_FIXED_RESUME=ARMED')
          PY

          systemctl start hyperliquid-ai-team-orchestrator.service

          PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import ai_team_orchestrator as orch
          team = orch.Orchestrator()
          build = team.ledger.db.execute("SELECT * FROM tasks WHERE issue_number=135 AND task_type='BUILD' ORDER BY created_at DESC LIMIT 1").fetchone()
          assert build and build['status'] == 'DONE', dict(build) if build else None
          review = team.ledger.db.execute("SELECT * FROM tasks WHERE issue_number=135 AND task_type='REVIEW' ORDER BY created_at DESC LIMIT 1").fetchone()
          assert review and review['status'] == 'PENDING', dict(review) if review else None
          print('ISSUE135_CODEX_SESSION_RESUME=PASS')
          print('ISSUE135_PR=' + str(review['pr_number']))
          print('ISSUE135_SHA=' + str(review['target_sha']))
          PY

          systemctl start hyperliquid-ai-team-orchestrator.service

          PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import ai_team_orchestrator as orch
          team = orch.Orchestrator()
          review = team.ledger.db.execute("SELECT * FROM tasks WHERE issue_number=135 AND task_type='REVIEW' ORDER BY created_at DESC LIMIT 1").fetchone()
          assert review and review['status'] == 'WAITING_RATE_LIMIT', dict(review) if review else None
          assert review['last_error'] == 'TEST_INJECTED_CLAUDE_RATE_LIMIT'
          assert review['session_id'] and review['retry_at'] and review['target_sha'] and review['pr_number']
          old = review['retry_at']
          team.runtime.event('ISSUE135_CLAUDE_RATE_LIMIT_CHECKPOINT_PROVED', assignment_id=review['id'], issue=135, pr=review['pr_number'], target_sha=review['target_sha'], session_id=review['session_id'], retry_after=old)
          team.ledger.update(review['id'], retry_at=orch.utcnow())
          team.sync_runtime_checkpoint()
          print('ISSUE135_CLAUDE_RATE_LIMIT_CHECKPOINT=PASS')
          PY

          systemctl start hyperliquid-ai-team-orchestrator.service

          PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import ai_team_orchestrator as orch
          team = orch.Orchestrator()
          review = team.ledger.db.execute("SELECT * FROM tasks WHERE issue_number=135 AND task_type='REVIEW' ORDER BY created_at DESC LIMIT 1").fetchone()
          assert review and review['status'] == 'WAITING_CI', dict(review) if review else None
          print('ISSUE135_CLAUDE_SESSION_RESUME=PASS')
          PY

          for i in $(seq 1 10); do
            PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import ai_team_orchestrator as orch
          team = orch.Orchestrator()
          for row in team.ledger.db.execute("SELECT * FROM tasks WHERE issue_number=135 AND status='WAITING_CI'"):
              team.ledger.update(row['id'], retry_at=orch.utcnow())
          PY
            systemctl start hyperliquid-ai-team-orchestrator.service || true
            [[ "$(gh api repos/aliezzat4321/hyperliquid-copy-engine/issues/135 --jq .state)" = closed ]] && break
            sleep 6
          done
          test "$(gh api repos/aliezzat4321/hyperliquid-copy-engine/issues/135 --jq .state)" = closed
          echo 'ISSUE135=COMPLETE'

          PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import ai_team_orchestrator as orch
          team = orch.Orchestrator()
          issue = team.gh.issue(136)
          if issue.get('state') != 'closed':
              team.gh.add_labels(136, [team.cfg['labels']['ready']])
          print('ISSUE136=QUEUED')
          PY

          for phase in $(seq 1 16); do
            PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import ai_team_orchestrator as orch
          team = orch.Orchestrator()
          for row in team.ledger.db.execute("SELECT * FROM tasks WHERE issue_number=136 AND status IN ('RETRY','WAITING_RATE_LIMIT','WAITING_CI')"):
              team.ledger.update(row['id'], retry_at=orch.utcnow())
          PY
            systemctl start hyperliquid-ai-team-orchestrator.service || true
            [[ "$(gh api repos/aliezzat4321/hyperliquid-copy-engine/issues/136 --jq .state)" = closed ]] && break
            sleep 5
          done
          test "$(gh api repos/aliezzat4321/hyperliquid-copy-engine/issues/136 --jq .state)" = closed

          PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import ai_team_orchestrator as orch
          team = orch.Orchestrator()
          rows = list(team.ledger.db.execute("SELECT task_type,status,target_sha,previous_sha,blockers_json FROM tasks WHERE issue_number=136 ORDER BY created_at"))
          assert any(r['task_type'] == 'REVIEW' and r['status'] == 'DONE' and r['blockers_json'] not in (None, '[]') for r in rows), [dict(r) for r in rows]
          assert any(r['task_type'] == 'REPAIR' and r['status'] == 'DONE' for r in rows), [dict(r) for r in rows]
          assert any(r['task_type'] == 'REVIEW' and r['status'] == 'DONE' and r['previous_sha'] for r in rows), [dict(r) for r in rows]
          print('ISSUE136_FAIL_REPAIR_PASS=COMPLETE')
          PY

          hl-ai-team-status
          git config user.name 'aliezzat4321'
          git config user.email 'ali.ezzat4321@gmail.com'
          git remote set-url origin git@github.com:aliezzat4321/hyperliquid-copy-engine.git
          git rm .github/workflows/ai-team-recovery-acceptance-temp.yml
          git commit -m 'Remove temporary AI-team acceptance continuation'
          git push origin HEAD:codex/126-ai-orchestrator
          echo 'TEMP_ACCEPTANCE_WORKFLOW=REMOVED'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
