name: ai-team-recovery-acceptance-temp

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths:
      - .github/workflows/ai-team-recovery-acceptance-temp.yml

permissions:
  contents: read

jobs:
  stage1b:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Record probe evidence and resume Codex checkpoint
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          systemctl stop hyperliquid-ai-team-orchestrator.timer || true
          trap 'systemctl start hyperliquid-ai-team-orchestrator.timer || true' EXIT
          PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import ai_team_orchestrator as orch
          team = orch.Orchestrator()
          row = team.ledger.db.execute("SELECT * FROM tasks WHERE issue_number=135 AND task_type='BUILD' ORDER BY created_at DESC LIMIT 1").fetchone()
          assert row and row['status'] == 'RETRY'
          assert row['last_error'] == 'TEST_INJECTED_CODEX_SESSION_END'
          assert row['session_id'] and row['retry_at'] and row['workdir']
          old = row['retry_at']
          team.runtime.event('FRESH_RECOVERY_PROBE_PASSED', assignment_id=row['id'], issue=135, observed_state='RETRY', observed_branch=row['branch'], observed_next='launch build in isolated agent worktree')
          team.ledger.update(row['id'], retry_at=orch.utcnow())
          team.runtime.event('TEST_RETRY_CLOCK_ACCELERATED', assignment_id=row['id'], issue=135, phase='CODEX_RESUME', previous_retry_after=old)
          team.sync_runtime_checkpoint()
          print('FRESH_RECOVERY_PROBE=PASS')
          print('CODEX_CHECKPOINT=PERSISTED_AND_READY')
          PY
          systemctl start hyperliquid-ai-team-orchestrator.service
          hl-ai-team-status
          echo 'CODEX_RESUME_CYCLE=COMPLETE'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
