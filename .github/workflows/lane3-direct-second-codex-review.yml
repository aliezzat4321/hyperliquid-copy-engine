name: lane3-direct-second-codex-review

on:
  push:
    branches: [codex/lane3-second-review-runner]
    paths:
      - ".github/workflows/lane3-direct-second-codex-review.yml"
      - ".github/review-prompts/lane3-331.txt"
      - ".github/review-prompts/lane3-333.txt"
      - "scripts/run_lane3_direct_codex_reviews.sh"

permissions:
  contents: read

jobs:
  review:
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lane3-second-review-runner
          fetch-depth: 1
      - name: Exact-SHA second Codex reviews
        shell: bash
        run: bash scripts/run_lane3_direct_codex_reviews.sh
