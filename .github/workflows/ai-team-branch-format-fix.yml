name: ai-team-branch-format-fix

on:
  push:
    branches:
      - codex/126-ai-orchestrator
    paths:
      - ".github/workflows/ai-team-branch-format-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/126-ai-orchestrator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format only new AI-team Python files
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.5'
          ruff check --fix --unsafe-fixes \
            scripts/ai_team_orchestrator.py \
            tests/test_ai_team_orchestrator.py || true
          ruff format \
            scripts/ai_team_orchestrator.py \
            tests/test_ai_team_orchestrator.py
          ruff check \
            scripts/ai_team_orchestrator.py \
            tests/test_ai_team_orchestrator.py
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'NO_FORMAT_CHANGES=YES'
            exit 0
          fi
          git config user.name 'hyperliquid-ai-team'
          git config user.email 'hyperliquid-ai-team@users.noreply.github.com'
          git add scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          git commit -m 'Format AI-team orchestrator and tests'
          git push origin HEAD:codex/126-ai-orchestrator
