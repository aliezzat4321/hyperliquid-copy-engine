name: p0-90-direct-trusted-opus-review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-90-direct-trusted-opus-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    env:
      PLAN_RUN_ID: '34766743062'
      PLAN_COMPLETED_AT: '2026-09-13T16:39:27Z'
      CODE_SHA: 'd763b536edd9d6fc5fce76105996bfaf5858d85b'
      RETENTION_SHA: '1f4d4bc45405ab397decca395ea2848f777796afe06bcd6058d5a2b0beba1638'
      BOOTSTRAP_SHA: '76ef0efb586a6dd5099ca00ca5f1847a3d50d78081ecc2b7acba4e3b197b2f30'
      LIFECYCLE_SHA: 'ca0bcbd764a68d821c179e3e92f4ad8dc1246fbc71078f506ef6fa02c824b705'
      BINDING_SHA: '6c3f74a34d6e3f94872297c0445de075bc5d2fda1449869d54979fe9231bc661'
      ARTIFACT_NAME: 'p0-90-storage-review-d763b536edd9d6fc5fce76105996bfaf5858d85b'
      BUNDLE_DIR: /tmp/p0-90-direct-opus-${{ github.run_id }}
      REVIEW_WORKDIR: /var/lib/hyperliquid-ai-team/agents/claude/worktrees/p0-90-direct-opus-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUNDLE_DIR }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PLAN_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify exact fresh plan and run direct trusted Opus review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CODE_SHA"
          test "$(sha256sum "$BUNDLE_DIR/retention/storage_retention_manifest.json" | awk '{print $1}')" = "$RETENTION_SHA"
          test "$(sha256sum "$BUNDLE_DIR/bootstrap-plan.json" | awk '{print $1}')" = "$BOOTSTRAP_SHA"
          test "$(sha256sum "$BUNDLE_DIR/lifecycle-plan.json" | awk '{print $1}')" = "$LIFECYCLE_SHA"
          test "$(sha256sum "$BUNDLE_DIR/review-binding.json" | awk '{print $1}')" = "$BINDING_SHA"

          sudo systemctl stop hyperliquid-ai-team-orchestrator.timer || true
          sudo systemctl stop hyperliquid-ai-team-orchestrator.service || true
          sudo systemctl stop hyperliquid-ai-external-supervisor.timer || true
          sudo systemctl stop hyperliquid-ai-external-supervisor.service || true

          sudo rm -rf "$REVIEW_WORKDIR"
          sudo mkdir -p "$REVIEW_WORKDIR/review_bundle/retention"
          sudo cp -a "$GITHUB_WORKSPACE/." "$REVIEW_WORKDIR/"
          sudo cp "$BUNDLE_DIR/retention/storage_retention_manifest.json" "$REVIEW_WORKDIR/review_bundle/retention/storage_retention_manifest.json"
          sudo cp "$BUNDLE_DIR/bootstrap-plan.json" "$REVIEW_WORKDIR/review_bundle/bootstrap-plan.json"
          sudo cp "$BUNDLE_DIR/lifecycle-plan.json" "$REVIEW_WORKDIR/review_bundle/lifecycle-plan.json"
          sudo cp "$BUNDLE_DIR/review-binding.json" "$REVIEW_WORKDIR/review_bundle/review-binding.json"
          sudo cp "$BUNDLE_DIR/lifecycle-plan.stdout" "$REVIEW_WORKDIR/review_bundle/lifecycle-plan.stdout"
          sudo chown -R hl-claude-agent:hl-claude-agent "$REVIEW_WORKDIR"

          sudo env \
            CODE_SHA="$CODE_SHA" PLAN_RUN_ID="$PLAN_RUN_ID" PLAN_COMPLETED_AT="$PLAN_COMPLETED_AT" \
            RETENTION_SHA="$RETENTION_SHA" BOOTSTRAP_SHA="$BOOTSTRAP_SHA" \
            LIFECYCLE_SHA="$LIFECYCLE_SHA" BINDING_SHA="$BINDING_SHA" REVIEW_WORKDIR="$REVIEW_WORKDIR" \
            python3 - <<'PY'
          import json, os, re, sqlite3, subprocess, sys, uuid
          from pathlib import Path
          sys.path.insert(0, '/opt/hyperliquid-ai-team/scripts')
          import ai_team_orchestrator as orch

          o=orch.Orchestrator()
          ledger=o.ledger
          task_id=uuid.uuid4().hex[:16]
          workdir=Path(os.environ['REVIEW_WORKDIR'])
          plan={
            'plan_run_id':os.environ['PLAN_RUN_ID'],
            'plan_completed_at':os.environ['PLAN_COMPLETED_AT'],
            'retention_sha':os.environ['RETENTION_SHA'],
            'bootstrap_sha':os.environ['BOOTSTRAP_SHA'],
            'lifecycle_sha':os.environ['LIFECYCLE_SHA'],
            'binding_sha':os.environ['BINDING_SHA'],
          }
          ledger.create_task(
            id=task_id, issue_number=90, pr_number=288, task_type='DESTRUCTIVE_REVIEW',
            agent='CLAUDE', model_class='OPUS', task_class='ROUTINE', queue_priority=-100000,
            status='RUNNING', target_sha=os.environ['CODE_SHA'], workdir=str(workdir),
            lifecycle_phase='DESTRUCTIVE_REVIEW',
            completion_contract={'version':1,'close_on_merge':False,'requirements':['STORAGE_PROOF']},
            evidence={'requirement':'STORAGE_PROOF','trusted_plan':plan},
          )
          task=ledger.get(task_id)
          log_path=Path('/var/lib/hyperliquid-ai-team/agents/claude/logs')/f'{task_id}-direct.json'
          log_path.parent.mkdir(parents=True,exist_ok=True)
          run_id=ledger.open_run(task,log_path)

          prompt=f'''You are Claude Opus, the independent destructive-storage reviewer for Hyperliquid issue #90.
Review the exact immutable production storage plan below. Do not modify files and do not perform deletion.

Trusted binding:
ASSIGNMENT_ID={task_id}
TARGET_SHA={os.environ['CODE_SHA']}
PLAN_RUN_ID={os.environ['PLAN_RUN_ID']}
PLAN_COMPLETED_AT={os.environ['PLAN_COMPLETED_AT']}
RETENTION_MANIFEST_SHA256={os.environ['RETENTION_SHA']}
BOOTSTRAP_PLAN_SHA256={os.environ['BOOTSTRAP_SHA']}
LIFECYCLE_MANIFEST_SHA256={os.environ['LIFECYCLE_SHA']}
REVIEW_BINDING_SHA256={os.environ['BINDING_SHA']}
PR_NUMBER=288

Files in this worktree:
- review_bundle/retention/storage_retention_manifest.json
- review_bundle/bootstrap-plan.json
- review_bundle/lifecycle-plan.json
- review_bundle/review-binding.json
- review_bundle/lifecycle-plan.stdout

Fresh plan summary:
- DELETE_CANDIDATE=3725421297 bytes
- COMPRESS_CANDIDATE=15273794069 bytes
- KEEP_RECENT_FULL_FIDELITY=1507873061 bytes
- KEEP_ROBUST_FULL_FIDELITY=3549148606 bytes
- protected robust/profitability evidence must remain protected
- PostgreSQL filesystem deletion is forbidden
- Polymarket mutation is forbidden
- real trading must remain OFF

Use targeted Python/jq/Grep checks rather than reading the entire large lifecycle file. Verify exact hashes if useful from the local files, verify delete roots/actions are bounded to Hyperliquid market-shadow and COMPRESS_CANDIDATE-only lifecycle scope, verify protected/recent/robust/profitability partitions are excluded, and verify the plan does not authorize PostgreSQL filesystem deletion, Polymarket mutation, or live trading.

If and only if the exact plan is safe to apply, end with EXACTLY these lines:
SECOND_PASS_GATE=PASS
MODEL_CLASS=OPUS
ASSIGNMENT_ID={task_id}
TARGET_SHA={os.environ['CODE_SHA']}
PLAN_RUN_ID={os.environ['PLAN_RUN_ID']}
RETENTION_MANIFEST_SHA256={os.environ['RETENTION_SHA']}
BOOTSTRAP_PLAN_SHA256={os.environ['BOOTSTRAP_SHA']}
LIFECYCLE_MANIFEST_SHA256={os.environ['LIFECYCLE_SHA']}
REVIEW_BINDING_SHA256={os.environ['BINDING_SHA']}
DESTRUCTIVE_STORAGE_APPLY=APPROVED
REAL_TRADING_ENABLED=NO
POSTGRESQL_FILESYSTEM_DELETION=NO
POLYMARKET_MUTATION=NO

If any safety condition fails, return SECOND_PASS_GATE=FAIL and do NOT emit DESTRUCTIVE_STORAGE_APPLY=APPROVED.'''

          o.runtime.run_started(run_id, task, prompt=prompt, systemd_unit='DIRECT_TRUSTED_OPUS')
          uid=subprocess.check_output(['id','-u','hl-claude-agent'],text=True).strip()
          gid=subprocess.check_output(['id','-g','hl-claude-agent'],text=True).strip()
          home='/var/lib/hyperliquid-ai-team/agents/claude/home'
          cmd=[
            'timeout','--foreground','600s',
            'setpriv',f'--reuid={uid}',f'--regid={gid}','--init-groups',
            'env','-i',f'HOME={home}',f'CLAUDE_CONFIG_DIR={home}/.claude',
            f'XDG_CONFIG_HOME={home}/.config',f'XDG_CACHE_HOME={home}/.cache',
            'PATH=/usr/local/bin:/usr/bin:/bin',
            '/usr/bin/claude','-p','--model','opus','--max-turns','30',
            '--output-format','json','--permission-mode','dontAsk','--allowedTools','Read,Glob,Grep,Bash',
            prompt,
          ]
          cp=subprocess.run(cmd,cwd=str(workdir),text=True,capture_output=True,timeout=660)
          combined=cp.stdout+('\n'+cp.stderr if cp.stderr else '')
          log_path.write_text(orch.bounded_redacted(combined))
          session_id,usage,result=orch.parse_claude_output(cp.stdout)
          ledger.close_run(run_id,exit_code=cp.returncode,session_id=session_id,usage=usage,result=result,error=None if cp.returncode==0 else combined[-1500:])
          if cp.returncode!=0:
              o.finish_runtime_run(run_id,task_id,stdout=cp.stdout,stderr=cp.stderr,exit_code=cp.returncode,session_id=session_id,usage=usage,result=result,error=f'direct Claude failed rc={cp.returncode}',status='STALE')
              ledger.update(task_id,status='STALE',last_error=f'direct Claude failed rc={cp.returncode}',session_id=session_id,systemd_unit=None)
              print(combined[-4000:])
              raise SystemExit(f'Claude rc={cp.returncode}')
          required={
            'SECOND_PASS_GATE':'PASS','MODEL_CLASS':'OPUS','ASSIGNMENT_ID':task_id,
            'TARGET_SHA':os.environ['CODE_SHA'],'PLAN_RUN_ID':os.environ['PLAN_RUN_ID'],
            'RETENTION_MANIFEST_SHA256':os.environ['RETENTION_SHA'],
            'BOOTSTRAP_PLAN_SHA256':os.environ['BOOTSTRAP_SHA'],
            'LIFECYCLE_MANIFEST_SHA256':os.environ['LIFECYCLE_SHA'],
            'REVIEW_BINDING_SHA256':os.environ['BINDING_SHA'],
            'DESTRUCTIVE_STORAGE_APPLY':'APPROVED','REAL_TRADING_ENABLED':'NO',
            'POSTGRESQL_FILESYSTEM_DELETION':'NO','POLYMARKET_MUTATION':'NO',
          }
          for key,val in required.items():
              vals=re.findall(rf'(?mi)^\s*{re.escape(key)}\s*=\s*([^\s]+)\s*$',result or '')
              if vals != [val]:
                  o.finish_runtime_run(run_id,task_id,stdout=cp.stdout,stderr=cp.stderr,exit_code=1,session_id=session_id,usage=usage,result=result,error=f'missing/wrong marker {key}',status='STALE')
                  ledger.update(task_id,status='STALE',last_error=f'missing/wrong marker {key}',session_id=session_id,systemd_unit=None)
                  print(result[-6000:])
                  raise SystemExit(f'missing/wrong marker {key}: {vals}')
          ledger.update(task_id,status='DONE',last_error=None,session_id=session_id,retry_at=None,systemd_unit=None)
          o.finish_runtime_run(run_id,task_id,stdout=cp.stdout,stderr=cp.stderr,exit_code=0,session_id=session_id,usage=usage,result=result,status='PASS',blockers=[])
          Path('/tmp/p0-90-direct-opus-assignment').write_text(task_id)
          print('DIRECT_TRUSTED_OPUS_PASS=YES')
          print('OPUS_ASSIGNMENT_ID='+task_id)
          print(result[-5000:])
          PY

          assignment_id="$(cat /tmp/p0-90-direct-opus-assignment)"
          sudo python3 /opt/hyperliquid-ai-team/scripts/verify_trusted_opus_storage_review.py \
            --db /var/lib/hyperliquid-ai-team/orchestrator/ledger.sqlite3 \
            --runtime-root /var/lib/hyperliquid-ai-team \
            --assignment-id "$assignment_id" \
            --code-sha "$CODE_SHA" \
            --plan-run-id "$PLAN_RUN_ID" \
            --plan-completed-at "$PLAN_COMPLETED_AT" \
            --retention-sha "$RETENTION_SHA" \
            --bootstrap-sha "$BOOTSTRAP_SHA" \
            --lifecycle-sha "$LIFECYCLE_SHA" \
            --binding-sha "$BINDING_SHA"
          echo TRUSTED_OPUS_VERIFIER=PASS
          echo OPUS_ASSIGNMENT_ID="$assignment_id"
