name: fix-public-trade-lint-temp

on:
  push:
    branches: [agent/free-public-wallet-identifier-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Ruff unused lifecycle import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/free-public-wallet-identifier-v1
          fetch-depth: 0
      - name: Remove unused import and push
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/hlcopy/resolver/public_trade_index.py')
          text = path.read_text()
          old = '    LifecycleEpisodeEvidence,\n'
          if old in text:
              path.write_text(text.replace(old, '', 1))
          PY
          if git diff --quiet; then
            echo 'No lint fix needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hlcopy/resolver/public_trade_index.py
          git commit -m 'Fix Ruff unused lifecycle import'
          git push origin HEAD:agent/free-public-wallet-identifier-v1
