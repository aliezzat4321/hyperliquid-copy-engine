name: deploy-ai-team-orchestrator

on:
  push:
    branches:
      - main
      - codex/126-ai-orchestrator
    paths:
      - "scripts/ai_team_orchestrator.py"
      - "scripts/ai_team_runtime_ledger.py"
      - "scripts/ai_team_auth_codex.sh"
      - "scripts/ai_team_auth_claude.sh"
      - "scripts/install_ai_team_orchestrator.sh"
      - "scripts/install_codex_code_mode_host.sh"
      - "config/ai_team_router.json"
      - "deploy/systemd/hyperliquid-ai-team-orchestrator.service"
      - "deploy/systemd/hyperliquid-ai-team-orchestrator.timer"
      - ".github/workflows/deploy-ai-team-orchestrator.yml"

permissions:
  contents: read

concurrency:
  group: deploy-ai-team-orchestrator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Assert hard boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(id -u)" = 0
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py
          python3 -m json.tool config/ai_team_router.json >/dev/null
          bash -n scripts/ai_team_auth_codex.sh
          bash -n scripts/ai_team_auth_claude.sh
          bash -n scripts/install_ai_team_orchestrator.sh
          bash -n scripts/install_codex_code_mode_host.sh
          systemd-analyze verify \
            deploy/systemd/hyperliquid-ai-team-orchestrator.service \
            deploy/systemd/hyperliquid-ai-team-orchestrator.timer

      - name: Install namespaced Hyperliquid AI team components
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_ai_team_orchestrator.sh
          test -x /usr/local/bin/codex-code-mode-host
          test -x /usr/local/bin/bwrap
          test -x /usr/local/sbin/hl-ai-team-auth-codex

          # P0 bootstrap: stale/non-mergeable PRs are task-local state, never a
          # process-wide fatal. Patch only the installed runtime copy; #233 owns
          # the durable tested source-level fix. Fail closed if source shape moves.
          python3 - /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = '        merged = self.gh.merge(int(task["pr_number"]), target)\n'
          new = '''        try:
              merged = self.gh.merge(int(task["pr_number"]), target)
          except RuntimeError as exc:
              error = str(exc)
              if "HTTP 405" not in error and "not mergeable" not in error and "merge conflicts" not in error:
                  raise
              self.ledger.update(
                  task["id"],
                  status="STALE",
                  retry_at=None,
                  last_error=f"merge no longer applicable: {error[-500:]}",
              )
              self.runtime.event(
                  "MERGE_TASK_STALE",
                  assignment_id=task["id"],
                  issue=task["issue_number"],
                  pr=task["pr_number"],
                  target_sha=target,
                  error=error[-500:],
              )
              return
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one merge call, found {count}")
          path.write_text(text.replace(old, new))
          print("AI_TEAM_MERGE_405_ISOLATION_HOTFIX=APPLIED")
          PY
          python3 -m py_compile /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py

          if ! systemctl start hyperliquid-ai-team-orchestrator.service; then
            echo '=== AI TEAM SERVICE STATUS ==='
            systemctl status hyperliquid-ai-team-orchestrator.service --no-pager -l || true
            echo '=== AI TEAM SERVICE JOURNAL ==='
            journalctl -u hyperliquid-ai-team-orchestrator.service -n 200 --no-pager -l || true
            echo 'POLYMARKET_TOUCHED=NO'
            echo 'REAL_TRADING_TOUCHED=NO'
            exit 1
          fi
          systemctl is-enabled hyperliquid-ai-team-orchestrator.timer
          hl-ai-team-status
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
