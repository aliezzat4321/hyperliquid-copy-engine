name: external-autonomy-supervisor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/external-autonomy-supervisor.yml

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  STATUS_ISSUE: '130'
  STALE_SECONDS: '360'

jobs:
  supervise:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 12
    steps:
      - name: Check canonical runtime freshness
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          from datetime import datetime, timezone

          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["REPO"]}/issues/{os.environ["STATUS_ISSUE"]}',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.load(r)
          updated = datetime.fromisoformat(data['updated_at'].replace('Z', '+00:00'))
          age = int((datetime.now(timezone.utc) - updated).total_seconds())
          degraded = '"native_checkpoint_stale":true' in str(data.get('body') or '').replace(' ', '').lower()
          stale = age > int(os.environ['STALE_SECONDS']) or degraded
          print(f'age_seconds={age}')
          print(f'stale={str(stale).lower()}')
          print(f'updated_at={data["updated_at"]}')
          print(f'#130 updated_at={data["updated_at"]} age_seconds={age} degraded={degraded} stale={stale}')
          PY

      - name: Install fail-forward control-plane containment
        if: steps.freshness.outputs.stale == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          ORCH=/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          if [ ! -f "$ORCH" ]; then
            echo "P0 supervisor preflight failed: orchestrator missing: $ORCH" >&2
            exit 2
          fi
          sudo python3 - <<'PY'
          from pathlib import Path

          path = Path('/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py')
          text = path.read_text()
          marker = 'CONTROL_PLANE_STEP_QUARANTINED'
          if marker in text:
              print('fail-forward containment already installed')
              raise SystemExit(0)

          old = '''        self.migrate_legacy_remediation()\n        self.reconcile_recovery()\n        self.reconcile_completion_rollout()\n        self.reconcile_handoffs()\n        if self.ledger.due() is not None:\n            self.reconcile_parent_finalizers()\n        self.sync_runtime_checkpoint()\n        self.kick_trello_reconciliation()\n        task = self.ledger.due()\n        if task is None:\n            if not self.claim_ready_issue():\n                self.reconcile_parent_finalizers()\n                if not self.claim_ready_issue():\n                    self.promote_queued_issue()\n            task = self.ledger.due()\n'''
          new = '''        def _safe_control_plane_step(name: str, fn):\n            try:\n                return fn()\n            except Exception as exc:\n                self.runtime.event(\n                    "CONTROL_PLANE_STEP_QUARANTINED", step=name,\n                    error=f"{type(exc).__name__}: {exc}", status="QUARANTINED",\n                )\n                return None\n\n        _safe_control_plane_step("migrate_legacy_remediation", self.migrate_legacy_remediation)\n        _safe_control_plane_step("reconcile_recovery", self.reconcile_recovery)\n        _safe_control_plane_step("reconcile_completion_rollout", self.reconcile_completion_rollout)\n        _safe_control_plane_step("reconcile_handoffs", self.reconcile_handoffs)\n        if self.ledger.due() is not None:\n            _safe_control_plane_step("reconcile_parent_finalizers", self.reconcile_parent_finalizers)\n        _safe_control_plane_step("sync_runtime_checkpoint", self.sync_runtime_checkpoint)\n        _safe_control_plane_step("kick_trello_reconciliation", self.kick_trello_reconciliation)\n        task = self.ledger.due()\n        if task is None:\n            claimed = bool(_safe_control_plane_step("claim_ready_issue", self.claim_ready_issue))\n            if not claimed:\n                _safe_control_plane_step("reconcile_parent_finalizers", self.reconcile_parent_finalizers)\n                claimed = bool(_safe_control_plane_step("claim_ready_issue", self.claim_ready_issue))\n                if not claimed:\n                    _safe_control_plane_step("promote_queued_issue", self.promote_queued_issue)\n            task = self.ledger.due()\n'''
          if old not in text:
              raise SystemExit('P0 containment refused: expected cycle block not found')
          text = text.replace(old, new, 1)

          old_dispatch = '''            else:\n                self.block(task, f"unsupported task type {task['task_type']}")\n        finally:\n            self.sync_runtime_checkpoint()\n            self.kick_trello_reconciliation()\n'''
          new_dispatch = '''            else:\n                self.block(task, f"unsupported task type {task['task_type']}")\n        except ValueError as exc:\n            if str(exc) == "MISSING_COMPLETION_CONTRACT":\n                self.ledger.update(\n                    task["id"], status="STALE", retry_at=None, systemd_unit=None,\n                    last_error="MISSING_COMPLETION_CONTRACT; task-local quarantine",\n                )\n                self.runtime.event(\n                    "TASK_QUARANTINED", assignment_id=task["id"],\n                    issue=task["issue_number"], pr=task["pr_number"],\n                    failure_class="MISSING_COMPLETION_CONTRACT", status="QUARANTINED",\n                )\n            else:\n                raise\n        finally:\n            self.sync_runtime_checkpoint()\n            self.kick_trello_reconciliation()\n'''
          if old_dispatch not in text:
              raise SystemExit('P0 containment refused: expected dispatch block not found')
          text = text.replace(old_dispatch, new_dispatch, 1)
          path.write_text(text)
          path.chmod(0o755)
          print('installed task-local fail-forward containment')
          PY

      - name: Recover stalled control plane
        id: recover
        if: steps.freshness.outputs.stale == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          ORCH=/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          if [ ! -x "$ORCH" ]; then
            echo "P0 supervisor preflight failed: orchestrator missing/not executable: $ORCH" >&2
            exit 2
          fi

          successes=0
          for i in 1 2 3 4 5 6; do
            if sudo timeout 90 "$ORCH" --once; then
              successes=$((successes+1))
            fi
            sleep 1
          done

          if [ "$successes" -eq 0 ]; then
            sudo pkill -TERM -f '/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py' || true
            sleep 5
            sudo pkill -KILL -f '/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py' || true
            sleep 2
            for i in 1 2 3 4; do
              if sudo timeout 90 "$ORCH" --once; then
                successes=$((successes+1))
              fi
              sleep 1
            done
          fi

          sudo timeout 30 "$ORCH" --status | tee /tmp/hyperliquid-ai-team-supervisor-status.txt || true
          echo "successful_cycles=$successes" >> "$GITHUB_OUTPUT"
          if [ "$successes" -eq 0 ]; then
            echo 'P0 external supervisor could not restore a successful orchestrator cycle' >&2
            exit 3
          fi

      - name: Reconcile #130 checkpoint
        if: steps.freshness.outputs.stale == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUCCESSFUL_CYCLES: ${{ steps.recover.outputs.successful_cycles }}
        run: |
          set -euo pipefail
          sleep 3
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['REPO']
          issue = os.environ['STATUS_ISSUE']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          url = f'https://api.github.com/repos/{repo}/issues/{issue}'
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.load(r)
          updated = datetime.fromisoformat(data['updated_at'].replace('Z', '+00:00'))
          age = int((datetime.now(timezone.utc) - updated).total_seconds())
          body = str(data.get('body') or '')
          native_fresh = age <= int(os.environ['STALE_SECONDS']) and '"native_checkpoint_stale":true' not in body.replace(' ', '').lower()
          if native_fresh:
              print(f'#130 native checkpoint recovered updated_at={data["updated_at"]} age_seconds={age}')
              raise SystemExit(0)

          status_path = Path('/tmp/hyperliquid-ai-team-supervisor-status.txt')
          status_text = status_path.read_text(errors='replace')[-12000:] if status_path.exists() else 'status output unavailable'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          checkpoint = {
              'protocol': 'AI_TEAM_RUNTIME_STATUS_V1',
              'status_source': 'EXTERNAL_AUTONOMY_SUPERVISOR',
              'status': 'DEGRADED_RECOVERING',
              'native_checkpoint_stale': True,
              'supervisor_observed_at': now,
              'successful_recovery_cycles': int(os.environ.get('SUCCESSFUL_CYCLES', '0') or 0),
              'pending_owner_action': None,
              'live_trading': 'NO',
              'note': 'Native checkpoint publisher is stale; external supervisor is keeping the control plane moving and will continue recovery every schedule until native publishing resumes.',
              'orchestrator_status_text': status_text,
          }
          new_body = '<!-- AI_TEAM_RUNTIME_STATUS_V1 -->\n# AI TEAM RUNTIME STATUS\n\n```json\n' + json.dumps(checkpoint, separators=(',', ':')) + '\n```\n'
          patch = urllib.request.Request(url, data=json.dumps({'body': new_body}).encode(), headers=headers, method='PATCH')
          with urllib.request.urlopen(patch, timeout=20) as r:
              result = json.load(r)
          print(f'#130 degraded checkpoint published updated_at={result["updated_at"]}')
          PY
