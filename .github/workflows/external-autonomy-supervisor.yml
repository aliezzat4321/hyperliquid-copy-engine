name: external-autonomy-supervisor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

env:
  STATUS_ISSUE: '130'
  STALE_SECONDS: '360'

jobs:
  observe:
    # Observation is intentionally GitHub-hosted and non-destructive. Host recovery is
    # owned by the canonical root systemd supervisor installed by
    # scripts/install_ai_team_supervisor.sh. This workflow must never invoke, timeout,
    # TERM, KILL, or pkill the production orchestrator.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check canonical runtime freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["REPO"]}/issues/{os.environ["STATUS_ISSUE"]}',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)
          updated = datetime.fromisoformat(data['updated_at'].replace('Z', '+00:00'))
          age = int((datetime.now(timezone.utc) - updated).total_seconds())
          body = str(data.get('body') or '')
          degraded = '"native_checkpoint_stale":true' in body.replace(' ', '').lower()
          stale = age > int(os.environ['STALE_SECONDS']) or degraded
          print(f'#130 updated_at={data["updated_at"]} age_seconds={age} degraded={degraded} stale={stale}')
          print('RECOVERY_ACTION=NONE_NON_DESTRUCTIVE_OBSERVER')
          print('REAL_TRADING_CHANGE=NO')
          print('POLYMARKET_TOUCHED=NO')
          if stale:
              raise SystemExit('runtime checkpoint is stale; canonical host supervisor must recover it')
          PY
