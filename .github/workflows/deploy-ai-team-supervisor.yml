name: deploy-ai-team-supervisor

on:
  push:
    branches:
      - main
    paths:
      - "scripts/ai_team_external_supervisor.py"
      - "scripts/install_ai_team_supervisor.sh"
      - "deploy/systemd/hyperliquid-ai-team-supervisor.service"
      - "deploy/systemd/hyperliquid-ai-team-supervisor.timer"
      - ".github/workflows/deploy-ai-team-supervisor.yml"

permissions:
  contents: read

concurrency:
  group: deploy-ai-team-supervisor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Assert hard boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(id -u)" = 0
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          echo 'MODEL_CALLS=NONE'

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ai_team_external_supervisor.py
          bash -n scripts/install_ai_team_supervisor.sh
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/ai_team_external_supervisor.py")
          spec = importlib.util.spec_from_file_location("ai_team_external_supervisor", path)
          assert spec and spec.loader
          sup = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sup)

          first = {
              "main_head": "abc",
              "pending_owner_action": None,
              "codex": {
                  "assignment_id": "c1",
                  "issue": 93,
                  "pr": None,
                  "status": "RETRY",
                  "task_type": "PRODUCTION_VALIDATION",
                  "target_sha": "def",
                  "retry_after": "2026-09-11T02:00:00Z",
                  "updated_at": "2026-09-11T02:00:00Z",
                  "last_progress": "2026-09-11T01:00:00Z",
                  "blocker": "awaiting evidence",
              },
              "claude": {"status": "IDLE"},
              "recovery": {"active_assignment": None},
          }
          second = {
              **first,
              "codex": {
                  **first["codex"],
                  "retry_after": "2026-09-11T03:00:00Z",
                  "updated_at": "2026-09-11T03:00:00Z",
              },
          }
          assert sup.fingerprint_material(first) == sup.fingerprint_material(second)
          progressed = {
              **second,
              "codex": {**second["codex"], "last_progress": "2026-09-11T03:00:00Z"},
          }
          assert sup.fingerprint_material(second) != sup.fingerprint_material(progressed)
          print("SUPERVISOR_PRODUCTION_PYTHON_SMOKE=PASS")
          PY
          systemd-analyze verify \
            deploy/systemd/hyperliquid-ai-team-supervisor.service \
            deploy/systemd/hyperliquid-ai-team-supervisor.timer

      - name: Install and prove independent supervisor
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_ai_team_supervisor.sh
          test -x /opt/hyperliquid-ai-team/scripts/ai_team_external_supervisor.py
          python3 -m py_compile /opt/hyperliquid-ai-team/scripts/ai_team_external_supervisor.py
          systemctl is-enabled hyperliquid-ai-team-supervisor.timer
          systemctl is-active hyperliquid-ai-team-supervisor.timer
          systemctl start hyperliquid-ai-team-supervisor.service
          systemctl --no-pager --full status hyperliquid-ai-team-supervisor.service || true
          test -s /var/lib/hyperliquid-ai-team-supervisor/state.json
          echo 'EXTERNAL_SUPERVISOR_RUNTIME=PROVEN'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
