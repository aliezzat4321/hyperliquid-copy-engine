name: ai-team-runtime-diagnose

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths:
      - .github/workflows/ai-team-runtime-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux]
    steps:
      - name: Run one Hyperliquid AI-team cycle with direct traceback
        shell: bash
        run: |
          set -uo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          echo '--- direct orchestrator cycle ---'
          /usr/bin/python3 /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py --once 2>&1
          direct_rc=$?
          echo "DIRECT_ORCHESTRATOR_RC=$direct_rc"
          echo '--- systemd status ---'
          systemctl status hyperliquid-ai-team-orchestrator.service --no-pager -l || true
          echo '--- status checkpoint ---'
          hl-ai-team-status || true
          echo '--- latest ledger tasks/runs ---'
          python3 - <<'PY'
          import sqlite3
          p='/var/lib/hyperliquid-ai-team/orchestrator/ledger.sqlite3'
          db=sqlite3.connect(p)
          db.row_factory=sqlite3.Row
          for r in db.execute('select id,issue_number,pr_number,task_type,agent,model_class,status,branch,target_sha,session_id,attempt,retry_at,last_error,updated_at from tasks order by created_at desc limit 8'):
              print(dict(r))
          print('RUNS')
          for r in db.execute('select id,task_id,agent,model_class,started_at,ended_at,exit_code,session_id,input_tokens,output_tokens,cached_input_tokens,log_path,error from runs order by id desc limit 8'):
              print(dict(r))
          PY
          echo '--- recent AI-team service journal ---'
          journalctl -u hyperliquid-ai-team-orchestrator.service --since '30 minutes ago' -n 120 --no-pager -o short-precise || true
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
          exit 0
