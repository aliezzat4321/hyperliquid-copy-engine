name: ai-team-runtime-diagnose

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths:
      - .github/workflows/ai-team-runtime-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux]
    steps:
      - name: Inspect isolated Codex runtime without another model call
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          systemctl stop hyperliquid-ai-team-orchestrator.timer
          echo 'AI_TEAM_TIMER=PAUSED_FOR_DIAGNOSIS'
          work=/var/lib/hyperliquid-ai-team/agents/codex/worktrees/f799b5cc7d574139
          echo '--- path permissions ---'
          namei -l "$work" || true
          stat -c '%A %U:%G %n' /var/lib/hyperliquid-ai-team /var/lib/hyperliquid-ai-team/agents /var/lib/hyperliquid-ai-team/agents/codex /var/lib/hyperliquid-ai-team/agents/codex/worktrees "$work" || true
          echo '--- agent access ---'
          setpriv --reuid="$(id -u hl-codex-agent)" --regid="$(id -g hl-codex-agent)" --init-groups sh -lc "id; cd '$work' && pwd && git status --short" || true
          echo '--- latest Codex attempt log ---'
          latest=$(ls -1t /var/lib/hyperliquid-ai-team/agents/codex/logs/f799b5cc7d574139-attempt-*.jsonl 2>/dev/null | head -n1 || true)
          if [[ -n "$latest" ]]; then
            echo "LOG=$latest"
            tail -n 80 "$latest" | sed -E 's/(token|authorization|cookie|secret|password)[=:][^ ,]*/\1=[REDACTED]/Ig'
          fi
          echo '--- status checkpoint ---'
          hl-ai-team-status || true
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
