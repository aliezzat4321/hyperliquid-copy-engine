name: emergency-acceptance-runner-failforward

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-acceptance-runner-failforward.yml

permissions:
  contents: read

jobs:
  patch-runtime:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 10
    steps:
      - name: Patch deployed orchestrator fail-forward only
        shell: bash
        run: |
          set -euo pipefail
          target=/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          test -f "$target"
          sudo python3 - "$target" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '''                    else:\n                        retry_at = retry_at_after(max(60, int(self.cfg["poll_seconds"])))\n                        self.ledger.update(\n                            task["id"], status="RETRY", retry_at=retry_at,\n                            last_error="awaiting deterministic phase runner evidence",\n                        )\n                        self.runtime.event(\n                            "ACCEPTANCE_PHASE_READY", assignment_id=task["id"],\n                            issue=task["issue_number"], task_type=task["task_type"],\n                            status="RETRY", retry_after=retry_at,\n                        )\n'''
          new = '''                    else:\n                        # Emergency liveness fail-forward: never let a missing deterministic\n                        # phase-runner result monopolize the global scheduler forever.\n                        liveness_attempt = int(task["attempt"] or 0) + 1\n                        if liveness_attempt >= 3:\n                            self.ledger.update(\n                                task["id"], status="STALE", retry_at=None,\n                                attempt=liveness_attempt,\n                                last_error=(\n                                    "acceptance phase runner produced no durable evidence after "\n                                    f"{liveness_attempt} polls; escalated to P0 #238"\n                                ),\n                            )\n                            self.runtime.event(\n                                "ACCEPTANCE_RUNNER_LIVENESS_ESCALATED",\n                                assignment_id=task["id"], issue=task["issue_number"],\n                                task_type=task["task_type"], status="STALE",\n                                escalation_issue=238, liveness_attempt=liveness_attempt,\n                            )\n                        else:\n                            retry_at = retry_at_after(max(60, int(self.cfg["poll_seconds"])))\n                            self.ledger.update(\n                                task["id"], status="RETRY", retry_at=retry_at,\n                                attempt=liveness_attempt,\n                                last_error="awaiting deterministic phase runner evidence",\n                            )\n                            self.runtime.event(\n                                "ACCEPTANCE_PHASE_READY", assignment_id=task["id"],\n                                issue=task["issue_number"], task_type=task["task_type"],\n                                status="RETRY", retry_after=retry_at,\n                                liveness_attempt=liveness_attempt,\n                            )\n'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"refusing patch: expected exactly one target block, found {count}")
          p.write_text(s.replace(old, new, 1))
          PY
          sudo python3 -m py_compile "$target"
          echo AI_TEAM_ACCEPTANCE_FAILFORWARD_HOTFIX=APPLIED
      - name: Run orchestrator once and show status
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop hyperliquid-ai-team.service || true
          sudo systemctl start hyperliquid-ai-team.service || {
            sudo systemctl status hyperliquid-ai-team.service --no-pager || true
            sudo journalctl -u hyperliquid-ai-team.service -n 120 --no-pager || true
            exit 1
          }
          sudo /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py --status
