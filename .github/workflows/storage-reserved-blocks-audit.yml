name: storage-reserved-blocks-audit

on:
  push:
    branches:
      - codex/112-value-aware-storage-lifecycle
    paths:
      - '.github/workflows/storage-reserved-blocks-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux]
    steps:
      - name: Read-only filesystem reserve audit
        shell: bash
        run: |
          set -euo pipefail
          MOUNT=/mnt/HC_Volume_106576526
          DEVICE="$(findmnt -n -o SOURCE "$MOUNT")"
          echo "MOUNT=$MOUNT"
          echo "DEVICE=$DEVICE"
          echo '========== DF =========='
          df -hT "$MOUNT"
          df -P -B1 "$MOUNT"
          echo '========== STATVFS =========='
          python3 - <<'PY'
          import os
          p='/mnt/HC_Volume_106576526'
          s=os.statvfs(p)
          print('frsize', s.f_frsize)
          print('blocks', s.f_blocks)
          print('bfree', s.f_bfree)
          print('bavail', s.f_bavail)
          print('free_bytes_including_reserved', s.f_bfree*s.f_frsize)
          print('available_bytes_nonroot', s.f_bavail*s.f_frsize)
          print('reserved_or_privileged_bytes', (s.f_bfree-s.f_bavail)*s.f_frsize)
          PY
          echo '========== EXT4 METADATA =========='
          sudo -n tune2fs -l "$DEVICE" | grep -E 'Block count:|Reserved block count:|Block size:|Reserved blocks uid:|Reserved blocks gid:' || true
          echo 'FILESYSTEM_MUTATION=NO'
          echo 'POSTGRESQL_MUTATION=NO'
          echo 'POLYMARKET_MUTATION=NO'
