name: manager-bootstrap-protected-self-change

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.pull_request.head.ref == 'manager/151-protected-self-change' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux]
    timeout-minutes: 12
    steps:
      - name: Resolve target PR
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            row="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head manager/151-protected-self-change --json number,headRefOid --jq '.[0] // empty')"
            if [[ -z "$row" ]]; then
              echo 'found=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            number="$(jq -r '.number' <<<"$row")"
            sha="$(jq -r '.headRefOid' <<<"$row")"
          else
            number='${{ github.event.pull_request.number }}'
            sha='${{ github.event.pull_request.head.sha }}'
          fi
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.target.outputs.found == 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify narrow bootstrap and focused tests
        if: steps.target.outputs.found == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(id -u)" = 0
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              scripts/ai_team_orchestrator.py|tests/test_ai_team_orchestrator.py) ;;
              *) echo "unexpected bootstrap file: $f" >&2; exit 1 ;;
            esac
          done <<<"$changed"
          python3 -m py_compile scripts/ai_team_orchestrator.py
          if [[ -x /root/hyperliquid-copy-engine/.venv/bin/python ]]; then
            /root/hyperliquid-copy-engine/.venv/bin/python -m pytest -q tests/test_ai_team_orchestrator.py
          else
            python3 -m pytest -q tests/test_ai_team_orchestrator.py
          fi
          ! git diff origin/main...HEAD -- scripts/ai_team_orchestrator.py | grep -E '^\+.*(REAL_TRADING_ENABLED|LIVE_TRADING_ENABLED)\s*=\s*(YES|TRUE|1)'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'

      - name: Probe Claude availability and exact-SHA review
        if: steps.target.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          set -euo pipefail
          CLAUDE_HOME=/var/lib/hyperliquid-ai-team/agents/claude/home
          UID_C="$(id -u hl-claude-agent)"
          GID_C="$(id -g hl-claude-agent)"
          REVIEW_DIR="/var/lib/hyperliquid-ai-team/agents/claude/worktrees/protected-bootstrap-${GITHUB_RUN_ID}"
          rm -rf "$REVIEW_DIR"
          mkdir -p "$REVIEW_DIR"
          cp -a "$GITHUB_WORKSPACE/." "$REVIEW_DIR/"
          chown -R hl-claude-agent:hl-claude-agent "$REVIEW_DIR"

          run_claude() {
            duration="$1"
            shift
            timeout --foreground "$duration" \
              setpriv --reuid="$UID_C" --regid="$GID_C" --init-groups \
              env -i HOME="$CLAUDE_HOME" CLAUDE_CONFIG_DIR="$CLAUDE_HOME/.claude" \
              XDG_CONFIG_HOME="$CLAUDE_HOME/.config" XDG_CACHE_HOME="$CLAUDE_HOME/.cache" \
              PATH=/usr/local/bin:/usr/bin:/bin \
              /usr/bin/claude "$@"
          }

          set +e
          ready="$(cd "$REVIEW_DIR" && run_claude 45s -p 'Reply exactly: CLAUDE_READY_OK' --model sonnet --output-format text --permission-mode dontAsk 2>/tmp/claude-bootstrap-ready.err)"
          rc=$?
          set -e
          if [[ $rc -ne 0 || "$ready" != *CLAUDE_READY_OK* ]]; then
            echo 'CLAUDE_BOOTSTRAP_REVIEW=WAITING_RATE_LIMIT_OR_UNAVAILABLE'
            tail -c 600 /tmp/claude-bootstrap-ready.err 2>/dev/null || true
            rm -rf "$REVIEW_DIR" /tmp/claude-bootstrap-ready.err
            exit 0
          fi

          cat >/tmp/claude-bootstrap-review.txt <<EOF
          You are the independent exact-SHA reviewer for a Hyperliquid AI-team control-plane bootstrap.
          Review EXACT commit SHA: $TARGET_SHA on PR #$PR_NUMBER.
          Read AGENTS.md and relevant docs/ai-team governance. Review only origin/main...HEAD plus necessary callers.
          Do not modify files.

          The goal is narrow: allow Codex to PROPOSE changes only to a tiny fixed AI control-plane allowlist, while retaining exact-SHA Claude review + CI + explicit trusted Issue authorization before automatic merge. Trading, live gate, deployment workflows, credentials, capital/risk and execution paths must remain excluded.

          Reject if the change can auto-apply arbitrary protected paths, weaken real-trading safeguards, bypass independent review/CI, or permit issue authorization from untrusted authors.

          End EXACTLY with:
          REVIEWED_SHA=$TARGET_SHA
          VERDICT=PASS
          BLOCKERS_JSON=[]
          or VERDICT=FAIL with a concrete JSON blocker list.
          EOF

          set +e
          review_json="$(cd "$REVIEW_DIR" && run_claude 7m -p "$(cat /tmp/claude-bootstrap-review.txt)" --model sonnet --output-format json --permission-mode dontAsk 2>/tmp/claude-bootstrap-review.err)"
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            if [[ $rc -eq 124 ]]; then
              echo 'CLAUDE_BOOTSTRAP_REVIEW=TIMED_OUT_WILL_RETRY'
              rm -rf "$REVIEW_DIR" /tmp/claude-bootstrap-review.txt /tmp/claude-bootstrap-review.err
              exit 0
            fi
            echo "Claude exact-SHA review command failed rc=$rc" >&2
            tail -c 1000 /tmp/claude-bootstrap-review.err >&2 || true
            exit $rc
          fi
          printf '%s' "$review_json" >/tmp/claude-bootstrap-review.json
          python3 - "$TARGET_SHA" /tmp/claude-bootstrap-review.json >/tmp/claude-bootstrap-result.txt <<'PY'
          import json, re, sys
          sha = sys.argv[1]
          row = json.load(open(sys.argv[2], encoding='utf-8'))
          result = str(row.get('result') or '')
          print(result)
          sm = re.search(r'(?mi)^\s*REVIEWED_SHA\s*=\s*([0-9a-f]{40})\s*$', result)
          vm = re.search(r'(?mi)^\s*VERDICT\s*=\s*(PASS|FAIL)\s*$', result)
          if not sm or sm.group(1) != sha:
              raise SystemExit('stale/missing reviewed SHA')
          if not vm or vm.group(1) != 'PASS':
              raise SystemExit('Claude exact-SHA review did not PASS')
          PY
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/claude-bootstrap-result.txt
          echo 'CLAUDE_EXACT_SHA_REVIEW=PASS'
          rm -rf "$REVIEW_DIR" /tmp/claude-bootstrap-ready.err /tmp/claude-bootstrap-review.txt /tmp/claude-bootstrap-review.err /tmp/claude-bootstrap-review.json /tmp/claude-bootstrap-result.txt
