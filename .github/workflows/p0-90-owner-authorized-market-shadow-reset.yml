name: p0-90-owner-authorized-market-shadow-reset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-90-owner-authorized-market-shadow-reset.yml

permissions:
  contents: read

concurrency:
  group: p0-90-owner-authorized-market-shadow-reset
  cancel-in-progress: false

jobs:
  reset-market-shadow:
    if: >-
      github.repository == 'aliezzat4321/hyperliquid-copy-engine' &&
      contains(github.event.head_commit.message, '[OWNER_STORAGE_RESET]')
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 30
    env:
      DATA_MOUNT: /mnt/HC_Volume_106576526
      MARKET_ROOT: /mnt/HC_Volume_106576526/hyperliquid/market-shadow
    steps:
      - name: Owner-authorized safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$MARKET_ROOT" = '/mnt/HC_Volume_106576526/hyperliquid/market-shadow'
          test -d "$DATA_MOUNT"
          test -d "$MARKET_ROOT"
          test ! -L "$MARKET_ROOT"
          echo 'OWNER_AUTHORIZED_MARKET_SHADOW_RESET=YES'
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'DELETE_SCOPE=MARKET_SHADOW_CONTENTS_ONLY'
          echo 'POSTGRESQL_FILESYSTEM_DELETION=NO'
          echo 'PROFITABILITY_OUTPUT_DELETION=NO'
          echo 'SHADOW_LEDGER_DELETION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_ENABLED=NO'
          echo '========== BEFORE =========='
          df -hT "$DATA_MOUNT"
          du -sh "$MARKET_ROOT" || true

      - name: Quiesce market capture
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop hyperliquid-market-capture.timer 2>/dev/null || true
          sudo systemctl stop hyperliquid-market-capture.service 2>/dev/null || true
          if systemctl is-active --quiet hyperliquid-market-capture.service; then
            echo 'market capture service still active' >&2
            exit 1
          fi
          echo 'MARKET_CAPTURE_QUIESCED=YES'

      - name: Delete disposable historical market-shadow data
        shell: bash
        run: |
          set -euo pipefail
          test "$MARKET_ROOT" = '/mnt/HC_Volume_106576526/hyperliquid/market-shadow'
          test -d "$MARKET_ROOT"
          test ! -L "$MARKET_ROOT"
          BEFORE_BYTES="$(du -sb "$MARKET_ROOT" | awk '{print $1}')"
          export MARKET_ROOT BEFORE_BYTES
          sudo --preserve-env=MARKET_ROOT,BEFORE_BYTES python3 - <<'PY'
          import os, shutil
          from pathlib import Path

          root = Path(os.environ['MARKET_ROOT'])
          expected = Path('/mnt/HC_Volume_106576526/hyperliquid/market-shadow')
          if root != expected or not root.is_dir() or root.is_symlink():
              raise SystemExit('refusing unexpected market root')

          deleted = 0
          entries = 0
          for entry in root.iterdir():
              entries += 1
              try:
                  if entry.is_symlink() or entry.is_file():
                      entry.unlink()
                  elif entry.is_dir():
                      shutil.rmtree(entry)
                  else:
                      entry.unlink(missing_ok=True)
                  deleted += 1
              except FileNotFoundError:
                  pass
          print(f'MARKET_SHADOW_TOP_LEVEL_ENTRIES_SEEN={entries}')
          print(f'MARKET_SHADOW_TOP_LEVEL_ENTRIES_DELETED={deleted}')
          PY
          sync
          AFTER_BYTES="$(du -sb "$MARKET_ROOT" | awk '{print $1}')"
          echo "MARKET_SHADOW_BYTES_BEFORE=$BEFORE_BYTES"
          echo "MARKET_SHADOW_BYTES_AFTER=$AFTER_BYTES"
          echo "MARKET_SHADOW_BYTES_RECLAIMED=$(( BEFORE_BYTES - AFTER_BYTES ))"
          test "$AFTER_BYTES" -lt 10485760

      - name: Verify storage headroom
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          echo '========== AFTER RESET =========='
          df -hT "$DATA_MOUNT"
          USED_PCT="$(df -P "$DATA_MOUNT" | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
          echo "DATA_VOLUME_USED_PCT=$USED_PCT"
          if [ "$USED_PCT" -ge 80 ]; then
            echo "Storage reset reclaimed market-shadow but volume remains ${USED_PCT}% used; refusing capture restart." >&2
            exit 1
          fi
          touch "$MARKET_ROOT/.owner-storage-reset-write-probe"
          rm -f "$MARKET_ROOT/.owner-storage-reset-write-probe"
          echo 'STORAGE_HEADROOM_GATE=PASS'

      - name: Restart prospective market capture
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start hyperliquid-market-capture.timer 2>/dev/null || true
          sudo systemctl start hyperliquid-market-capture.service 2>/dev/null || true
          sleep 5
          echo 'MARKET_CAPTURE_TIMER_STATE='"$(systemctl is-active hyperliquid-market-capture.timer 2>/dev/null || true)"
          echo 'MARKET_CAPTURE_SERVICE_STATE='"$(systemctl is-active hyperliquid-market-capture.service 2>/dev/null || true)"
          echo 'REAL_TRADING_ENABLED=NO'
          echo 'POSTGRESQL_FILESYSTEM_DELETION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'OWNER_STORAGE_RESET_COMPLETE=YES'
