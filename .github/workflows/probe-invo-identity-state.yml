name: probe-invo-identity-state

on:
  push:
    branches:
      - agent/invo-identity-state-probe
    paths:
      - ".github/workflows/probe-invo-identity-state.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'aliezzat4321/hyperliquid-copy-engine'
    runs-on:
      - self-hosted
      - hyperliquid
    timeout-minutes: 5
    steps:
      - name: Print sanitized strongest Invo resolver reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/var/lib/hyperliquid-copy-engine/invo')
          focus = {'carmine', 'tyron', 'bartpeeters', 'rps'}

          def load(path):
              try:
                  value = json.loads(path.read_text())
              except Exception:
                  return {}
              return value if isinstance(value, dict) else {}

          state = load(root / 'identifier_state.json')
          items = state.get('items', {}) if isinstance(state, dict) else {}
          rows = []
          for pid, item in items.items() if isinstance(items, dict) else []:
              if not isinstance(item, dict):
                  continue
              name = str(item.get('username') or '').strip().casefold()
              if name not in focus:
                  continue
              result = item.get('result') if isinstance(item.get('result'), dict) else {}
              if int(result.get('discovery_matches') or 0) < 2:
                  continue
              report_path = Path(str(result.get('report_path') or ''))
              report = load(report_path) if str(report_path) else {}
              best = report.get('best_discovery_candidate')
              best = best if isinstance(best, dict) else {}
              verifications = []
              for v in report.get('historical_candidate_verifications', []):
                  if not isinstance(v, dict):
                      continue
                  verification = v.get('verification')
                  verification = verification if isinstance(verification, dict) else {}
                  reasons = {}
                  for ev in verification.get('evidence', []):
                      if not isinstance(ev, dict) or ev.get('matched'):
                          continue
                      reason = str(ev.get('rejection_reason') or 'unknown')
                      reasons[reason] = reasons.get(reason, 0) + 1
                  verifications.append({
                      'address': v.get('address'),
                      'discovery_matches': v.get('discovery_matches'),
                      'held_out_matched': verification.get('matched'),
                      'held_out_attempted': verification.get('attempted'),
                      'held_out_ratio': verification.get('ratio'),
                      'rejection_reasons': reasons,
                  })
              rows.append({
                  'username': name,
                  'portfolio_id': pid,
                  'evidence_count': item.get('evidence_count'),
                  'status': item.get('status'),
                  'candidate': item.get('candidate'),
                  'best_discovery_matches': best.get('matched_anchors'),
                  'best_clock_mad_ms': best.get('clock_offset_mad_ms'),
                  'best_median_clock_offset_ms': best.get('median_clock_offset_ms'),
                  'best_median_price_bps': best.get('median_price_bps'),
                  'shortlist_verifications': verifications,
              })
          rows.sort(key=lambda r: (r['username'], -int(r['evidence_count'] or 0)))
          print('STRONGEST_RESOLVER_REPORTS=' + json.dumps(rows, sort_keys=True))
          PY
