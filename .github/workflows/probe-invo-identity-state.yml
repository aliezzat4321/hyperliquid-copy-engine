name: probe-invo-identity-state

on:
  push:
    branches:
      - agent/invo-identity-state-probe
    paths:
      - ".github/workflows/probe-invo-identity-state.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'aliezzat4321/hyperliquid-copy-engine'
    runs-on:
      - self-hosted
      - hyperliquid
    timeout-minutes: 5
    steps:
      - name: Print sanitized Invo resolver diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/var/lib/hyperliquid-copy-engine/invo')
          targets = {
              'carmine', 'bones', 'tyron', 'prateek', 'booobsas',
              'rps', 'bartpeeters', 'vodkastrash',
          }

          def load(path):
              try:
                  value = json.loads(path.read_text())
              except Exception:
                  return {}
              return value if isinstance(value, dict) else {}

          publication = load(root / 'identified_wallets.json')
          queue_payload = load(root / 'resolution_queue/resolution_queue.json')
          identifier_state = load(root / 'identifier_state.json')
          identities = publication.get('identities', [])
          state_items = identifier_state.get('items', {})
          queue = queue_payload.get('queue', [])
          verified = {
              str(row.get('portfolio_id') or ''): row
              for row in identities
              if isinstance(row, dict)
          }

          rows = []
          for q in queue:
              if not isinstance(q, dict):
                  continue
              name = str(q.get('username') or '').strip().casefold()
              if name not in targets:
                  continue
              pid = str(q.get('portfolio_id') or '')
              state = state_items.get(pid) if isinstance(state_items, dict) else None
              state = state if isinstance(state, dict) else {}
              result = state.get('result') if isinstance(state.get('result'), dict) else {}
              identity = verified.get(pid)
              rows.append({
                  'username': name,
                  'portfolio_id': pid,
                  'portfolio_name': q.get('portfolio_name'),
                  'evidence_count': q.get('evidence_count'),
                  'distinct_coin_count': q.get('distinct_coin_count'),
                  'verified': bool(identity),
                  'wallet': identity.get('wallet') if identity else None,
                  'identifier_status': state.get('status') or 'NOT_ATTEMPTED',
                  'candidate': state.get('candidate'),
                  'confidence': state.get('confidence'),
                  'discovery_matches': result.get('discovery_matches'),
                  'discovery_anchors': result.get('discovery_anchors'),
                  'historical_matches': result.get('historical_matches'),
                  'historical_attempted': result.get('historical_attempted'),
                  'median_clock_offset_ms': result.get('median_clock_offset_ms'),
                  'median_price_bps': result.get('median_price_bps'),
                  'next_retry_at': state.get('next_retry_at'),
                  'attempted_at': state.get('attempted_at'),
              })
          rows.sort(key=lambda r: (r['username'], -int(r['evidence_count'] or 0), r['portfolio_id']))
          print('INVO_RESOLVER_DIAGNOSTICS=' + json.dumps(rows, sort_keys=True))
          print('TOTAL_DURABLE_IDENTITIES=' + str(publication.get('verified_count', 0)))
          print('ATTESTATION_REPORTS_SEEN=' + str(publication.get('attestation_reports_seen', 0)))
          PY
