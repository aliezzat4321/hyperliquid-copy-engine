name: inspect-verified-identities-disk

on:
  push:
    branches:
      - agent/inspect-verified-identities-disk-v1
    paths:
      - .github/workflows/inspect-verified-identities-disk.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Print sanitized identity and disk status
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DISK_BYTES ==='
          df -h / /mnt/HC_Volume_106576526 || true
          echo '=== DISK_INODES ==='
          df -i / /mnt/HC_Volume_106576526 || true
          echo '=== LARGEST_VOLUME_DIRS ==='
          du -x -h --max-depth=2 /mnt/HC_Volume_106576526/hyperliquid 2>/dev/null | sort -h | tail -n 20 || true
          echo '=== SANITIZED_IDENTITIES ==='
          cd /root/hyperliquid-copy-engine
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          identities_path = Path('/var/lib/hyperliquid-copy-engine/invo/identified_wallets.json')
          queue_path = Path('/var/lib/hyperliquid-copy-engine/invo/resolution_queue/resolution_queue.json')

          try:
              identities = json.loads(identities_path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(json.dumps({'identities_error': f'{type(exc).__name__}: {exc}'}))
              identities = {}

          rows = []
          for row in identities.get('identities', []):
              if not isinstance(row, dict):
                  continue
              rows.append({
                  'username': row.get('username'),
                  'portfolio_id': row.get('portfolio_id'),
                  'wallet': row.get('wallet'),
                  'rule': row.get('rule'),
                  'verified': bool(row.get('wallet')),
              })
          print(json.dumps({'identity_count': len(rows), 'identities': rows}, indent=2, sort_keys=True))

          try:
              queue = json.loads(queue_path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(json.dumps({'queue_error': f'{type(exc).__name__}: {exc}'}))
              raise SystemExit

          targets = []
          for row in queue.get('queue', []):
              if not isinstance(row, dict):
                  continue
              username = str(row.get('username') or '').strip().casefold()
              if username in {'carmine', 'bones'}:
                  targets.append({
                      'username': row.get('username'),
                      'portfolio_id': row.get('portfolio_id'),
                      'evidence_count': row.get('evidence_count'),
                      'distinct_coin_count': row.get('distinct_coin_count'),
                      'status': row.get('status'),
                  })
          print(json.dumps({'target_queue': targets}, indent=2, sort_keys=True))
          PY
