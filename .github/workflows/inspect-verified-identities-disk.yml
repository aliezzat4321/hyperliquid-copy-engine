name: inspect-verified-identities-disk

on:
  push:
    branches:
      - agent/inspect-verified-identities-disk-v1
    paths:
      - .github/workflows/inspect-verified-identities-disk.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify whether old PostgreSQL tree is unused
        shell: bash
        run: |
          set -euo pipefail
          OLD=/mnt/HC_Volume_106576526/hyperliquid/postgresql
          echo '=== CURRENT_POSTGRES_MOUNT ==='
          df -h /var/lib/postgresql/14/main "$OLD" || true
          findmnt /var/lib/postgresql/14/main || true
          findmnt "$OLD" || true
          echo '=== POSTGRES_DATA_DIRECTORY ==='
          sudo -u postgres psql -Atqc 'show data_directory;' || true
          sudo -u postgres psql -Atqc 'select version();' || true
          echo '=== OLD_TREE_METADATA ==='
          ls -ld "$OLD" "$OLD/14" "$OLD/14/main" 2>/dev/null || true
          du -sh "$OLD" 2>/dev/null || true
          echo '=== OLD_TREE_RECENT_FILES ==='
          find "$OLD" -xdev -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -n 20 || true
          echo '=== OPEN_REFERENCES ==='
          fuser -vm "$OLD" 2>&1 || true
          echo '=== CONFIG_REFERENCES ==='
          grep -R -n -F '/mnt/HC_Volume_106576526/hyperliquid/postgresql' \
            /etc/systemd/system /etc/postgresql /root/hyperliquid-copy-engine \
            2>/dev/null | head -n 100 || true
          echo '=== LIVE_CLUSTER_RECENT_FILES ==='
          find /var/lib/postgresql/14/main -xdev -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -n 10 || true
