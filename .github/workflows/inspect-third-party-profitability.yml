name: inspect-third-party-profitability

on:
  push:
    branches:
      - agent/inspect-third-party-profitability-v1
    paths:
      - .github/workflows/inspect-third-party-profitability.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      - self-hosted
      - hyperliquid
    timeout-minutes: 10
    steps:
      - name: Inspect Bones historical backfill overlap
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          .venv/bin/python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from datetime import UTC, datetime
          from pathlib import Path

          from hlcopy.signals.invo import load_invo_closed_trades

          queue_path = Path('/var/lib/hyperliquid-copy-engine/invo/resolution_queue/resolution_queue.json')
          market_dir = Path('/mnt/HC_Volume_106576526/hyperliquid/market-shadow')
          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          bones = next(
              row for row in queue.get('queue', [])
              if str(row.get('username') or '').strip().casefold() == 'bones'
          )
          evidence = Path(str(bones['resolver_csv']))
          imported = load_invo_closed_trades(evidence)
          signals = imported.signals

          signal_by_coin = Counter(signal.coin for signal in signals)
          signal_by_date = Counter(
              datetime.fromtimestamp(signal.closed_at_ms / 1000, UTC).date().isoformat()
              for signal in signals
          )
          signal_coin_dates = defaultdict(set)
          for signal in signals:
              date = datetime.fromtimestamp(signal.closed_at_ms / 1000, UTC).date().isoformat()
              signal_coin_dates[signal.coin].add(date)

          market_partitions = defaultdict(set)
          for date_dir in market_dir.glob('date=*'):
              date = date_dir.name.removeprefix('date=')
              for coin_dir in date_dir.glob('coin=*'):
                  if next((coin_dir / 'channel=l2Book').glob('*.parquet'), None) is None:
                      continue
                  market_partitions[coin_dir.name.removeprefix('coin=')].add(date)

          overlap = {}
          for coin, count in sorted(signal_by_coin.items()):
              signal_dates = signal_coin_dates[coin]
              tape_dates = market_partitions.get(coin, set())
              overlap[coin] = {
                  'signal_count': count,
                  'signal_dates': sorted(signal_dates),
                  'market_dates': sorted(tape_dates),
                  'overlap_dates': sorted(signal_dates & tape_dates),
              }

          print('BONES_BACKFILL_OVERLAP=' + json.dumps({
              'evidence_rows': len(signals),
              'coins': dict(sorted(signal_by_coin.items())),
              'signal_dates': dict(sorted(signal_by_date.items())),
              'overlap': overlap,
          }, sort_keys=True))
          PY
