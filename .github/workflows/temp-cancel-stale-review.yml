name: temp-cancel-stale-review

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.event.head_commit.message == 'Cancel stale self-hosted review run'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel exact obsolete run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/33571121497/cancel || true
          echo 'STALE_RUN_CANCEL_REQUESTED=33571121497'
