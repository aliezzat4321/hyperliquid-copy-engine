name: p0-359-apply-dust-repair

on:
  push:
    branches: [codex/359-lane3-dust-rounding-fix]
    paths:
      - .github/workflows/p0-359-apply-dust-repair.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/359-lane3-dust-rounding-fix
          fetch-depth: 0
      - name: Tighten dust evidence and policy provenance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/invo-notification-executor/src/service.ts')
          s = p.read_text()

          old = "const HEALTH_MTM_CONCURRENCY = 4;\n"
          new = """const HEALTH_MTM_CONCURRENCY = 4;
const BOOK_AGE_POLICY_CHANGEOVER = {
  priorMaxBookAgeMs: 750,
  currentMaxBookAgeMs: 1000,
  deployRun: 34992024173,
  effectiveAtUtc: '2026-09-15T15:59:18Z',
  commit: '90ee58d679a093c86543e09a6afc6e3238bc3a74',
};
"""
          assert old in s and 'BOOK_AGE_POLICY_CHANGEOVER' not in s
          s = s.replace(old, new, 1)

          old = """        if (!result.ok) {
          const dustRejected = result.reason === 'below_min_notional' || result.reason === 'lot_rounded_to_zero';
          if (dustRejected) {
"""
          new = """        if (!result.ok) {
          const dustRejected = result.reason === 'below_min_notional' || result.reason === 'lot_rounded_to_zero';
          if (dustRejected) {
            const dustBestBid = assetBook.book?.bids[0]?.px;
            const dustBestAsk = assetBook.book?.asks[0]?.px;
            const dustMidPx = dustBestBid && dustBestAsk ? (dustBestBid + dustBestAsk) / 2 : null;
"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """              dustReconciledSize: size, unresolvedSize: 0, decisionAtMs,
              bookRequestedAtMs: assetBook.requestedAtMs, bookReceivedAtMs: assetBook.receivedAtMs,
"""
          new = """              dustReconciledSize: size,
              dustEstimatedNotionalUsd: dustMidPx == null ? null : size * dustMidPx,
              unresolvedSize: 0,
              grossPnlUsd: null, grossReturnBps: null,
              entryFeeUsd: null, exitFeeUsd: null, fundingUsd: null,
              totalExplicitCostUsd: null, netPnlUsd: null, netReturnBps: null,
              decisionAtMs,
              bookRequestedAtMs: assetBook.requestedAtMs, bookReceivedAtMs: assetBook.receivedAtMs,
"""
          assert old in s
          s = s.replace(old, new, 1)

          old = "        shadowExecutionPolicy: shadowPolicy,\n        executionEvidenceVersion: EXECUTION_EVIDENCE_VERSION,\n"
          new = "        shadowExecutionPolicy: shadowPolicy,\n        bookAgePolicyChangeover: BOOK_AGE_POLICY_CHANGEOVER,\n        executionEvidenceVersion: EXECUTION_EVIDENCE_VERSION,\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    shadowExecutionPolicy: shadowPolicy,\n    fundingOracleMaxDelayMs: cfg.shadowFundingOracleMaxDelayMs,\n"
          new = "    shadowExecutionPolicy: shadowPolicy,\n    bookAgePolicyChangeover: BOOK_AGE_POLICY_CHANGEOVER,\n    fundingOracleMaxDelayMs: cfg.shadowFundingOracleMaxDelayMs,\n"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('services/invo-notification-executor/test/service-partial-close-accounting.test.ts')
          s = p.read_text()
          marker = "  assert.match(closeBranch, /shadow_close_dust_reconciled/);\n"
          addition = marker + "  assert.match(closeBranch, /dustEstimatedNotionalUsd/);\n  assert.match(closeBranch, /netPnlUsd: null/);\n"
          assert marker in s and 'assert.match(closeBranch, /dustEstimatedNotionalUsd/)' not in s
          s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
      - name: Run Lane 3 executor tests
        working-directory: services/invo-notification-executor
        run: |
          npm ci
          npm test
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/invo-notification-executor/src/service.ts services/invo-notification-executor/test/service-partial-close-accounting.test.ts
          git diff --cached --check
          git commit -m 'fix(lane3): make dust evidence explicitly incomplete (#361)'
          git push origin HEAD:codex/359-lane3-dust-rounding-fix
