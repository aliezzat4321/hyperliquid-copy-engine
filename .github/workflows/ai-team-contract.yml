name: ai-team-contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - docs/ai-team/**
      - scripts/render_ai_team_state.py
      - scripts/validate_ai_team_contract.py
      - .github/pull_request_template.md
      - .github/workflows/ai-team-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared AI-team contract and generated state
        run: python scripts/validate_ai_team_contract.py
