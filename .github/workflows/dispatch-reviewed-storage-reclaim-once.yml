name: dispatch-reviewed-storage-reclaim-once

on:
  push:
    branches:
      - codex/109-dispatch-reviewed-reclaim
    paths:
      - '.github/workflows/dispatch-reviewed-storage-reclaim-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the already reviewed recovery workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/hyperliquid-emergency-storage-reclaim.yml/dispatches'
          payload = {
              'ref': 'main',
              'inputs': {
                  'reviewed_code_sha': 'fc6e93fb498afea6f23739edd4ef9e698b3f220c',
                  'reviewed_manifest_sha256': '951c4c80057383415cb118f3bdbd0044bab45525668f73a0da3596d76702fbba',
                  'confirm_apply': 'APPLY_HYPERLIQUID_MARKET_SHADOW_RECLAIM',
              },
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 204:
                  raise SystemExit(f'unexpected GitHub status {response.status}')
          print('DISPATCHED_REVIEWED_STORAGE_RECLAIM=YES')
          print('REVIEWED_CODE_SHA=fc6e93fb498afea6f23739edd4ef9e698b3f220c')
          print('REVIEWED_MANIFEST_SHA256=951c4c80057383415cb118f3bdbd0044bab45525668f73a0da3596d76702fbba')
          PY
