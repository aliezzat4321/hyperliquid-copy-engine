name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  verify_runtime_handoff:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Read runtime and exact task states
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'REAL_TRADING_CHANGE=NO'
          echo 'POLYMARKET_INSPECTION=NO'
          hl-ai-team-status
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('/var/lib/hyperliquid-ai-team/orchestrator/ledger.sqlite3', timeout=30)
          db.row_factory = sqlite3.Row
          for row in db.execute("SELECT id,issue_number,pr_number,task_type,agent,model_class,status,target_sha,attempt,retry_at,last_error,updated_at FROM tasks WHERE issue_number IN (120,184) ORDER BY updated_at DESC LIMIT 12"):
              print(dict(row))
          db.close()
          PY
          systemctl show hyperliquid-ai-team-orchestrator.service -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
