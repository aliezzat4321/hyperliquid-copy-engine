name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  diagnose_orchestrator_startup:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Read deployed runtime failure only
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'REAL_TRADING_CHANGE=NO'
          echo 'POLYMARKET_INSPECTION=NO'
          systemctl status hyperliquid-ai-team-orchestrator.service --no-pager -l || true
          echo '--- JOURNAL ---'
          journalctl -u hyperliquid-ai-team-orchestrator.service -n 120 --no-pager || true
          echo '--- INSTALLED POLICY ---'
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('/etc/hyperliquid-ai-team/router.json'), Path('/var/lib/hyperliquid-ai-team/config/ai_team_router.json')]:
              if p.exists():
                  try:
                      d=json.loads(p.read_text())
                      print(p, d.get('auto_merge_task_classes'))
                  except Exception as e:
                      print(p, 'ERR', repr(e))
          PY
          hl-ai-team-status || true
