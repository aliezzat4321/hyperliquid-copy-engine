name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  prioritize_opus_review_181:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Replace stale review checkpoint with current exact SHA
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import datetime as dt
          import sqlite3
          import uuid

          db_path = '/var/lib/hyperliquid-ai-team/orchestrator/ledger.sqlite3'
          target = 'ed9c70bcd325a100abf2f0c42ff9d95ddf71d867'
          db = sqlite3.connect(db_path)
          db.row_factory = sqlite3.Row
          db.execute(
              "UPDATE tasks SET status='STALE', retry_at=NULL, last_error='PR moved before review dispatch', updated_at=? "
              "WHERE issue_number=181 AND pr_number=183 AND task_type='REVIEW' AND target_sha<>? "
              "AND status IN ('PENDING','RETRY','WAITING_RATE_LIMIT','WAITING_CI')",
              (dt.datetime.now(dt.timezone.utc).isoformat(), target),
          )
          existing = db.execute(
              "SELECT id,status FROM tasks WHERE issue_number=181 AND pr_number=183 AND task_type='REVIEW' "
              "AND model_class='OPUS' AND target_sha=? ORDER BY created_at DESC LIMIT 1",
              (target,),
          ).fetchone()
          if existing:
              db.execute(
                  "UPDATE tasks SET status='PENDING', retry_at=NULL, last_error=NULL, created_at=?, updated_at=? WHERE id=?",
                  ('2026-09-03T07:50:00+00:00', dt.datetime.now(dt.timezone.utc).isoformat(), existing['id']),
              )
              print(f"REVIEW_CHECKPOINT=REUSED id={existing['id']}")
          else:
              now = dt.datetime.now(dt.timezone.utc).isoformat()
              task_id = uuid.uuid4().hex[:16]
              db.execute(
                  """INSERT INTO tasks
                  (id,issue_number,pr_number,task_type,agent,model_class,task_class,status,branch,target_sha,previous_sha,blockers_json,workdir,session_id,attempt,retry_at,limit_text,systemd_unit,last_error,parent_id,created_at,updated_at)
                  VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                  (
                      task_id,181,183,'REVIEW','CLAUDE','OPUS','MAJOR_ARCHITECTURE','PENDING',
                      'manager/181-auto-merge-on-pass',target,None,'[]',None,None,0,None,None,None,None,None,
                      '2026-09-03T07:50:00+00:00',now,
                  ),
              )
              print(f"REVIEW_CHECKPOINT=CREATED id={task_id}")
          db.commit()
          db.close()
          PY
          systemctl start hyperliquid-ai-team-orchestrator.service || true
          sleep 2
          hl-ai-team-status
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
