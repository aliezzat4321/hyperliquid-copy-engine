name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  seed_opus_review_181:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Seed exact-SHA Opus review for PR 183
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import datetime as dt
          import json
          import sqlite3
          import uuid

          db_path = '/var/lib/hyperliquid-ai-team/orchestrator/ledger.sqlite3'
          target = 'd8d5f5c147bc8df3663085497e65141d5f99f1b0'
          db = sqlite3.connect(db_path)
          db.row_factory = sqlite3.Row
          existing = db.execute(
              "SELECT id,status FROM tasks WHERE issue_number=? AND pr_number=? AND task_type='REVIEW' AND model_class='OPUS' AND target_sha=? ORDER BY created_at DESC LIMIT 1",
              (181, 183, target),
          ).fetchone()
          if existing:
              print(f"REVIEW_CHECKPOINT=EXISTS id={existing['id']} status={existing['status']}")
          else:
              now = dt.datetime.now(dt.timezone.utc).isoformat()
              task_id = uuid.uuid4().hex[:16]
              db.execute(
                  """INSERT INTO tasks
                  (id,issue_number,pr_number,task_type,agent,model_class,task_class,status,branch,target_sha,previous_sha,blockers_json,workdir,session_id,attempt,retry_at,limit_text,systemd_unit,last_error,parent_id,created_at,updated_at)
                  VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                  (
                      task_id,181,183,'REVIEW','CLAUDE','OPUS','MAJOR_ARCHITECTURE','PENDING',
                      'manager/181-auto-merge-on-pass',target,None,'[]',None,None,0,None,None,None,None,None,now,now,
                  ),
              )
              db.commit()
              print(f"REVIEW_CHECKPOINT=CREATED id={task_id} target={target}")
          db.close()
          PY
          systemctl start hyperliquid-ai-team-orchestrator.service || true
          sleep 2
          hl-ai-team-status
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
