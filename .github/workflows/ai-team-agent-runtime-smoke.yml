name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  fix_and_review_auto_merge_policy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manager/181-auto-merge-on-pass
          persist-credentials: false
          fetch-depth: 0
      - name: Apply Opus blocker and seed exact-SHA re-review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          doc = Path('docs/ai-team/AUTONOMOUS_TEAM.md')
          s = doc.read_text()
          old = ("Agents cannot choose Opus. The orchestrator validates the task class and escalation reason. Routine work with an Opus escalation request is rejected. Non-routine/Opus task classes are never automatically merged even after review and CI.\n\n" "Automatic merge requires an explicit `TASK_CLASS=ROUTINE` (or `AI_TASK_CLASS=ROUTINE`) field. A missing or invalid task class is recorded as `UNCLASSIFIED` and cannot be automatically merged. Changes to GitHub workflows, systemd deployment files, or the orchestrator's own scripts also always require a non-automatic merge.\n")
          new = ("Agents cannot choose Opus. The orchestrator validates the task class and escalation reason. Routine work with an Opus escalation request is rejected. Review-model routing is independent of merge eligibility: every recognized task class becomes merge-eligible only after an independent exact-SHA review PASS and green CI.\n\n" "Automatic merge requires an explicit recognized task class (`TASK_CLASS` or `AI_TASK_CLASS`). A missing or invalid task class is recorded as `UNCLASSIFIED` and cannot be automatically merged. Protected AI-control-plane files additionally require a trusted Issue author, `AI_TEAM_PROTECTED_CHANGE=YES`, and membership in the narrow `AUTO_APPLY_CONTROL_PLANE_PATHS` allowlist before the same exact-SHA PASS + green-CI merge step. GitHub workflow, systemd deployment, trading/live, capital, credential, and other paths outside that allowlist remain non-automatically mergeable.\n")
          if old not in s:
              raise SystemExit('AUTONOMOUS_TEAM old merge policy text not found')
          doc.write_text(s.replace(old, new, 1))

          p = Path('scripts/ai_team_orchestrator.py')
          s = p.read_text()
          old = ("    UNCLASSIFIED uses the routine Sonnet review route but is deliberately absent\n" "    from auto_merge_task_classes, so only an explicitly declared ROUTINE task can\n" "    reach automatic merge.\n")
          new = ("    UNCLASSIFIED uses the routine Sonnet review route but is deliberately absent\n" "    from auto_merge_task_classes. Every explicitly declared recognized task class can\n" "    reach automatic merge only after the independent exact-SHA review and CI gates.\n")
          if old not in s:
              raise SystemExit('parse_task_class docstring old merge policy not found')
          p.write_text(s.replace(old, new, 1))

          d = Path('docs/ai-team/DECISIONS.md')
          s = d.read_text()
          heading = '## 2026-09-03 — Exact-SHA reviewer PASS + green CI is the merge decision for recognized task classes'
          decision = ("\n\n" + heading + "\n\n" "This supersedes the earlier task-class policy that withheld automatic merge from non-routine / Opus-class work after successful review.\n\n" "- Builder and reviewer responsibilities remain separate: Codex implements; the routed independent Claude reviewer evaluates the immutable PR head SHA.\n" "- For every recognized task class (`ROUTINE`, `QUANT_PROFITABILITY`, `STATISTICAL_METHODOLOGY`, `MAJOR_ARCHITECTURE`, `UNRESOLVED_DISAGREEMENT`, and `CAPITAL_SENSITIVE_METHODOLOGY`), an independent exact-SHA `PASS` plus green required CI is the merge decision. The credential-holding manager executes that decision immediately; it is not a second approval stage and no timer, human click, or separate finalizer is required.\n" "- `UNCLASSIFIED` or invalid task classes remain ineligible for automatic merge.\n" "- Protected AI-control-plane changes still require trusted Issue authorization, `AI_TEAM_PROTECTED_CHANGE=YES`, and the narrow `AUTO_APPLY_CONTROL_PLANE_PATHS` allowlist before merge. Workflow, systemd deployment, trading/live, capital, credential, and other paths outside that allowlist remain fail-closed.\n" "- PR-head movement invalidates the old review; merge/API rejection retries only the merge stage against the exact reviewed SHA.\n" "- This changes no live-trading permission. `REAL_TRADING_ENABLED` remains disabled.\n")
          if heading not in s:
              d.write_text(s + decision)
          PY

          python3 -m py_compile scripts/ai_team_orchestrator.py
          python3 -m json.tool config/ai_team_router.json >/dev/null
          grep -q 'every recognized task class becomes merge-eligible' docs/ai-team/AUTONOMOUS_TEAM.md
          grep -q 'Exact-SHA reviewer PASS + green CI is the merge decision' docs/ai-team/DECISIONS.md
          git config user.name 'Hyperliquid AI Manager'
          git config user.email 'manager@localhost'
          git add scripts/ai_team_orchestrator.py docs/ai-team/AUTONOMOUS_TEAM.md docs/ai-team/DECISIONS.md
          git commit -m 'docs(ai-team): align durable merge policy with PASS plus CI'
          target="$(git rev-parse HEAD)"
          git remote set-url origin git@github.com:aliezzat4321/hyperliquid-copy-engine.git
          git push origin HEAD:manager/181-auto-merge-on-pass
          echo "TARGET_SHA=$target"

          TARGET="$target" /usr/bin/python3 - <<'PY'
          import datetime as dt
          import os
          import sqlite3
          import uuid

          db = sqlite3.connect('/var/lib/hyperliquid-ai-team/orchestrator/ledger.sqlite3')
          db.row_factory = sqlite3.Row
          now = dt.datetime.now(dt.timezone.utc).isoformat()
          target = os.environ['TARGET']
          db.execute("UPDATE tasks SET status='STALE',retry_at=NULL,last_error='manager applied protected reviewer blocker',updated_at=? WHERE issue_number=181 AND pr_number=183 AND task_type='REPAIR' AND status IN ('PENDING','RETRY','WAITING_CI','WAITING_RATE_LIMIT')", (now,))
          db.execute("UPDATE tasks SET status='STALE',retry_at=NULL,last_error='PR moved after review',updated_at=? WHERE issue_number=181 AND pr_number=183 AND task_type='REVIEW' AND target_sha<>? AND status IN ('PENDING','RETRY','WAITING_CI','WAITING_RATE_LIMIT')", (now,target))
          existing = db.execute("SELECT id FROM tasks WHERE issue_number=181 AND pr_number=183 AND task_type='REVIEW' AND model_class='OPUS' AND target_sha=? ORDER BY created_at DESC LIMIT 1", (target,)).fetchone()
          if existing:
              task_id = existing['id']
              db.execute("UPDATE tasks SET status='PENDING',retry_at=NULL,last_error=NULL,updated_at=? WHERE id=?", (now,task_id))
          else:
              task_id = uuid.uuid4().hex[:16]
              db.execute("INSERT INTO tasks (id,issue_number,pr_number,task_type,agent,model_class,task_class,status,branch,target_sha,previous_sha,blockers_json,workdir,session_id,attempt,retry_at,limit_text,systemd_unit,last_error,parent_id,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)", (task_id,181,183,'REVIEW','CLAUDE','OPUS','MAJOR_ARCHITECTURE','PENDING','manager/181-auto-merge-on-pass',target,'ed9c70bcd325a100abf2f0c42ff9d95ddf71d867','[]',None,None,0,None,None,None,None,None,'2026-09-03T07:49:00+00:00',now))
          db.commit()
          print(f'REVIEW_CHECKPOINT={task_id} target={target}')
          db.close()
          PY
          systemctl start hyperliquid-ai-team-orchestrator.service || true
          sleep 2
          hl-ai-team-status
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
