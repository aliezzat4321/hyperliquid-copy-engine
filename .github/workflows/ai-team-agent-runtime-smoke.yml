name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  schedule_manager_finalizer:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Schedule exact-SHA finalizer for PR 180
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/manager_finalize_178.sh
          install -m 0700 scripts/manager_finalize_178.sh /var/lib/hyperliquid-ai-team/orchestrator/manager-finalize-178.sh
          systemctl stop hl-ai-manager-finalize-178.timer hl-ai-manager-finalize-178.service 2>/dev/null || true
          systemd-run --quiet --unit=hl-ai-manager-finalize-178 --on-calendar='2026-09-03 06:40:30 UTC' --timer-property=AccuracySec=30s /var/lib/hyperliquid-ai-team/orchestrator/manager-finalize-178.sh
          systemctl list-timers --all hl-ai-manager-finalize-178.timer --no-pager
          systemctl is-active hl-ai-manager-finalize-178.timer
          echo 'FINALIZER_SCHEDULED=YES'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
