name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  retarget_pr185_opus_review:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Retarget pending exact-SHA review
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'REAL_TRADING_CHANGE=NO'
          echo 'POLYMARKET_INSPECTION=NO'
          python3 - <<'PY'
          import datetime as dt
          import sqlite3
          db = sqlite3.connect('/var/lib/hyperliquid-ai-team/orchestrator/ledger.sqlite3', timeout=30)
          now = dt.datetime.now(dt.timezone.utc).isoformat()
          old = '97e918141cd56a5ec22a43a258c666676a576f37'
          new = '07666bf8ebf613fab5e1e3fb73b425d48363e42d'
          cur = db.execute("UPDATE tasks SET target_sha=?, previous_sha=?, retry_at=NULL, last_error=NULL, updated_at=? WHERE id=? AND issue_number=184 AND pr_number=185 AND task_type='REVIEW' AND status='PENDING' AND target_sha=?", (new, old, now, '75982ca3900b4054', old))
          db.commit()
          print(f'RETARGETED={cur.rowcount} TARGET_SHA={new}')
          db.close()
          PY
          systemctl start --no-block hyperliquid-ai-team-orchestrator.service || true
          hl-ai-team-status
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
