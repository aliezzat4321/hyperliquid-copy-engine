name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  bootstrap_research_checkout_hotfix:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Patch installed orchestrator and restart
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'REAL_TRADING_CHANGE=NO'
          echo 'POLYMARKET_INSPECTION=NO'
          python3 -c "from pathlib import Path; p=Path('/opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py'); s=p.read_text(); old='    *, user: str, home: Path, base_dir: Path, task_id: str, ref: str, branch: str | None\\n'; new='    *, user: str, home: Path, base_dir: Path, task_id: str, ref: str, branch: str | None = None\\n'; assert old in s or new in s, 'prepare_checkout signature not found'; p.write_text(s.replace(old,new,1) if old in s else s)"
          python3 -m py_compile /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          grep -F 'branch: str | None = None' /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          systemctl reset-failed hyperliquid-ai-team-orchestrator.service || true
          systemctl start --no-block hyperliquid-ai-team-orchestrator.service
          sleep 8
          systemctl show hyperliquid-ai-team-orchestrator.service -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          journalctl -u hyperliquid-ai-team-orchestrator.service -n 25 --no-pager
          hl-ai-team-status
          echo 'BOOTSTRAP_HOTFIX_INSTALLED=YES'
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
