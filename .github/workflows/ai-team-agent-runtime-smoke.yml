name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  enqueue_pr185_opus_review:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Enqueue exact-SHA review without interrupting active work
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'REAL_TRADING_CHANGE=NO'
          echo 'POLYMARKET_INSPECTION=NO'
          python3 -c "import base64; exec(base64.b64decode(''))"
          systemctl start --no-block hyperliquid-ai-team-orchestrator.service || true
          hl-ai-team-status
          echo 'PR185_OPUS_REVIEW_ENQUEUED=YES'
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
