name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  repair_research_checkout_contract:
    runs-on: [self-hosted, linux]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manager/184-research-checkout-fix
          persist-credentials: false
          fetch-depth: 0
      - name: Patch, test, push, and revive exact manager fix
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'REAL_TRADING_CHANGE=NO'
          echo 'POLYMARKET_INSPECTION=NO'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ai_team_orchestrator.py')
          s = p.read_text()
          old = '    *, user: str, home: Path, base_dir: Path, task_id: str, ref: str, branch: str | None\n'
          new = '    *, user: str, home: Path, base_dir: Path, task_id: str, ref: str, branch: str | None = None\n'
          if old not in s:
              raise SystemExit('prepare_checkout signature not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cat > tests/test_ai_team_research_checkout.py <<'PY'
          import importlib.util
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          spec = importlib.util.spec_from_file_location(
              "ai_team_orchestrator", ROOT / "scripts" / "ai_team_orchestrator.py"
          )
          assert spec and spec.loader
          orch = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(orch)


def test_prepare_checkout_allows_read_only_call_without_branch(tmp_path, monkeypatch):
    base = tmp_path / "work"
    task_id = "research-task"
    workdir = base / task_id
    workdir.mkdir(parents=True)
    monkeypatch.setattr(orch, "normalize_worktree_ownership", lambda path, user: (1000, 1000))
    calls = []

    def fake_run(args, **kwargs):
        calls.append(args)
        return type("CP", (), {"returncode": 0, "stdout": "", "stderr": ""})()

    monkeypatch.setattr(orch, "run", fake_run)
    result = orch.prepare_checkout(
        user="nobody",
        home=tmp_path / "home",
        base_dir=base,
        task_id=task_id,
        ref="origin/main",
    )
    assert result == workdir
    assert calls
          PY
          python3 -m py_compile scripts/ai_team_orchestrator.py
          pytest -q tests/test_ai_team_research_checkout.py
          git config user.name 'Hyperliquid AI Manager'
          git config user.email 'manager@localhost'
          git add scripts/ai_team_orchestrator.py tests/test_ai_team_research_checkout.py
          git commit -m 'fix(ai-team): restore read-only research checkout contract'
          target="$(git rev-parse HEAD)"
          git remote set-url origin git@github.com:aliezzat4321/hyperliquid-copy-engine.git
          git push origin HEAD:manager/184-research-checkout-fix
          echo "TARGET_SHA=$target"

          # Emergency manager bootstrap: install the exact branch file only to revive
          # the crashed control plane. Permanent state still requires PR review + CI.
          install -m 0755 scripts/ai_team_orchestrator.py /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          systemctl reset-failed hyperliquid-ai-team-orchestrator.service || true
          systemctl start hyperliquid-ai-team-orchestrator.service
          sleep 2
          systemctl status hyperliquid-ai-team-orchestrator.service --no-pager -l || true
          hl-ai-team-status
          echo 'BOOTSTRAP_RUNTIME_REVIVED=YES'
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
