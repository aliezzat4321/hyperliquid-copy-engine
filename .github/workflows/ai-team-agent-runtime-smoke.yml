name: ai-team-agent-runtime-smoke

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-agent-runtime-smoke.yml"]

permissions:
  contents: read

jobs:
  persist_research_checkout_fix:
    runs-on: [self-hosted, linux]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manager/184-research-checkout-fix
          persist-credentials: false
          fetch-depth: 0
      - name: Patch branch and add regression
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'REAL_TRADING_CHANGE=NO'
          echo 'POLYMARKET_INSPECTION=NO'
          python3 -c "from pathlib import Path; p=Path('scripts/ai_team_orchestrator.py'); s=p.read_text(); old='    *, user: str, home: Path, base_dir: Path, task_id: str, ref: str, branch: str | None\\n'; new='    *, user: str, home: Path, base_dir: Path, task_id: str, ref: str, branch: str | None = None\\n'; assert old in s or new in s, 'prepare_checkout signature not found'; p.write_text(s.replace(old,new,1) if old in s else s)"
          python3 -c "import base64; open('tests/test_ai_team_research_checkout.py','wb').write(base64.b64decode(''))"
          python3 -m py_compile scripts/ai_team_orchestrator.py tests/test_ai_team_research_checkout.py
          python3 -c "import inspect,sys; sys.path.insert(0,'scripts'); import ai_team_orchestrator as o; assert inspect.signature(o.prepare_checkout).parameters['branch'].default is None"
          git config user.name 'Hyperliquid AI Manager'
          git config user.email 'manager@localhost'
          git add scripts/ai_team_orchestrator.py tests/test_ai_team_research_checkout.py
          if ! git diff --cached --quiet; then git commit -m 'fix(ai-team): restore read-only research checkout contract'; fi
          target="$(git rev-parse HEAD)"
          git remote set-url origin git@github.com:aliezzat4321/hyperliquid-copy-engine.git
          git push origin HEAD:manager/184-research-checkout-fix
          echo "TARGET_SHA=$target"
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
