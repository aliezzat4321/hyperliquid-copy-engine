name: p0-330-apply

on:
  push:
    branches: [codex/330-lane3-l2-net-cost]
    paths: ['.github/workflows/p0-330-apply.yml']

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/330-lane3-l2-net-cost
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic service integration
        run: python3 scripts/patch_330_lane3_service.py
      - name: Install and test executor
        working-directory: services/invo-notification-executor
        run: |
          npm install
          npm run check
      - name: Remove one-shot patch machinery and commit
        run: |
          rm -f scripts/patch_330_lane3_service.py .github/workflows/p0-330-apply.yml
          git config user.name 'hyperliquid-ai-team'
          git config user.email 'hyperliquid-ai-team@users.noreply.github.com'
          git add services/invo-notification-executor scripts/patch_330_lane3_service.py .github/workflows/p0-330-apply.yml
          git commit -m 'fix: Lane 3 causal L2 execution and net cost accounting (#330)'
          git push origin HEAD:codex/330-lane3-l2-net-cost
