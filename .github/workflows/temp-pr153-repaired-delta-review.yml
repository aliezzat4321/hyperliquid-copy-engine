name: temp-pr153-repaired-delta-review

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'schedule' || github.event.head_commit.message == 'Run PR153 repaired delta audit'
    runs-on: [self-hosted, linux]
    timeout-minutes: 7
    steps:
      - name: Gate exact target
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=6ed0686ebf2d2635b90eb66111f180b89965f86d
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/153" --jq .head.sha)"
          if [[ "$CURRENT_SHA" != "$TARGET_SHA" ]]; then
            echo 'run_review=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/issues/153/comments?per_page=100" --paginate --jq '.[].body' \
            | grep -Fq "FINAL_REPAIRED_DELTA_REVIEW_SHA=$TARGET_SHA"; then
            echo 'run_review=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'run_review=yes' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run_review == 'yes'
        with:
          ref: 6ed0686ebf2d2635b90eb66111f180b89965f86d
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Independent Claude repaired-delta audit
        if: steps.gate.outputs.run_review == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA=6ed0686ebf2d2635b90eb66111f180b89965f86d
          PREVIOUS_SHA=3cdf49c8792fdfd4dc9d281e593ecd051b86c330
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m py_compile scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py

          CLAUDE_HOME=/var/lib/hyperliquid-ai-team/agents/claude/home
          UID_C="$(id -u hl-claude-agent)"
          GID_C="$(id -g hl-claude-agent)"
          REVIEW_DIR="/var/lib/hyperliquid-ai-team/agents/claude/worktrees/pr153-delta-${GITHUB_RUN_ID}"
          rm -rf "$REVIEW_DIR"
          mkdir -p "$REVIEW_DIR"
          cp -a "$GITHUB_WORKSPACE/." "$REVIEW_DIR/"
          chown -R hl-claude-agent:hl-claude-agent "$REVIEW_DIR"
          cleanup() { rm -rf "$REVIEW_DIR" /tmp/pr153-delta-*; }
          trap cleanup EXIT

          run_claude() {
            duration="$1"; shift
            timeout --foreground "$duration" \
              setpriv --reuid="$UID_C" --regid="$GID_C" --init-groups \
              env -i HOME="$CLAUDE_HOME" CLAUDE_CONFIG_DIR="$CLAUDE_HOME/.claude" \
              XDG_CONFIG_HOME="$CLAUDE_HOME/.config" XDG_CACHE_HOME="$CLAUDE_HOME/.cache" \
              PATH=/usr/local/bin:/usr/bin:/bin \
              /usr/bin/claude "$@"
          }

          set +e
          ready="$(cd "$REVIEW_DIR" && run_claude 30s -p 'Reply exactly: CLAUDE_READY_OK' --model sonnet --output-format text --permission-mode dontAsk 2>/tmp/pr153-delta-ready.err)"
          ready_rc=$?
          set -e
          if [[ $ready_rc -ne 0 || "$ready" != *CLAUDE_READY_OK* ]]; then
            echo 'CLAUDE_DELTA_REVIEW=WAITING_RATE_LIMIT_OR_UNAVAILABLE'
            tail -c 800 /tmp/pr153-delta-ready.err 2>/dev/null || true
            exit 0
          fi

          cat >/tmp/pr153-delta-prompt <<EOF
          You are CLAUDE, independent exact-SHA reviewer for Hyperliquid PR #153.
          Target EXACT SHA: $TARGET_SHA. Previous exhaustively reviewed SHA: $PREVIOUS_SHA.
          Do not modify files.

          The previous full audit found one remaining blocker: handle_claude_probe() treated non-rate-limit readiness failures (auth/config/permission/exec) as WAITING_RATE_LIMIT forever without consuming bounded failure budget.

          Review the repair delta with: git diff $PREVIOUS_SHA..$TARGET_SHA -- scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          Also inspect retry_or_block(), rate_limit_info(), the existing true-rate-limit test, and the new non-limit regression test.

          Prove all of these:
          1. positively classified quota/provider limits remain WAITING_RATE_LIMIT and do not burn attempts;
          2. non-limit probe failures leave WAITING_RATE_LIMIT, consume exactly one normal attempt, preserve session_id, and enter bounded RETRY/BLOCK behavior;
          3. repeated ordinary failures eventually terminally block at max_attempts rather than loop forever;
          4. successful readiness resumes the same review checkpoint;
          5. the repair creates no double-attempt increment, duplicate task, stale worker ownership, or safety-boundary regression;
          6. no live-trading, capital, credential, deployment, protected-path or Polymarket boundary is weakened.

          If and only if there is no merge blocker, end exactly:
          FINAL_REPAIRED_DELTA_REVIEW_SHA=$TARGET_SHA
          VERDICT=PASS
          BLOCKERS_JSON=[]
          Otherwise end exactly with VERDICT=FAIL and a compact JSON blocker list.
          EOF

          set +e
          review_json="$(cd "$REVIEW_DIR" && run_claude 4m -p "$(cat /tmp/pr153-delta-prompt)" --model sonnet --output-format json --permission-mode dontAsk 2>/tmp/pr153-delta-review.err)"
          review_rc=$?
          set -e
          printf '%s' "$review_json" >/tmp/pr153-delta-review.json
          if [[ $review_rc -ne 0 ]]; then
            combined="$(cat /tmp/pr153-delta-review.json /tmp/pr153-delta-review.err 2>/dev/null || true)"
            if grep -Eqi 'rate limit|usage limit|session limit|quota|too many requests|429|hit your limit|limit reached' <<<"$combined"; then
              echo 'CLAUDE_DELTA_REVIEW=WAITING_RATE_LIMIT_OR_UNAVAILABLE'
              exit 0
            fi
            if [[ $review_rc -eq 124 ]]; then
              echo 'CLAUDE_DELTA_REVIEW=TIMED_OUT_WILL_RETRY'
              exit 0
            fi
            printf '%s' "$combined" | tail -c 1500 >&2
            exit "$review_rc"
          fi

          python3 - "$TARGET_SHA" /tmp/pr153-delta-review.json >/tmp/pr153-delta-result.txt <<'PY'
          import json, re, sys
          sha = sys.argv[1]
          row = json.load(open(sys.argv[2], encoding='utf-8'))
          result = str(row.get('result') or '')
          print(result)
          sm = re.search(r'(?mi)^\s*FINAL_REPAIRED_DELTA_REVIEW_SHA\s*=\s*([0-9a-f]{40})\s*$', result)
          vm = re.search(r'(?mi)^\s*VERDICT\s*=\s*(PASS|FAIL)\s*$', result)
          if not sm or sm.group(1) != sha or not vm:
              raise SystemExit('invalid or stale Claude result')
          PY
          cat /tmp/pr153-delta-result.txt
          gh pr comment 153 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr153-delta-result.txt
          grep -Eq '^VERDICT=PASS$' /tmp/pr153-delta-result.txt
          echo 'CLAUDE_PR153_REPAIRED_DELTA_REVIEW=PASS'
