name: storage-retention-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/storage_retention_audit.py"
      - "scripts/storage_retention_apply.py"
      - "scripts/storage_volume_diagnostics.py"
      - "scripts/hyperliquid_storage_guard.sh"
      - ".github/workflows/storage-retention-audit.yml"

permissions:
  contents: read

concurrency:
  group: hyperliquid-storage-retention-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.repository == 'aliezzat4321/hyperliquid-copy-engine'
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Sync server checkout
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          git fetch origin main
          git reset --hard origin/main

      - name: Attribute data-volume usage and recent writers
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          python3 scripts/storage_volume_diagnostics.py

      - name: Build fresh profitability-driven retention manifest
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          python3 scripts/storage_retention_audit.py

      - name: Print top deletion candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/root/hyperliquid-audit/storage-retention/storage_retention_manifest.json')
          d=json.loads(p.read_text())
          rows=[r for r in d['market_shadow']['partitions'] if r['action']=='DELETE_CANDIDATE']
          rows.sort(key=lambda r:r['bytes'], reverse=True)
          print('========== TOP DELETE CANDIDATES (FRESH MANIFEST) ==========')
          for r in rows[:30]:
              print(f"{r['bytes']/1024**3:.3f} GiB | {r['date']} | {r['coin_dir']} | {r['path']}")
          print(f"DELETE_CANDIDATE_TOTAL_GIB={sum(r['bytes'] for r in rows)/1024**3:.3f}")
          PY

      - name: Apply reviewed delete candidates only under stop pressure
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          DATA_PCT="$(df -P /mnt/HC_Volume_106576526 | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
          if [[ ! "$DATA_PCT" =~ ^[0-9]+$ ]]; then
            echo "unable to parse data-volume usage: $DATA_PCT" >&2
            exit 2
          fi
          echo "data_volume_usage_before_apply=${DATA_PCT}%"
          if (( DATA_PCT >= 92 )); then
            echo "STORAGE_RETENTION=APPLY reason=data_volume_at_or_above_stop_threshold"
            python3 scripts/storage_retention_apply.py --apply --target-used-pct 88
          else
            echo "STORAGE_RETENTION=NO_APPLY usage_below_stop_threshold"
            python3 scripts/storage_retention_apply.py --target-used-pct 88
          fi

      - name: Install and run storage guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          sudo install -m 0755 scripts/hyperliquid_storage_guard.sh /usr/local/sbin/hyperliquid-storage-guard
          sudo /usr/local/sbin/hyperliquid-storage-guard

      - name: Filesystem after audit
        if: always()
        shell: bash
        run: |
          df -h / /mnt/HC_Volume_106576526 || true
