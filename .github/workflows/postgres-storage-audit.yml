name: postgres-storage-audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/postgres_storage_audit.sql"
      - ".github/workflows/postgres-storage-audit.yml"

permissions:
  contents: read

concurrency:
  group: hyperliquid-postgres-storage-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.repository == 'aliezzat4321/hyperliquid-copy-engine'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Sync server checkout
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          git fetch origin main
          git reset --hard origin/main

      - name: PostgreSQL filesystem attribution
        shell: bash
        run: |
          set -euo pipefail
          echo '========== POSTGRESQL FILESYSTEM =========='
          du -sh /mnt/HC_Volume_106576526/hyperliquid/postgresql || true
          du -xh --max-depth=2 /mnt/HC_Volume_106576526/hyperliquid/postgresql 2>/dev/null \
            | sort -h | tail -n 40 || true
          echo 'READ_ONLY_NO_DELETION=YES'

      - name: PostgreSQL connectivity attribution
        shell: bash
        run: |
          set -euo pipefail
          echo '========== POSTGRESQL CONNECTIVITY =========='
          echo "runner_uid=$(id -u) runner_user=$(id -un)"
          ss -ltn 2>/dev/null | grep -E ':(5432|5433)[[:space:]]' || true
          docker ps --format '{{.Names}} {{.Ports}}' 2>/dev/null | grep -i postgres || true
          pg_isready -h 127.0.0.1 -p 5432 || true
          pg_isready -h 127.0.0.1 -p 5433 || true
          if command -v runuser >/dev/null 2>&1 \
            && runuser -u postgres -- psql -d hlcopy -X -Atqc 'SELECT 1' >/dev/null 2>&1; then
            echo 'LOCAL_RUNUSER_AUDIT_ACCESS=YES'
          else
            echo 'LOCAL_RUNUSER_AUDIT_ACCESS=NO'
          fi
          echo 'READ_ONLY_NO_MUTATION=YES'

      - name: PostgreSQL logical storage audit
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          set -a
          source .env
          set +a
          DB_URL="${RESEARCH_DATABASE_URL:-${DATABASE_URL:-}}"
          echo '========== POSTGRESQL LOGICAL STORAGE =========='

          if [[ -n "$DB_URL" ]] && psql "$DB_URL" -X -Atqc 'SELECT 1' >/dev/null 2>&1; then
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/postgres_storage_audit.sql
            echo 'AUDIT_CONNECTION=configured_url'
          elif command -v runuser >/dev/null 2>&1 \
            && runuser -u postgres -- psql -d hlcopy -X -Atqc 'SELECT 1' >/dev/null 2>&1; then
            runuser -u postgres -- psql -d hlcopy -X -v ON_ERROR_STOP=1 \
              -f scripts/postgres_storage_audit.sql
            echo 'AUDIT_CONNECTION=local_runuser_postgres'
          else
            echo 'POSTGRES_STORAGE_AUDIT_FAIL=no authenticated read-only connection available' >&2
            exit 2
          fi
          echo 'READ_ONLY_NO_MUTATION=YES'
