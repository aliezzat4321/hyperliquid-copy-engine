name: postgres-storage-audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/postgres_storage_audit.sql"
      - ".github/workflows/postgres-storage-audit.yml"

permissions:
  contents: read

concurrency:
  group: hyperliquid-postgres-storage-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.repository == 'aliezzat4321/hyperliquid-copy-engine'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Sync server checkout
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          git fetch origin main
          git reset --hard origin/main

      - name: PostgreSQL filesystem attribution
        shell: bash
        run: |
          set -euo pipefail
          echo '========== POSTGRESQL FILESYSTEM =========='
          du -sh /mnt/HC_Volume_106576526/hyperliquid/postgresql || true
          du -xh --max-depth=2 /mnt/HC_Volume_106576526/hyperliquid/postgresql 2>/dev/null \
            | sort -h | tail -n 40 || true
          echo 'READ_ONLY_NO_DELETION=YES'

      - name: PostgreSQL logical storage audit
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          set -a
          source .env
          set +a
          DB_URL="${RESEARCH_DATABASE_URL:-${DATABASE_URL:-}}"
          if [[ -z "$DB_URL" ]]; then
            echo 'POSTGRES_STORAGE_AUDIT_FAIL=no database URL in .env' >&2
            exit 2
          fi
          echo '========== POSTGRESQL LOGICAL STORAGE =========='
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/postgres_storage_audit.sql
          echo 'READ_ONLY_NO_MUTATION=YES'
