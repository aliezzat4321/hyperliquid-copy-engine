name: postgres-storage-audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/postgres_storage_audit.sql"
      - "scripts/run_postgres_storage_audit.py"
      - ".github/workflows/postgres-storage-audit.yml"

permissions:
  contents: read

concurrency:
  group: hyperliquid-postgres-storage-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.repository == 'aliezzat4321/hyperliquid-copy-engine'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Sync server checkout
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          git fetch origin main
          git reset --hard origin/main

      - name: PostgreSQL filesystem attribution
        shell: bash
        run: |
          set -euo pipefail
          echo '========== POSTGRESQL FILESYSTEM =========='
          du -sh /mnt/HC_Volume_106576526/hyperliquid/postgresql || true
          du -xh --max-depth=2 /mnt/HC_Volume_106576526/hyperliquid/postgresql 2>/dev/null \
            | sort -h | tail -n 40 || true
          echo 'READ_ONLY_NO_DELETION=YES'

      - name: PostgreSQL cluster attribution
        shell: bash
        run: |
          set -euo pipefail
          echo '========== POSTGRESQL CLUSTER ATTRIBUTION =========='
          pg_lsclusters 2>/dev/null || true
          ps -eo pid,lstart,args | grep '[p]ostgres' || true
          echo '========== DATA-DIR RECENCY =========='
          find /mnt/HC_Volume_106576526/hyperliquid/postgresql/14/hlcopy \
            -type f -printf '%T@ %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null \
            | sort -nr | head -n 25 || true
          echo 'READ_ONLY_NO_MUTATION=YES'

      - name: Compare active and offline cluster provenance
        shell: bash
        run: |
          set -euo pipefail
          OLD=/mnt/HC_Volume_106576526/hyperliquid/postgresql/14/hlcopy
          ACTIVE=/var/lib/postgresql/14/main
          echo '========== POSTGRESQL CLUSTER PROVENANCE =========='
          echo "offline_data_dir=$OLD"
          echo "active_data_dir=$ACTIVE"
          du -sh "$OLD" "$ACTIVE" 2>/dev/null || true
          echo '--- offline pg_controldata ---'
          /usr/lib/postgresql/14/bin/pg_controldata "$OLD" 2>/dev/null \
            | grep -E 'Database system identifier|Database cluster state|Latest checkpoint|Time of latest checkpoint|Database block size|WAL block size' || true
          echo '--- active pg_controldata ---'
          /usr/lib/postgresql/14/bin/pg_controldata "$ACTIVE" 2>/dev/null \
            | grep -E 'Database system identifier|Database cluster state|Latest checkpoint|Time of latest checkpoint|Database block size|WAL block size' || true
          echo '--- offline hlcopy log lifecycle ---'
          grep -E 'starting PostgreSQL|database system is ready|database system is shut down|received .*shutdown|shutting down' \
            /var/log/postgresql/postgresql-14-hlcopy.log 2>/dev/null | tail -n 40 || true
          echo '--- active main log lifecycle ---'
          grep -E 'starting PostgreSQL|database system is ready|database system is shut down|received .*shutdown|shutting down' \
            /var/log/postgresql/postgresql-14-main.log 2>/dev/null | tail -n 40 || true
          echo 'READ_ONLY_NO_MUTATION=YES'

      - name: PostgreSQL connectivity attribution
        shell: bash
        run: |
          set -euo pipefail
          echo '========== POSTGRESQL CONNECTIVITY =========='
          echo "runner_uid=$(id -u) runner_user=$(id -un)"
          ss -ltn 2>/dev/null | grep -E ':(5432|5433)[[:space:]]' || true
          pg_isready -h 127.0.0.1 -p 5432 || true
          pg_isready -h 127.0.0.1 -p 5433 || true
          echo 'READ_ONLY_NO_MUTATION=YES'

      - name: PostgreSQL logical storage audit when credentials are available
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          echo '========== POSTGRESQL LOGICAL STORAGE =========='
          if python3 scripts/run_postgres_storage_audit.py; then
            echo 'LOGICAL_AUDIT=SUCCESS'
          else
            echo 'LOGICAL_AUDIT=UNAVAILABLE_NO_WORKING_CREDENTIAL_SOURCE'
          fi
          echo 'READ_ONLY_NO_MUTATION=YES'
