name: ai-team-worktree-safety-fix

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-worktree-safety-fix.yml"]

permissions:
  contents: write

jobs:
  repair-and-deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/126-ai-orchestrator
          fetch-depth: 0
      - name: Patch exact-worktree Git trust only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/ai_team_orchestrator.py')
          text = path.read_text()
          anchor = '\n\nclass GitHub:\n'
          helper = '''\n\ndef git_worktree(\n    workdir: Path, *args: str, check: bool = False\n) -> subprocess.CompletedProcess[str]:\n    """Run root-side Git only with this generated worktree explicitly trusted."""\n    return run(\n        [\n            "git",\n            "-c",\n            f"safe.directory={workdir}",\n            "-C",\n            str(workdir),\n            *args,\n        ],\n        check=check,\n    )\n'''
          if 'def git_worktree(' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('GitHub class anchor mismatch')
              text = text.replace(anchor, helper + anchor, 1)

          text, n_rev = re.subn(
              r'run\(\s*\["git", "-C", str\(workdir\), "rev-parse", "HEAD"\],\s*check=True\s*\)',
              'git_worktree(workdir, "rev-parse", "HEAD", check=True)',
              text,
          )
          if n_rev not in (0, 2):
              raise SystemExit(f'unexpected rev-parse replacement count: {n_rev}')

          old = 'run(["git", "-C", str(workdir), "diff", "--name-only", base_sha, "--"], check=True)'
          new = 'git_worktree(workdir, "diff", "--name-only", base_sha, "--", check=True)'
          if old in text:
              text = text.replace(old, new, 1)

          old = 'run(["git", "-C", str(workdir), "diff", base_sha, "--"], check=True).stdout'
          new = 'git_worktree(workdir, "diff", base_sha, "--", check=True).stdout'
          if old in text:
              text = text.replace(old, new, 1)

          forbidden = [
              'run(["git", "-C", str(workdir), "rev-parse", "HEAD"], check=True)',
              'run(["git", "-C", str(workdir), "diff", "--name-only", base_sha, "--"], check=True)',
              'run(["git", "-C", str(workdir), "diff", base_sha, "--"], check=True)',
          ]
          if any(x in text for x in forbidden):
              raise SystemExit('unsafe root-side worktree Git call remains')
          path.write_text(text)

          tests = Path('tests/test_ai_team_orchestrator.py')
          t = tests.read_text()
          marker = 'def test_root_git_trust_is_scoped_to_exact_worktree'
          if marker not in t:
              t += '''\n\ndef test_root_git_trust_is_scoped_to_exact_worktree(tmp_path, monkeypatch):\n    captured = {}\n\n    def fake_run(cmd, **kwargs):\n        captured["cmd"] = cmd\n        captured["check"] = kwargs.get("check")\n        return None\n\n    monkeypatch.setattr(orch, "run", fake_run)\n    orch.git_worktree(tmp_path, "rev-parse", "HEAD", check=True)\n    assert captured["cmd"][:3] == ["git", "-c", f"safe.directory={tmp_path}"]\n    assert captured["cmd"][3:] == ["-C", str(tmp_path), "rev-parse", "HEAD"]\n    assert captured["check"] is True\n'''
              tests.write_text(t)
          PY
          python3 -m py_compile scripts/ai_team_orchestrator.py
          if command -v ruff >/dev/null 2>&1; then
            ruff format scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
            ruff check scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          fi
      - name: Commit and deploy repaired orchestrator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hyperliquid-ai-team'
          git config user.email 'hyperliquid-ai-team@users.noreply.github.com'
          git add scripts/ai_team_orchestrator.py tests/test_ai_team_orchestrator.py
          git commit -m 'Scope Git trust to generated agent worktrees'
          git push origin HEAD:codex/126-ai-orchestrator
          bash scripts/install_ai_team_orchestrator.sh
          systemctl reset-failed hyperliquid-ai-team-orchestrator.service || true
          systemctl start hyperliquid-ai-team-orchestrator.service || true
          hl-ai-team-status
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
