name: temp-pr156-opus-review

on:
  push:
    branches: [trigger/156-opus-review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, linux]
    timeout-minutes: 12
    steps:
      - name: Assert exact review target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          echo 'TARGET_PR=156'
          echo 'TARGET_SHA=35cba9965500f7ee71cacd90359ba9dae36519f9'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'

      - uses: actions/checkout@v4
        with:
          ref: 35cba9965500f7ee71cacd90359ba9dae36519f9
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify narrow protected delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "35cba9965500f7ee71cacd90359ba9dae36519f9"
          git fetch origin main --quiet
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = "scripts/install_ai_team_orchestrator.sh"
          git diff --check origin/main...HEAD
          bash -n scripts/install_ai_team_orchestrator.sh
          ! git diff origin/main...HEAD -- scripts/install_ai_team_orchestrator.sh | grep -E '^\+.*(REAL_TRADING_ENABLED|LIVE_TRADING_ENABLED)\s*=\s*(YES|TRUE|1)'

      - name: Probe Claude availability
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_HOME=/var/lib/hyperliquid-ai-team/agents/claude/home
          UID_C="$(id -u hl-claude-agent)"
          GID_C="$(id -g hl-claude-agent)"
          set +e
          ready="$(timeout --foreground 45s setpriv --reuid="$UID_C" --regid="$GID_C" --init-groups \
            env -i HOME="$CLAUDE_HOME" CLAUDE_CONFIG_DIR="$CLAUDE_HOME/.claude" \
            XDG_CONFIG_HOME="$CLAUDE_HOME/.config" XDG_CACHE_HOME="$CLAUDE_HOME/.cache" \
            PATH=/usr/local/bin:/usr/bin:/bin \
            /usr/bin/claude -p 'Reply exactly: CLAUDE_READY_OK' --model sonnet \
            --output-format text --permission-mode dontAsk 2>/tmp/pr156-ready.err)"
          rc=$?
          set -e
          if [[ $rc -ne 0 || "$ready" != *CLAUDE_READY_OK* ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'CLAUDE_PR156_REVIEW=WAITING_RATE_LIMIT_OR_UNAVAILABLE'
            tail -c 600 /tmp/pr156-ready.err 2>/dev/null || true
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'CLAUDE_PR156_PROBE=READY'

      - name: Exact-SHA Claude Opus review
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA=35cba9965500f7ee71cacd90359ba9dae36519f9
          PR_NUMBER=156
          CLAUDE_HOME=/var/lib/hyperliquid-ai-team/agents/claude/home
          UID_C="$(id -u hl-claude-agent)"
          GID_C="$(id -g hl-claude-agent)"
          REVIEW_DIR="/var/lib/hyperliquid-ai-team/agents/claude/worktrees/pr156-review-${GITHUB_RUN_ID}"
          rm -rf "$REVIEW_DIR"
          mkdir -p "$REVIEW_DIR"
          cp -a "$GITHUB_WORKSPACE/." "$REVIEW_DIR/"
          chown -R hl-claude-agent:hl-claude-agent "$REVIEW_DIR"

          cat >/tmp/pr156-review-prompt.txt <<'EOF'
          You are the independent exact-SHA Claude Opus reviewer for Hyperliquid AI-team Issue #154 follow-up PR #156.
          Review EXACT commit SHA 35cba9965500f7ee71cacd90359ba9dae36519f9. Do not modify files.

          Context: PR #155 already received exact-SHA Opus PASS for the queue/Trello implementation, but after merge we discovered the protected installer delta documented in docs/ai-team/TRELLO_MANAGER_WIRING.md was not actually committed. PR #156 contains only that missing trusted-manager installer delta.

          Read AGENTS.md, scripts/install_ai_team_orchestrator.sh, scripts/trello_team_bridge.py, config/ai_team_router.json, docs/ai-team/TRELLO_MANAGER_WIRING.md, and docs/ai-team/AUTONOMOUS_TEAM.md as needed. Review origin/main...HEAD.

          Required intent:
          - install scripts/trello_team_bridge.py root-owned at /opt/hyperliquid-ai-team/scripts/trello_team_bridge.py;
          - provision the ai-team:queued GitHub label;
          - do not expose Trello credentials to Codex/Claude;
          - do not alter trading/live/capital/credentials/workflows/Polymarket;
          - preserve the existing safety boundary.

          Reject any merge blocker, unsafe permission expansion, incorrect install path/mode, queue-label mismatch, credential exposure, or unintended scope.

          End EXACTLY with these three lines:
          REVIEWED_SHA=35cba9965500f7ee71cacd90359ba9dae36519f9
          VERDICT=PASS
          BLOCKERS_JSON=[]
          Or VERDICT=FAIL and a concrete JSON blocker list.
          EOF

          set +e
          review_json="$(cd "$REVIEW_DIR" && timeout --foreground 7m \
            setpriv --reuid="$UID_C" --regid="$GID_C" --init-groups \
            env -i HOME="$CLAUDE_HOME" CLAUDE_CONFIG_DIR="$CLAUDE_HOME/.claude" \
            XDG_CONFIG_HOME="$CLAUDE_HOME/.config" XDG_CACHE_HOME="$CLAUDE_HOME/.cache" \
            PATH=/usr/local/bin:/usr/bin:/bin \
            /usr/bin/claude -p "$(cat /tmp/pr156-review-prompt.txt)" --model opus \
            --output-format json --permission-mode dontAsk 2>/tmp/pr156-review.err)"
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            echo "CLAUDE_PR156_REVIEW_COMMAND_FAILED=$rc" >&2
            tail -c 1000 /tmp/pr156-review.err >&2 || true
            exit $rc
          fi
          printf '%s' "$review_json" >/tmp/pr156-review.json
          python3 - "$TARGET_SHA" /tmp/pr156-review.json >/tmp/pr156-result.txt <<'PY'
          import json, re, sys
          sha = sys.argv[1]
          row = json.load(open(sys.argv[2], encoding='utf-8'))
          result = str(row.get('result') or '')
          print(result)
          sm = re.search(r'(?mi)^\s*REVIEWED_SHA\s*=\s*([0-9a-f]{40})\s*$', result)
          vm = re.search(r'(?mi)^\s*VERDICT\s*=\s*(PASS|FAIL)\s*$', result)
          if not sm or sm.group(1) != sha:
              raise SystemExit('stale/missing reviewed SHA')
          if not vm or vm.group(1) != 'PASS':
              raise SystemExit('Claude exact-SHA review did not PASS')
          PY
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr156-result.txt
          echo 'CLAUDE_PR156_EXACT_SHA_REVIEW=PASS'
          rm -rf "$REVIEW_DIR" /tmp/pr156-review-prompt.txt /tmp/pr156-review.err /tmp/pr156-review.json /tmp/pr156-result.txt
