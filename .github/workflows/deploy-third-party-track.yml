name: deploy-third-party-track

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-third-party-track.yml
      - scripts/deploy_third_party_track_self_hosted.sh
      - deploy/systemd/hyperliquid-third-party-*.service
      - deploy/systemd/hyperliquid-third-party-*.timer
      - deploy/systemd/hyperliquid-invo-wallet-identifier.service
      - src/hlcopy/third_party/**
      - src/hlcopy/shadow/wide_*.py
      - src/hlcopy/profitability/**
      - src/hlcopy/copyability/**
      - src/hlcopy/signals/invo.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-third-party-track
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - hyperliquid
    timeout-minutes: 30
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Deploy third-party research and profitability track
        shell: bash
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/scripts/deploy_third_party_track_self_hosted.sh"
          if [[ "$(id -u)" -eq 0 ]]; then
            bash "$script"
          else
            sudo -n bash "$script"
          fi
