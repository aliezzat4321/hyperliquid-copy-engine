name: p0-334-finalize

on:
  push:
    branches: [codex/334-ci-baseline-unblock]
    paths:
      - ".github/workflows/p0-334-finalize.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hlcopy
          POSTGRES_PASSWORD: hlcopy
          POSTGRES_DB: hlcopy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hlcopy -d hlcopy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hlcopy:hlcopy@localhost:5432/hlcopy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/334-ci-baseline-unblock
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Render generated state
        run: python scripts/render_ai_team_state.py
      - name: Validate contract
        run: python scripts/validate_ai_team_contract.py
      - name: Ruff
        run: ruff check .
      - name: Full pytest
        run: pytest
      - name: Commit generated output and remove one-shot workflow
        run: |
          git config user.name "ci-baseline-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ai-team/CURRENT_STATE.md docs/ai-team/experiments/INDEX.md
          git rm .github/workflows/p0-334-finalize.yml
          git diff --cached --check -- . ':(exclude)docs/ai-team/CURRENT_STATE.md'
          git commit -m "Finalize validated AI-team CI baseline (#334)"
          git push origin HEAD:codex/334-ci-baseline-unblock
