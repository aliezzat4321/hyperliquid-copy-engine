name: ai-team-recover-pass-run-temp

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths:
      - .github/workflows/ai-team-kick-temp.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
      - name: Finalize already-completed Codex run without another model call
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'aliezzat4321/hyperliquid-copy-engine'
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          systemctl stop hyperliquid-ai-team-orchestrator.timer || true
          PYTHONPATH=/opt/hyperliquid-ai-team/scripts python3 - <<'PY'
          import json
          from pathlib import Path
          import ai_team_orchestrator as orch

          task_id = '8c5002599f2a40e9'
          team = orch.Orchestrator()
          task = team.ledger.get(task_id)
          assert int(task['issue_number']) == 128
          assert task['task_type'] == 'BUILD'
          assert task['status'] == 'BLOCKED'
          assert task['last_error'] == 'agent produced no file changes'
          workdir = Path(task['workdir'])
          assert workdir.is_dir()
          branch = str(task['branch'])
          base_sha = orch.git_worktree(workdir, 'rev-parse', 'HEAD', check=True).stdout.strip()
          files, _ = orch.validate_changes(team.cfg, workdir, base_sha)
          assert files == ['docs/ai-team/dry-run-pass.md'], files
          proof = (workdir / files[0]).read_text()
          assert proof.splitlines().count('AUTONOMOUS_PASS_DRILL=OK') == 1
          assert 'This is a harmless orchestration proof only.' in proof

          team.commit_and_push(workdir, task, branch)
          new_sha = orch.git_worktree(workdir, 'rev-parse', 'HEAD', check=True).stdout.strip()
          issue = team.gh.issue(128)
          pr = team.create_pr(issue, task, branch, new_sha, files)
          pr_number = int(pr['number'])
          team.ledger.update(
              task_id,
              status='DONE',
              target_sha=new_sha,
              pr_number=pr_number,
              retry_at=None,
              last_error=None,
          )
          team.enqueue_review(task, pr_number, new_sha)
          try:
              team.gh.remove_label(128, team.cfg['labels']['blocked'])
          except Exception:
              pass
          team.runtime.event(
              'TASK_RECOVERED_AFTER_VALIDATOR_FIX',
              assignment_id=task_id,
              issue=128,
              pr=pr_number,
              target_sha=new_sha,
              files=files,
          )
          team.sync_runtime_checkpoint()
          print(f'RECOVERED_PR={pr_number}')
          print(f'RECOVERED_SHA={new_sha}')
          print('RECOVERED_FILES=' + json.dumps(files, separators=(',', ':')))
          PY
          systemctl start hyperliquid-ai-team-orchestrator.timer
          git rm .github/workflows/ai-team-kick-temp.yml
          git config user.name 'aliezzat4321'
          git config user.email 'ali.ezzat4321@gmail.com'
          git commit -m 'Remove temporary AI-team recovery workflow'
          git remote set-url origin git@github.com:aliezzat4321/hyperliquid-copy-engine.git
          git push origin HEAD:codex/126-ai-orchestrator
          echo 'PASS_RUN_RECOVERY=COMPLETE'
          echo 'AI_TEAM_TIMER=ACTIVE'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
