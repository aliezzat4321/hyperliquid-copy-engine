name: bones-explorer-probe

on:
  push:
    branches:
      - agent/free-public-wallet-identifier-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Derive block time curve from SQD
        run: |
          python - <<'PY'
          import json, requests
          URL='https://portal.sqd.dev/datasets/hyperliquid-fills/stream'
          s=requests.Session()
          for start in (1090000000,1095000000,1100000000,1101000000,1101600000):
              payload={'type':'hyperliquidFills','fromBlock':start,'toBlock':start+500,
                       'fields':{'block':{'number':True,'timestamp':True},'fill':{'user':True}},'fills':[{}]}
              r=s.post(URL,json=payload,timeout=30); r.raise_for_status()
              rows=[json.loads(x) for x in r.text.splitlines() if x.strip()]
              if not rows:
                  print('SAMPLE',start,'EMPTY'); continue
              print('SAMPLE',start,'FIRST',rows[0]['header'],'LAST',rows[-1]['header'],'ROWS',len(rows))
          PY
