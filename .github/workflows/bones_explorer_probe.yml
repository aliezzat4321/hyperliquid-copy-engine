          ranked=sorted(scores.items(),key=lambda kv:(len(kv[1]),-sum(float(x[2][0]) for x in kv[1])),reverse=True)
          for u,hits in ranked:
            print('WALLET',u,'matches',len(hits),'of',len(trades),'api_nonempty_windows',anydata[u],
