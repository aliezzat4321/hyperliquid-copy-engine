name: bones-explorer-probe

on:
  push:
    branches:
      - agent/free-public-wallet-identifier-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe Hyperliquid block heights
        run: |
          python - <<'PY'
          import requests
          URL = 'https://rpc.hyperliquid.xyz/explorer'
          session = requests.Session()
          for h in (600_000_000, 625_000_000, 650_000_000, 675_000_000, 700_000_000, 725_000_000, 750_000_000):
              try:
                  r = session.post(URL, json={'height': h, 'type': 'blockDetails'}, timeout=5)
                  data = r.json()
                  d = data.get('blockDetails') if isinstance(data, dict) else None
                  print('probe', h, r.status_code, None if not isinstance(d, dict) else d.get('blockTime'))
              except Exception as exc:
                  print('probe', h, 'ERROR', type(exc).__name__, str(exc)[:120])
          PY
