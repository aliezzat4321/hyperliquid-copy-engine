name: bones-explorer-probe

on:
  push:
    branches:
      - agent/free-public-wallet-identifier-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe Chainticks public Hyperliquid index
        run: |
          python - <<'PY'
          import json
          import requests

          base = 'https://huggingface.co/datasets/Chainticks/perp-data/resolve/main'
          for path in ('LATEST_DATE.txt', '_schema.json', '_manifest.json'):
              r = requests.get(f'{base}/{path}', timeout=20)
              print('FILE', path, 'status', r.status_code, 'len', len(r.content))
              r.raise_for_status()
              text = r.text
              if path == 'LATEST_DATE.txt':
                  print('LATEST_DATE', text.strip())
              elif path == '_schema.json':
                  data = r.json()
                  print('SCHEMA', json.dumps(data, sort_keys=True)[:12000])
              else:
                  data = r.json()
                  print('MANIFEST_GENERATED', data.get('generated_at'))
                  print('TRADE_LATEST_KEYS', [k for k in data.get('row_counts', {}) if 'hyperliquid_chain/trades' in k][-12:])
                  tr = data.get('time_ranges', {})
                  keys = sorted(k for k in tr if 'hyperliquid_chain/trades' in k)
                  print('TRADE_LAST_RANGES', [(k, tr[k]) for k in keys[-10:]])
          PY
