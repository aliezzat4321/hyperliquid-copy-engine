          ]
          def ts(x): return int(datetime.fromisoformat(x.replace('Z','+00:00')).timestamp()*1000)
          def post(payload):
            for i in range(7):
              r=s.post(INFO,json=payload,timeout=20)
              if r.status_code in (429,500,502,503,504):
                time.sleep(.35+i*.6); continue
              r.raise_for_status(); return r.json()
            return []
          def get(user,center):
            return post({'type':'userFillsByTime','user':user,'startTime':center-25000,'endTime':center+25000,'aggregateByTime':False})
          def match(rows,coin,center,direction,entry,exitpx,target):
            close_dir='Close Long' if direction=='LONG' else 'Close Short'
            groups=defaultdict(lambda:{'sz':D(0),'n':D(0),'pnl':D(0),'times':[]})
            for f in rows:
              if str(f.get('coin','')).upper()!=coin.upper() or str(f.get('dir','')).lower()!=close_dir.lower(): continue
              try: z=D(str(f['sz'])); px=D(str(f['px'])); cp=D(str(f.get('closedPnl') or 0)); t=int(f['time'])
              except Exception: continue
              if abs(t-center)>25000: continue
              for key in (str(f.get('oid')),'*'):
                g=groups[key]; g['sz']+=z; g['n']+=z*px; g['pnl']+=cp; g['times'].append(t)
            pnl0=(exitpx-entry)*target*(D(1) if direction=='LONG' else D(-1))
            best=None
            for key,g in groups.items():
              if g['sz']<=0: continue
              v=g['n']/g['sz']; dt=min(abs(t-center) for t in g['times'])
              sr=abs(g['sz']/target-1); pb=abs(v/exitpx-1)*D(10000)
              pr=abs(g['pnl']/pnl0-1) if pnl0 and g['pnl'] else D(999)
              cost=D(dt)/D(2000)+sr*D(8)+pb/D(5)+(pr*D(4) if pr<999 else D(8))
              rec=(cost,dt,sr,pb,pr,key,g['sz'],v,g['pnl'])
              if best is None or rec<best: best=rec
            if best is None: return None
            ok=best[1]<=25000 and best[2]<=D('.45') and best[3]<=D('35') and (best[4]<=D('1.0') or best[4]==D(999))
            return (ok,best)

          scores={u:[] for u in wallets}
          anydata={u:0 for u in wallets}
          for aid,coin,opened,closed,direction,entrys,exits,szs in trades:
            center=ts(closed); entry=D(entrys); exitpx=D(exits); target=D(szs)
            print('TRADE',aid,coin,direction,closed,'target',exitpx,target)
            for u in wallets:
