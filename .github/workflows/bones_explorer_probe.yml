name: bones-explorer-probe

on:
  push:
    branches: [agent/free-public-wallet-identifier-v1]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Reconstruct four held-out Bones episodes for leader
        run: |
          python - <<'PY'
          import time
          from datetime import datetime
          from decimal import Decimal
          import requests

          D=Decimal; INFO='https://api.hyperliquid.xyz/info'; s=requests.Session()
          user='0x565590f4d2b00b567a564f56b13f898392aef180'
          trades=[
            ('h13','2026-08-05T05:24:33.796Z','2026-08-05T06:16:34.362Z','SHORT','64380.0','64266.0','0.0104027252'),
            ('h14','2026-08-05T02:04:11.600Z','2026-08-05T02:18:20.752Z','SHORT','64467.0','64304.0','0.01'),
            ('h15','2026-08-04T23:29:22.613Z','2026-08-05T01:57:57.071Z','LONG','64157.0','64291.0','0.0094750713'),
            ('h16','2026-08-04T18:10:41.416Z','2026-08-04T23:27:57.378Z','SHORT','64299.31981009927','64184.0','0.011'),
          ]
          def ts(x): return int(datetime.fromisoformat(x.replace('Z','+00:00')).timestamp()*1000)
          def post(payload):
            for i in range(7):
              r=s.post(INFO,json=payload,timeout=20)
              if r.status_code in (429,500,502,503,504): time.sleep(.5+i); continue
              r.raise_for_status(); return r.json()
            return []
          def fills(start,end):
            out=[]; cur=start; step=20*60*1000
            while cur<=end:
              stop=min(end,cur+step-1)
              out.extend(post({'type':'userFillsByTime','user':user,'startTime':cur,'endTime':stop,'aggregateByTime':False}))
              cur=stop+1
            uniq={}
            for f in out:
              k=(f.get('tid'),f.get('oid'),f.get('time'),f.get('px'),f.get('sz'),f.get('dir'))
              uniq[k]=f
            return sorted(uniq.values(),key=lambda f:int(f.get('time',0)))
          def reconstruct(row):
            aid,opened,closed,direction,entrys,exits,szs=row
            ot,ct=ts(opened),ts(closed); entry=D(entrys); exitpx=D(exits); target=D(szs)
            fs=[f for f in fills(ot-60*60*1000,ct+20000) if str(f.get('coin','')).upper()=='BTC']
            close_name='Close Long' if direction=='LONG' else 'Close Short'
            close=[]
            for f in fs:
              if str(f.get('dir','')).lower()!=close_name.lower(): continue
              try: t=int(f['time']); px=D(str(f['px'])); z=D(str(f['sz'])); cp=D(str(f.get('closedPnl') or 0))
              except Exception: continue
              if abs(t-ct)<=20000: close.append((t,px,z,cp,f))
            if not close: return {'aid':aid,'ok':False,'reason':'no_close'}
            close_best=min(close,key=lambda x:(abs(x[0]-ct),abs(x[1]/exitpx-1)))
            names={'Open Long','Long > Long'} if direction=='LONG' else {'Open Short','Short > Short'}
            selected=[]; total=D(0); notional=D(0)
            for f in reversed(fs):
              try: t=int(f['time']); px=D(str(f['px'])); z=D(str(f['sz'])); d=str(f.get('dir',''))
              except Exception: continue
              if t>=close_best[0] or d not in names: continue
              selected.append((t,px,z,d)); total+=z; notional+=z*px
              if total>=target*D('.90'): break
            if total<=0: return {'aid':aid,'ok':False,'reason':'no_open'}
            avg=notional/total; sr=abs(total/target-1); eb=abs(avg/entry-1)*D(10000)
            cdt=abs(close_best[0]-ct); cpb=abs(close_best[1]/exitpx-1)*D(10000)
            ok=sr<=D('.35') and eb<=D('30') and cdt<=20000 and cpb<=D('35')
            return {'aid':aid,'ok':ok,'size_err':sr,'entry_bps':eb,'recon_size':total,'recon_entry':avg,
                    'open_fills':len(selected),'close_dt_ms':cdt,'close_px_bps':cpb,'close_sz':close_best[2],
                    'close_pnl':close_best[3],'first_open_ms':min(x[0] for x in selected)}
          passed=[]
          for row in trades:
            r=reconstruct(row); print('EPISODE_RESULT',r)
            if r['ok']: passed.append(r['aid'])
          print('HELDOUT_EPISODE_SUMMARY','wallet',user,'passed',len(passed),'of',len(trades),'ids',passed)
          PY
