name: bones-explorer-probe

on:
  push:
    branches:
      - agent/free-public-wallet-identifier-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect exact Bones block executions
        run: |
          python - <<'PY'
          import json
          import time
          import requests
          from decimal import Decimal

          RPC = 'https://rpc.hyperliquid.xyz/explorer'
          CENTER = 1_101_616_821
          TARGET_PX = Decimal('64773')
          TARGET_SIZE = Decimal('0.010092')
          session = requests.Session()

          def explorer(payload):
              for attempt in range(7):
                  r = session.post(RPC, json=payload, timeout=10)
                  if r.status_code == 429:
                      time.sleep(1.0 + attempt * 0.8)
                      continue
                  r.raise_for_status()
                  time.sleep(0.35)
                  return r.json()
              raise RuntimeError('explorer rate limit')

          block = explorer({'height': CENTER, 'type': 'blockDetails'})['blockDetails']
          print('BLOCK', CENTER, block['blockTime'], 'txs', len(block.get('txs', [])))

          chosen = []
          for tx in block.get('txs', []):
              if tx.get('error') is not None:
                  continue
              action = tx.get('action') or {}
              if action.get('type') != 'order':
                  continue
              for order in action.get('orders', []):
                  if order.get('a', order.get('asset')) != 0:
                      continue
                  if order.get('b', order.get('isBuy')) is not False:
                      continue
                  try:
                      size = Decimal(str(order.get('s', order.get('sz'))))
                      px = Decimal(str(order.get('p', order.get('limitPx'))))
                  except Exception:
                      continue
                  t = order.get('t') or {}
                  limit = t.get('limit') if isinstance(t, dict) else None
                  tif = limit.get('tif') if isinstance(limit, dict) else None
                  size_rel = abs(size / TARGET_SIZE - Decimal('1'))
                  price_bps = abs(px / TARGET_PX - Decimal('1')) * Decimal('10000')
                  if tif != 'Alo' or size_rel <= Decimal('0.20'):
                      chosen.append((
                          size_rel, price_bps, tif, bool(order.get('r', order.get('reduceOnly'))),
                          tx.get('user'), tx.get('hash'), size, px, order,
                      ))

          chosen.sort(key=lambda x: (x[2] == 'Alo', x[0], x[1]))
          print('CHOSEN_COUNT', len(chosen))
          seen_hashes = set()
          for row in chosen[:40]:
              print('ORDER_CANDIDATE', row)
              tx_hash = row[5]
              if not tx_hash or tx_hash in seen_hashes:
                  continue
              seen_hashes.add(tx_hash)
              try:
                  details = explorer({'type': 'txDetails', 'hash': tx_hash})
              except Exception as exc:
                  print('TXDETAIL_ERROR', tx_hash, type(exc).__name__, str(exc)[:180])
                  continue
              print('TXDETAIL', tx_hash, json.dumps(details, sort_keys=True)[:10000])
              if len(seen_hashes) >= 12:
                  break
          PY
