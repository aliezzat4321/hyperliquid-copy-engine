name: bones-explorer-probe

on:
  push:
    branches:
      - agent/free-public-wallet-identifier-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check fills mirror maximum date
        run: |
          python - <<'PY'
          import re, requests
          repo='gionuibk/hyperliquid-node-fills-by-block'
          data=requests.get(f'https://huggingface.co/api/datasets/{repo}',timeout=30).json()
          names=[x.get('rfilename','') for x in data.get('siblings',[])]
          dates=[]
          for name in names:
              m=re.search(r'(20\d{6})',name)
              if m: dates.append(m.group(1))
          print('FILES',len(names),'DATES',len(dates),'MIN',min(dates) if dates else None,'MAX',max(dates) if dates else None)
          print('LAST_FILES',sorted(names)[-20:])
          PY
