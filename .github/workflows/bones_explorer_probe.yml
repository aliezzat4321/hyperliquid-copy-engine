name: bones-explorer-probe

on:
  push:
    branches:
      - agent/free-public-wallet-identifier-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect Hyperliquid fills mirror metadata
        run: |
          python - <<'PY'
          import json
          import requests

          repo = 'gionuibk/hyperliquid-node-fills-by-block'
          urls = [
              f'https://huggingface.co/api/datasets/{repo}',
              f'https://huggingface.co/api/datasets/{repo}/parquet/default/train',
              f'https://huggingface.co/api/datasets/{repo}/tree/refs%2Fconvert%2Fparquet?recursive=true&expand=false',
          ]
          for url in urls:
              r = requests.get(url, timeout=30)
              print('URL', url, 'STATUS', r.status_code, 'LEN', len(r.content))
              print(r.text[:30000])
          PY
