name: bones-explorer-probe

on:
  push:
    branches:
      - agent/free-public-wallet-identifier-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Verify top Bones candidate with official fills
        run: |
          python - <<'PY'
          from datetime import datetime
          from decimal import Decimal
          import requests

          URL='https://api.hyperliquid.xyz/info'
          user='0x01535f0ffbf18d084366c4dc846e58bb915fdd09'
          anchors=[
            ('a1','2026-08-07T18:00:35.908+00:00','LONG','64773','0.010092'),
            ('a2','2026-08-07T14:50:01.743+00:00','SHORT','65049','0.010000'),
            ('a3','2026-08-07T14:23:08.261+00:00','LONG','64987','0.010000'),
            ('a4','2026-08-07T14:00:18.041+00:00','SHORT','64968','0.010047'),
            ('a5','2026-08-07T05:50:38.289+00:00','LONG','64330','0.009646'),
            ('a6','2026-08-07T01:45:57.811+00:00','LONG','64392','0.010000'),
            ('a7','2026-08-07T01:03:27.710+00:00','LONG','64384','0.010000'),
            ('a8','2026-08-07T00:07:22.531+00:00','LONG','64381','0.010000'),
          ]
          s=requests.Session(); total=0; strong=0
          for aid,iso,direction,pxs,szs in anchors:
              target=int(datetime.fromisoformat(iso).timestamp()*1000)
              expected='Close Long' if direction=='LONG' else 'Close Short'
              p={'type':'userFillsByTime','user':user,'startTime':target-15000,'endTime':target+15000,'aggregateByTime':True}
              r=s.post(URL,json=p,timeout=20); r.raise_for_status(); rows=r.json()
              best=None
              for f in rows:
                  if str(f.get('coin','')).upper()!='BTC': continue
                  if str(f.get('dir','')).strip().lower()!=expected.lower(): continue
                  try:
                      dt=abs(int(f['time'])-target); pbps=abs(Decimal(str(f['px']))/Decimal(pxs)-Decimal('1'))*Decimal('10000'); srel=abs(Decimal(str(f['sz']))/Decimal(szs)-Decimal('1'))
                  except Exception: continue
                  rec=(dt,pbps,srel,f)
                  if best is None or rec[:3]<best[:3]: best=rec
              if best is None:
                  print('MISS',aid,'rows',len(rows)); continue
              dt,pbps,srel,f=best; total+=1
              if dt<=7000 and pbps<=20 and srel<=Decimal('0.40'): strong+=1
              print('MATCH',aid,'dt',dt,'pbps',pbps,'srel',srel,'px',f.get('px'),'sz',f.get('sz'),'dir',f.get('dir'),'oid',f.get('oid'),'tid',f.get('tid'))
          print('SUMMARY',user,'directional_matches',total,'strong_matches',strong)
          PY
