name: bones-explorer-probe

on:
  push:
    branches:
      - agent/free-public-wallet-identifier-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Query SQD Hyperliquid fills for Bones block
        run: |
          python - <<'PY'
          import json, requests
          url='https://portal.sqd.dev/datasets/hyperliquid-fills/stream'
          payload={
            'type':'hyperliquidFills',
            'fromBlock':1101616818,
            'toBlock':1101616824,
            'fields':{
              'block':{'number':True,'timestamp':True},
              'fill':{
                'user':True,'coin':True,'px':True,'sz':True,'side':True,'time':True,
                'hash':True,'oid':True,'closedPnl':True,'crossed':True,'tid':True
              }
            },
            'fills':[{}]
          }
          r=requests.post(url,json=payload,timeout=30)
          print('STATUS',r.status_code,'LEN',len(r.content))
          print(r.text[:50000])
          r.raise_for_status()
          PY
