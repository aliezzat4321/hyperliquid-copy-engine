name: hyperliquid-safe-root-gc

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hyperliquid-safe-root-gc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperliquid-safe-root-gc
  cancel-in-progress: false

jobs:
  safe-root-gc:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - name: Reclaim only disposable Hyperliquid control-plane storage
        shell: bash
        run: |
          set -euo pipefail
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'TRADING_EVIDENCE_MUTATION=NO'
          echo 'MARKET_TAPE_MUTATION=NO'
          echo 'PRODUCTION_STATE_MUTATION=NO'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_TOUCHED=NO'

          echo '=== BEFORE ==='
          df -h /
          sudo du -sh /var/lib/hyperliquid-ai-team/agents/codex/worktrees 2>/dev/null || true
          sudo du -sh /var/lib/hyperliquid-ai-team/agents/claude/worktrees 2>/dev/null || true
          sudo journalctl --disk-usage || true

          # Permanently bound systemd journal growth on the root filesystem.
          sudo install -d -m 0755 /etc/systemd/journald.conf.d
          cat <<'EOF' | sudo tee /etc/systemd/journald.conf.d/90-hyperliquid-root-cap.conf >/dev/null
          [Journal]
          SystemMaxUse=512M
          RuntimeMaxUse=256M
          MaxRetentionSec=7day
          EOF
          sudo systemctl restart systemd-journald
          sudo journalctl --rotate
          sudo journalctl --vacuum-size=512M

          # Remove only stale, inactive AI-team worktree directories older than 7 days.
          # Agent homes, runtime ledger/runs, Hyperliquid executor state, and market data are excluded.
          sudo python3 - <<'PY'
          import os
          import shutil
          import time
          from pathlib import Path

          roots = [
              Path('/var/lib/hyperliquid-ai-team/agents/codex/worktrees'),
              Path('/var/lib/hyperliquid-ai-team/agents/claude/worktrees'),
          ]
          cutoff = time.time() - 7 * 24 * 3600

          proc_cwds = []
          proc_cmdlines = []
          proc = Path('/proc')
          for entry in proc.iterdir():
              if not entry.name.isdigit():
                  continue
              try:
                  cwd = os.path.realpath(entry / 'cwd')
                  proc_cwds.append(cwd)
              except OSError:
                  pass
              try:
                  raw = (entry / 'cmdline').read_bytes().replace(b'\0', b' ')
                  proc_cmdlines.append(raw.decode('utf-8', 'ignore'))
              except OSError:
                  pass

          def is_active(path: Path) -> bool:
              p = str(path)
              prefix = p + os.sep
              if any(c == p or c.startswith(prefix) for c in proc_cwds):
                  return True
              if any(p in cmd for cmd in proc_cmdlines):
                  return True
              return False

          def newest_mtime(path: Path) -> float:
              newest = path.stat().st_mtime
              for base, dirs, files in os.walk(path, followlinks=False):
                  for name in dirs + files:
                      q = Path(base) / name
                      try:
                          newest = max(newest, q.lstat().st_mtime)
                      except OSError:
                          pass
              return newest

          removed = []
          kept_active = []
          kept_recent = []
          for root in roots:
              if not root.is_dir():
                  continue
              for child in sorted(root.iterdir()):
                  if not child.is_dir() or child.is_symlink():
                      continue
                  if is_active(child):
                      kept_active.append(str(child))
                      continue
                  try:
                      newest = newest_mtime(child)
                  except OSError:
                      continue
                  if newest >= cutoff:
                      kept_recent.append(str(child))
                      continue
                  size = 0
                  for base, _, files in os.walk(child, followlinks=False):
                      for name in files:
                          try:
                              size += (Path(base) / name).lstat().st_size
                          except OSError:
                              pass
                  shutil.rmtree(child)
                  removed.append((str(child), size))

          print(f'STALE_WORKTREES_REMOVED={len(removed)}')
          print(f'STALE_WORKTREE_BYTES_REMOVED={sum(x[1] for x in removed)}')
          print(f'ACTIVE_WORKTREES_PRESERVED={len(kept_active)}')
          print(f'RECENT_WORKTREES_PRESERVED={len(kept_recent)}')
          for path, size in sorted(removed, key=lambda x: x[1], reverse=True)[:30]:
              print(f'REMOVED {size} {path}')
          PY

          # Safe OS/runner caches and diagnostics only.
          sudo apt-get clean || true
          sudo find /var/crash -mindepth 1 -maxdepth 1 -type f -delete 2>/dev/null || true
          sudo find /home/hyperliquid-runner/_diag -type f -mtime +14 -delete 2>/dev/null || true
          sudo find /home/hyperliquid-runner/_work/_temp -mindepth 1 -mtime +2 -delete 2>/dev/null || true

          echo '=== AFTER ==='
          df -h /
          sudo du -sh /var/lib/hyperliquid-ai-team/agents/codex/worktrees 2>/dev/null || true
          sudo du -sh /var/lib/hyperliquid-ai-team/agents/claude/worktrees 2>/dev/null || true
          sudo journalctl --disk-usage || true

          # Keep a healthy root reserve; fail loudly if the root remains critically constrained.
          avail_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          echo "ROOT_AVAILABLE_KB=$avail_kb"
          test "$avail_kb" -ge 3145728

          echo 'HYPERLIQUID_MARKET_DATA_TOUCHED=NO'
          echo 'HYPERLIQUID_TRADING_EVIDENCE_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
