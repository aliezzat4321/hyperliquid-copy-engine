name: p0-runtime-handoff-budget-repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-runtime-handoff-budget-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make runtime handoff deterministically budget-safe
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ai_team_runtime_ledger.py')
          s = p.read_text()

          old = '''            return {k: task.get(k) for k in keep if task.get(k) not in (None, "", [])}\n\n        payload["codex"] = compact_task(payload["codex"])\n        payload["claude"] = compact_task(payload["claude"])\n        if isinstance(payload.get("runtime"), dict):\n            payload["runtime"] = {\n                "codex": compact_task(payload["runtime"].get("codex")),\n                "claude": compact_task(payload["runtime"].get("claude")),\n            }\n        payload["latest_review"] = compact_task(payload["latest_review"])\n        raw = json.dumps(payload, separators=(",", ":"), sort_keys=True)\n        while len(raw.encode("utf-8")) > 3300 and payload["last_5_material_events"]:\n            payload["last_5_material_events"] = payload["last_5_material_events"][1:]\n            raw = json.dumps(payload, separators=(",", ":"), sort_keys=True)\n        if len(raw.encode("utf-8")) > 3300:\n            payload["active_p0_p1"] = payload["active_p0_p1"][:3]\n            raw = json.dumps(payload, separators=(",", ":"), sort_keys=True)\n        if len(raw.encode("utf-8")) > 3500:\n            raise RuntimeError("runtime handoff exceeded compact checkpoint budget")\n'''
          new = '''            result = {k: task.get(k) for k in keep if task.get(k) not in (None, "", [])}\n            # Free-form diagnostics must never be able to suppress the canonical heartbeat.\n            for key, limit in (("blocker", 320), ("current_step", 220), ("next_step", 260)):\n                if key in result:\n                    result[key] = bounded_redacted(str(result[key]), limit)\n            return result\n\n        payload["codex"] = compact_task(payload["codex"])\n        payload["claude"] = compact_task(payload["claude"])\n        if isinstance(payload.get("runtime"), dict):\n            payload["runtime"] = {\n                "codex": compact_task(payload["runtime"].get("codex")),\n                "claude": compact_task(payload["runtime"].get("claude")),\n            }\n        payload["latest_review"] = compact_task(payload["latest_review"])\n        recovery = payload.get("recovery")\n        if isinstance(recovery, dict):\n            recovery = dict(recovery)\n            recovery["active_assignment"] = compact_task(recovery.get("active_assignment"))\n            payload["recovery"] = recovery\n        if payload.get("pending_owner_action"):\n            payload["pending_owner_action"] = bounded_redacted(\n                str(payload["pending_owner_action"]), 320\n            )\n\n        def encoded() -> str:\n            return json.dumps(payload, separators=(",", ":"), sort_keys=True)\n\n        raw = encoded()\n        while len(raw.encode("utf-8")) > 3000 and payload["last_5_material_events"]:\n            payload["last_5_material_events"] = payload["last_5_material_events"][1:]\n            raw = encoded()\n        if len(raw.encode("utf-8")) > 3000:\n            payload["active_p0_p1"] = payload["active_p0_p1"][:3]\n            raw = encoded()\n        # runtime duplicates assignment state; discard it before sacrificing canonical\n        # queue/recovery information.\n        if len(raw.encode("utf-8")) > 3200:\n            payload.pop("runtime", None)\n            raw = encoded()\n        if len(raw.encode("utf-8")) > 3200:\n            payload.pop("latest_review", None)\n            raw = encoded()\n        if len(raw.encode("utf-8")) > 3300:\n            rec = payload.get("recovery")\n            payload["recovery"] = {\n                "blocked_count_by_class": rec.get("blocked_count_by_class", {})\n                if isinstance(rec, dict) else {},\n                "oldest_blocked_age_seconds": rec.get("oldest_blocked_age_seconds")\n                if isinstance(rec, dict) else None,\n                "active_assignment": compact_task(rec.get("active_assignment"))\n                if isinstance(rec, dict) else None,\n                "unrelated_work_continuing": rec.get("unrelated_work_continuing")\n                if isinstance(rec, dict) else None,\n            }\n            raw = encoded()\n        if len(raw.encode("utf-8")) > 3500:\n            # Last-resort fail-safe is still semantically useful and, critically, keeps\n            # heartbeat/freshness alive rather than failing the entire status publisher.\n            payload = {\n                "protocol": "AI_TEAM_RUNTIME_STATUS_V1",\n                "repository": self.repository,\n                "main_head": main_head,\n                "live_trading": "NO",\n                "polymarket_scope": "DENIED",\n                "active_p0_p1": active_priorities[:2],\n                "codex": compact_task(current["assignment"].get("codex")),\n                "claude": compact_task(current["assignment"].get("claude")),\n                "pending_owner_action": bounded_redacted(\n                    str(pending_owner_action), 240\n                ) if pending_owner_action else None,\n                "recovery": {\n                    "blocked_count_by_class": current.get("recovery", {}).get(\n                        "blocked_count_by_class", {}\n                    ),\n                    "unrelated_work_continuing": current.get("recovery", {}).get(\n                        "unrelated_work_continuing"\n                    ),\n                },\n                "checkpoint_compacted": True,\n            }\n            raw = json.dumps(payload, separators=(",", ":"), sort_keys=True)\n        if len(raw.encode("utf-8")) > 3900:\n            raise RuntimeError("minimal runtime handoff unexpectedly exceeded hard budget")\n'''
          if old not in s:
              raise SystemExit('budget patch refused: expected block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 -m py_compile scripts/ai_team_runtime_ledger.py scripts/ai_team_orchestrator.py
          git diff --check

      - name: Commit permanent budget repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Team Supervisor'
          git config user.email 'ai-team@localhost'
          git add scripts/ai_team_runtime_ledger.py
          git commit -m 'P0 #238: guarantee compact runtime heartbeat publication'
          git push origin HEAD:main

      - name: Deploy and repair host supervisor sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 0644 scripts/ai_team_runtime_ledger.py /opt/hyperliquid-ai-team/scripts/ai_team_runtime_ledger.py
          sudo install -m 0755 scripts/ai_team_orchestrator.py /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          sudo python3 -m py_compile /opt/hyperliquid-ai-team/scripts/ai_team_runtime_ledger.py /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          sudo sed -i 's/^ProtectHome=yes$/ProtectHome=read-only/' /etc/systemd/system/hyperliquid-ai-external-supervisor.service || true
          sudo systemctl daemon-reload
          sudo systemctl restart hyperliquid-ai-external-supervisor.timer
          sudo systemctl start hyperliquid-ai-external-supervisor.service
          sleep 3
          sudo systemctl is-active --quiet hyperliquid-ai-external-supervisor.timer
          test -s /var/lib/hyperliquid-ai-team/external-supervisor/last_checkpoint_at
          sudo tail -n 80 /var/lib/hyperliquid-ai-team/external-supervisor/supervisor.log

      - name: Prove two independent checkpoint publications
        shell: bash
        run: |
          set -euo pipefail
          a="$(cat /var/lib/hyperliquid-ai-team/external-supervisor/last_checkpoint_at)"
          sleep 2
          sudo systemctl start hyperliquid-ai-external-supervisor.service
          b="$(cat /var/lib/hyperliquid-ai-team/external-supervisor/last_checkpoint_at)"
          printf 'first=%s\nsecond=%s\n' "$a" "$b"
          test "$b" \> "$a"
