name: dispatch-reviewed-hyperliquid-reclaim-once

on:
  push:
    branches:
      - codex/109-dispatch-reviewed-reclaim
    paths:
      - ".github/workflows/hyperliquid-emergency-storage-reclaim.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-once:
    runs-on: ubuntu-latest
    steps:
      - name: Recovery already completed
        run: |
          echo 'RECOVERY_COMPLETED_RUN=33435055444'
          echo 'NO_FURTHER_DISPATCH=YES'
