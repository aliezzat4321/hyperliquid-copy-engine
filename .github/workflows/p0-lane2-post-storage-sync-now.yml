name: p0-lane2-post-storage-sync-now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-lane2-post-storage-sync-now.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-lane2-post-storage-sync-now
  cancel-in-progress: false

jobs:
  lane2-sync:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify cleaned storage and current identities
        shell: bash
        run: |
          set -euo pipefail
          used="$(df -P /mnt/HC_Volume_106576526 | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
          echo "DATA_VOLUME_USED_PCT=$used"
          test "$used" -lt 80
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/var/lib/hyperliquid-copy-engine/invo/identified_wallets.json')
          d=json.loads(p.read_text())
          print('VERIFIED_COUNT', d.get('verified_count'))
          print('QUARANTINED_COUNT', d.get('quarantined_identity_count'))
          assert d.get('verified_count',0) > 0
          assert d.get('safety',{}).get('auto_trading_promotion') is False
          PY

      - name: Re-run verified-shadow sync after ENOSPC recovery
        shell: bash
        run: |
          set -euo pipefail
          before="$(date -u +%s)"
          sudo systemctl reset-failed hyperliquid-invo-verified-shadow-sync.service || true
          sudo systemctl start hyperliquid-invo-verified-shadow-sync.service
          state="$(systemctl show hyperliquid-invo-verified-shadow-sync.service -p Result --value || true)"
          active="$(systemctl is-active hyperliquid-invo-verified-shadow-sync.service || true)"
          failed="$(systemctl is-failed hyperliquid-invo-verified-shadow-sync.service || true)"
          echo "LANE2_SYNC_RESULT=$state"
          echo "LANE2_SYNC_ACTIVE=$active"
          echo "LANE2_SYNC_FAILED=$failed"
          sudo systemctl status hyperliquid-invo-verified-shadow-sync.service --no-pager -l || true
          test "$failed" != failed
          echo "LANE2_SYNC_STARTED_AFTER_EPOCH=$before"

      - name: Prove post-cleanup Lane 2 persistence writes
        shell: bash
        run: |
          set -euo pipefail
          echo '=== newest Lane2 evidence ==='
          sudo find /var/lib/hyperliquid-copy-engine /root/hyperliquid-audit -maxdepth 8 -type f \
            \( -iname '*verified*' -o -iname '*registry*' -o -iname '*shadow*' -o -iname '*decision*' -o -iname '*execution*' -o -iname '*position*' -o -iname '*pnl*' \) \
            -printf '%T@ %TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' 2>/dev/null | sort -nr | head -n 120
          echo REAL_TRADING_ENABLED=NO
          echo POLYMARKET_MUTATION=NO
