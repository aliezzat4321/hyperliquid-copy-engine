name: p0-277-runtime-startup-diagnostic

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17b5f88719012cf5d0da1446dc2c6dc5a734ad94
          fetch-depth: 1
          persist-credentials: false
      - name: Diagnose exact installed runtime
        shell: bash
        run: |
          set -u
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(git rev-parse HEAD)" = "17b5f88719012cf5d0da1446dc2c6dc5a734ad94"
          echo '=== INSTALLED SOURCE ==='
          python3 -m py_compile /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py || true
          cmp -s scripts/ai_team_orchestrator.py /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py; echo "SOURCE_MATCH_RC=$?"
          echo '=== STATUS BEFORE START ==='
          systemctl status hyperliquid-ai-team-orchestrator.service --no-pager -l || true
          echo '=== START ==='
          systemctl start hyperliquid-ai-team-orchestrator.service
          START_RC=$?
          echo "START_RC=$START_RC"
          echo '=== STATUS AFTER START ==='
          systemctl status hyperliquid-ai-team-orchestrator.service --no-pager -l || true
          echo '=== JOURNAL ==='
          journalctl -u hyperliquid-ai-team-orchestrator.service -n 120 --no-pager -l || true
          echo '=== RUNTIME STATUS ==='
          hl-ai-team-status || true
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
          exit "$START_RC"
