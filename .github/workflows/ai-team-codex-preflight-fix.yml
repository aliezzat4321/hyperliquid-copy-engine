name: p0-277-runtime-ledger-proof

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd21b0e88873ae88d9ed92aaa169e2c65d3ec413
          fetch-depth: 1
          persist-credentials: false
      - name: Prove deployed runtime and retired closed assignment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(git rev-parse HEAD)" = "dd21b0e88873ae88d9ed92aaa169e2c65d3ec413"
          python3 -m py_compile /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          systemctl is-enabled hyperliquid-ai-team-orchestrator.timer
          systemctl is-active hyperliquid-ai-team-orchestrator.timer
          hl-ai-team-status
          python3 - <<'PY'
          import json, sqlite3
          from pathlib import Path

          db = Path('/var/lib/hyperliquid-ai-team/orchestrator/ledger.sqlite3')
          if not db.exists():
              raise SystemExit('LEDGER_PROOF=FAIL ledger_missing')
          con = sqlite3.connect(f'file:{db}?mode=ro', uri=True)
          con.row_factory = sqlite3.Row
          task_id = '17d2d80ed1084886'
          row = con.execute(
              'SELECT id,issue_number,task_type,status,lifecycle_phase,last_error,'
              'retry_at,systemd_unit,failure_class,updated_at FROM tasks WHERE id=?',
              (task_id,),
          ).fetchone()
          if row is None:
              raise SystemExit('LEDGER_PROOF=FAIL target_assignment_missing')
          out = dict(row)
          print('CLOSED_ASSIGNMENT_JSON=' + json.dumps(out, sort_keys=True))
          assert out['issue_number'] == 146
          assert out['status'] == 'DONE'
          assert out['lifecycle_phase'] == 'OBSOLETE'
          assert out['last_error'] == 'OBSOLETE_CLOSED_ISSUE'
          assert out['retry_at'] is None
          assert out['systemd_unit'] is None
          assert out['failure_class'] is None
          active = {'PENDING','RETRY','WAITING_RATE_LIMIT','WAITING_CI','WAITING_EVIDENCE_WINDOW','RUNNING'}
          assert out['status'] not in active
          n = con.execute(
              "SELECT COUNT(*) AS n FROM tasks WHERE issue_number=146 "
              "AND status IN ('PENDING','RETRY','WAITING_RATE_LIMIT','WAITING_CI','WAITING_EVIDENCE_WINDOW','RUNNING')"
          ).fetchone()['n']
          print(f'ISSUE_146_ACTIVE_TASKS={n}')
          assert n == 0
          print('LEDGER_PROOF=PASS')
          print('REAL_TRADING_CHANGE=NO')
          print('POLYMARKET_TOUCHED=NO')
          PY
