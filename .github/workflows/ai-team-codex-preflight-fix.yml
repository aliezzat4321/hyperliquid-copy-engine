name: p0-238-lane23-runtime-restore

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: read
  issues: read

concurrency:
  group: p0-238-lane23-runtime-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Sync production source and assert safety
        shell: bash
        run: |
          set -euo pipefail
          test "${REAL_TRADING_ENABLED:-NO}" != YES
          sudo git -C /root/hyperliquid-copy-engine fetch origin main
          sudo git -C /root/hyperliquid-copy-engine reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$(sudo git -C /root/hyperliquid-copy-engine rev-parse HEAD)"
          echo "MAIN_HEAD=$(git rev-parse HEAD)"
          echo REAL_TRADING_ENABLED=NO
          echo POLYMARKET_TOUCHED=NO

      - name: Repair and prove Lane 2 identity-to-shadow handoff
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          for unit in hyperliquid-invo-wallet-identifier.service hyperliquid-invo-verified-shadow-sync.service; do
            grep -q 'REAL_TRADING_ENABLED=NO' "deploy/systemd/$unit"
            sudo install -m 0644 "deploy/systemd/$unit" "/etc/systemd/system/$unit"
          done
          sudo systemctl daemon-reload
          sudo systemctl reset-failed \
            hyperliquid-external-coverage.service \
            hyperliquid-external-resolver.service \
            hyperliquid-invo-wallet-identifier.service \
            hyperliquid-invo-verified-shadow-sync.service || true
          sudo systemctl start hyperliquid-external-coverage.service
          sudo systemctl start hyperliquid-external-resolver.service
          sudo systemctl start hyperliquid-invo-wallet-identifier.service
          test "$(systemctl is-failed hyperliquid-invo-wallet-identifier.service || true)" != failed
          sudo systemctl start hyperliquid-invo-verified-shadow-sync.service
          test "$(systemctl is-failed hyperliquid-invo-verified-shadow-sync.service || true)" != failed
          identities=/var/lib/hyperliquid-copy-engine/invo/identified_wallets.json
          sudo test -s "$identities"
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/var/lib/hyperliquid-copy-engine/invo/identified_wallets.json').read_text())
          print('LANE2_PUBLICATION', {k:p.get(k) for k in ('verified_count','quarantined_identity_count','identity_conflicts')})
          if p.get('verified_count',0) < 1:
              raise SystemExit('Lane2 has no unaffected verified identity')
          if p.get('safety',{}).get('auto_trading_promotion') is not False:
              raise SystemExit('Lane2 live-safety flag invalid')
          conflicts=p.get('identity_conflicts') or []
          if conflicts and not any(c.get('status')=='QUARANTINED_CONFLICTING_VERIFIED_PROOFS' for c in conflicts):
              raise SystemExit('Lane2 conflicts exist without explicit quarantine')
          PY
          echo '=== LANE2 RECENT SHADOW SURFACES ==='
          sudo find /var/lib/hyperliquid-copy-engine /mnt/HC_Volume_106576526/hyperliquid/shadow -maxdepth 6 -type f \
            \( -iname '*verified*' -o -iname '*shadow*' -o -iname '*decision*' -o -iname '*execution*' -o -iname '*position*' -o -iname '*pnl*' \) \
            -printf '%T@ %TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' 2>/dev/null | sort -nr | head -n 80 || true
          echo LANE2_HANDOFF=PASS

      - name: Repair and prove Lane 3 direct notification collector
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          if ! curl -fsS --max-time 4 http://127.0.0.1:8787/health >/tmp/lane3-health.json 2>/dev/null; then
            sudo bash scripts/deploy_invo_notification_executor_self_hosted.sh
          fi
          sudo systemctl restart hyperliquid-invo-notification-executor.service
          sleep 8
          health="$(curl -fsS --max-time 4 http://127.0.0.1:8787/health)"
          echo "LANE3_HEALTH=$health"
          echo "$health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["initialized"] and not d["live"]'
          sudo systemctl is-active --quiet hyperliquid-invo-notification-executor.service
          audit=/var/lib/hyperliquid-copy-engine/invo-notification-executor/audit.jsonl
          population=/var/lib/hyperliquid-copy-engine/invo-notification-executor/trader-population.json
          sudo test -s "$population"
          echo '=== LANE3 POPULATION ==='
          sudo tail -c 12000 "$population" || true
          echo
          echo '=== LANE3 AUDIT TAIL ==='
          if sudo test -f "$audit"; then sudo tail -n 120 "$audit"; fi
          echo '=== LANE3 RECENT SHADOW SURFACES ==='
          sudo find /var/lib/hyperliquid-copy-engine/invo-notification-executor -maxdepth 6 -type f \
            -printf '%T@ %TY-%Tm-%TdT%TH:%TM:%TSZ %s %p\n' 2>/dev/null | sort -nr | head -n 80 || true
          echo LANE3_COLLECTOR=PASS

      - name: Cross-lane safety and current runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${REAL_TRADING_ENABLED:-NO}" != YES
          echo REAL_TRADING_ENABLED=NO
          echo POLYMARKET_TOUCHED=NO
          sudo -H /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py --status || true
