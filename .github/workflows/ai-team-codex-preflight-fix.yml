name: p0-238-lane1-runtime-restore-bounded

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: read
  issues: read

concurrency:
  group: p0-238-lane1-runtime-restore
  cancel-in-progress: true

jobs:
  restore:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Sync current main and assert shadow-only safety
        shell: bash
        run: |
          set -euo pipefail
          test "${REAL_TRADING_ENABLED:-NO}" != YES
          sudo git -C /root/hyperliquid-copy-engine fetch origin main
          sudo git -C /root/hyperliquid-copy-engine reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$(sudo git -C /root/hyperliquid-copy-engine rev-parse HEAD)"
          cd /root/hyperliquid-copy-engine
          for unit in \
            hyperliquid-shadow-validation.service \
            hyperliquid-wide-trade-watch-live.service \
            hyperliquid-wide-fill-enrichment-live.service \
            hyperliquid-universe-scout.service \
            hyperliquid-profitability.service \
            hyperliquid-wallet-research.service \
            hyperliquid-selective-shadow.service \
            hyperliquid-wide-live-scoreboard.service; do
            grep -q 'REAL_TRADING_ENABLED=NO' "deploy/systemd/$unit"
          done
          echo "MAIN_HEAD=$(git rev-parse HEAD)"
          echo REAL_TRADING_ENABLED=NO
          echo POLYMARKET_TOUCHED=NO

      - name: Restore persistent Lane 1 producers without blocking on scorer lock
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          units=(
            hyperliquid-shadow-validation.service
            hyperliquid-wide-trade-watch-live.service
            hyperliquid-wide-fill-enrichment-live.service
            hyperliquid-universe-scout.service
            hyperliquid-universe-scout.timer
            hyperliquid-profitability.service
            hyperliquid-profitability.timer
            hyperliquid-wallet-research.service
            hyperliquid-wallet-research.timer
            hyperliquid-selective-shadow.service
            hyperliquid-selective-shadow.timer
            hyperliquid-wide-live-scoreboard.service
            hyperliquid-wide-live-scoreboard.timer
          )
          for unit in "${units[@]}"; do
            sudo install -m 0644 "deploy/systemd/$unit" "/etc/systemd/system/$unit"
          done
          sudo systemctl daemon-reload
          sudo systemctl reset-failed hyperliquid-shadow-validation.service hyperliquid-wide-trade-watch-live.service hyperliquid-wide-fill-enrichment-live.service hyperliquid-universe-scout.service hyperliquid-selective-shadow.service || true
          sudo systemctl enable --now hyperliquid-shadow-validation.service hyperliquid-wide-trade-watch-live.service hyperliquid-wide-fill-enrichment-live.service
          sudo systemctl enable --now hyperliquid-universe-scout.timer hyperliquid-profitability.timer hyperliquid-wallet-research.timer hyperliquid-selective-shadow.timer hyperliquid-wide-live-scoreboard.timer
          timeout 120 sudo systemctl start hyperliquid-universe-scout.service
          sudo systemctl start --no-block hyperliquid-selective-shadow.service
          echo LANE1_RESTORE_DISPATCHED=PASS

      - name: Prove persistent liveness and upstream freshness
        shell: bash
        run: |
          set -euo pipefail
          for unit in hyperliquid-shadow-validation.service hyperliquid-wide-trade-watch-live.service hyperliquid-wide-fill-enrichment-live.service; do
            active="$(systemctl is-active "$unit" || true)"
            failed="$(systemctl is-failed "$unit" || true)"
            echo "DAEMON $unit active=$active failed=$failed"
            test "$active" = active
            test "$failed" != failed
          done
          for timer in hyperliquid-universe-scout.timer hyperliquid-profitability.timer hyperliquid-wallet-research.timer hyperliquid-selective-shadow.timer hyperliquid-wide-live-scoreboard.timer; do
            enabled="$(systemctl is-enabled "$timer" || true)"
            active="$(systemctl is-active "$timer" || true)"
            echo "TIMER $timer enabled=$enabled active=$active"
            test "$enabled" = enabled
            test "$active" = active
          done
          echo '=== TIMER SCHEDULE ==='
          systemctl list-timers --all --no-pager | grep -E 'hyperliquid-(universe-scout|profitability|wallet-research|selective-shadow|wide-live-scoreboard)' || true
          echo '=== ONESHOT STATES ==='
          for svc in hyperliquid-universe-scout.service hyperliquid-selective-shadow.service; do
            systemctl show "$svc" -p Type -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
            test "$(systemctl is-failed "$svc" || true)" != failed
          done
          now="$(date +%s)"
          for f in /mnt/HC_Volume_106576526/hyperliquid/discovery/universe_state.json /mnt/HC_Volume_106576526/hyperliquid/discovery/universe_events.json /mnt/HC_Volume_106576526/hyperliquid/shadow/wallets.json; do
            sudo test -s "$f"
            m="$(sudo stat -c %Y "$f")"
            age=$((now-m))
            echo "FRESHNESS path=$f age_seconds=$age size=$(sudo stat -c %s "$f")"
            test "$age" -lt 1800
          done
          echo LANE1_PERSISTENT_LIVENESS=PASS

      - name: Prove challenger-to-prospective handoff snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          sudo -H .venv/bin/python scripts/prospective_champion_lane.py
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('/root/hyperliquid-audit/funnel/challenger_queue.json').read_text())
          r=json.loads(Path('/root/hyperliquid-audit/prospective-champions/report.json').read_text())
          print('LANE1_COUNTS', q.get('counts'))
          print('LANE1_REPORT', {k:r.get(k) for k in ('challenger_count','prospective_shadow_count','approved_count','age_hours','real_trading')})
          if q.get('real_trading') is not False or r.get('real_trading') is not False:
              raise SystemExit('Lane1 safety flag invalid')
          if q.get('counts',{}).get('challenger',0) < 1:
              raise SystemExit('Lane1 has no challenger')
          PY
          echo LANE1_HANDOFF_SNAPSHOT=PASS

      - name: Final safety proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${REAL_TRADING_ENABLED:-NO}" != YES
          echo REAL_TRADING_ENABLED=NO
          echo POLYMARKET_TOUCHED=NO
