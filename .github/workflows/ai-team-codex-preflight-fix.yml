name: p0-285-refresh-lane-independence

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: write

concurrency:
  group: p0-285-refresh-lane-independence
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manager/238-lane-wrapper-independence
          fetch-depth: 0
          persist-credentials: true
      - name: Rebase reviewed lane-independence change onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ai-team-runtime-repair'
          git config user.email 'ai-team-runtime-repair@users.noreply.github.com'
          git fetch origin main manager/238-lane-wrapper-independence
          before="$(git rev-parse HEAD)"
          echo "BEFORE_SHA=$before"
          if ! git rebase origin/main; then
            echo 'REBASE_CONFLICT=YES'
            git status --short
            git rebase --abort || true
            exit 1
          fi
          after="$(git rev-parse HEAD)"
          echo "AFTER_SHA=$after"
          git diff --check origin/main...HEAD
          git push --force-with-lease origin HEAD:manager/238-lane-wrapper-independence
          echo REAL_TRADING_ENABLED=NO
          echo POLYMARKET_TOUCHED=NO
