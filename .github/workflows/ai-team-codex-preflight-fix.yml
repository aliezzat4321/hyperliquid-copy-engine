name: p0-90-hlcopy-offline-cluster-readonly-trace

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: read

concurrency:
  group: p0-90-hlcopy-offline-cluster-readonly-trace
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Sync canonical main source only
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          git fetch origin main
          git reset --hard origin/main
          echo "MAIN_SHA=$(git rev-parse HEAD)"

      - name: Trace Hyperliquid hlcopy cluster without starting or mutating it
        shell: bash
        run: |
          set -euo pipefail
          echo '========== HLCOPY CLUSTER STATUS =========='
          pg_lsclusters 2>/dev/null | grep -E '(^Ver|hlcopy)' || true
          pg_isready -h 127.0.0.1 -p 5433 || true
          systemctl status postgresql@14-hlcopy.service --no-pager -l 2>/dev/null || true
          echo '========== HLCOPY LIFECYCLE LOG =========='
          tail -n 250 /var/log/postgresql/postgresql-14-hlcopy.log 2>/dev/null || true
          echo '========== HLCOPY PATH REFERENCES IN SYSTEMD =========='
          grep -RIlE 'hlcopy|5433|HC_Volume_106576526/hyperliquid/postgresql' \
            /etc/systemd/system /lib/systemd/system 2>/dev/null | sort | head -n 100 || true
          echo '========== REPO REFERENCES =========='
          cd /root/hyperliquid-copy-engine
          grep -RInE '5433|postgresql/14/hlcopy|postgresql@14-hlcopy|RESEARCH_DATABASE_URL' \
            --exclude-dir=.git --exclude='*.env' . 2>/dev/null | head -n 250 || true
          echo '========== HLCOPY CONFIG (NON-SECRET KEYS ONLY) =========='
          grep -E '^[[:space:]]*(port|data_directory|archive_mode|wal_level|max_wal_size|min_wal_size|shared_buffers)[[:space:]]*=' \
            /etc/postgresql/14/hlcopy/postgresql.conf 2>/dev/null || true
          echo 'READ_ONLY_NO_MUTATION=YES'
          echo 'REAL_TRADING_ENABLED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
