name: p0-277-emergency-reviewed-deploy

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17b5f88719012cf5d0da1446dc2c6dc5a734ad94
          fetch-depth: 1
          persist-credentials: false

      - name: Assert reviewed merge and hard boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          test "$(git rev-parse HEAD)" = "17b5f88719012cf5d0da1446dc2c6dc5a734ad94"
          test "$(id -u)" = 0
          python3 -m py_compile scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py
          ! grep -RE 'REAL_TRADING_ENABLED[[:space:]]*=[[:space:]]*(YES|TRUE|1)|LIVE_TRADING_ENABLED[[:space:]]*=[[:space:]]*(YES|TRUE|1)' scripts config deploy/systemd
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'REAL_TRADING_CHANGE=NO'

      - name: Install exact merged source without obsolete runtime hotfix
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_ai_team_orchestrator.sh
          python3 -m py_compile /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          cmp -s scripts/ai_team_orchestrator.py /opt/hyperliquid-ai-team/scripts/ai_team_orchestrator.py
          systemctl start hyperliquid-ai-team-orchestrator.service
          systemctl is-enabled hyperliquid-ai-team-orchestrator.timer
          hl-ai-team-status
          echo 'DEPLOYED_MAIN_SHA=17b5f88719012cf5d0da1446dc2c6dc5a734ad94'
          echo 'POLYMARKET_TOUCHED=NO'
          echo 'REAL_TRADING_TOUCHED=NO'
