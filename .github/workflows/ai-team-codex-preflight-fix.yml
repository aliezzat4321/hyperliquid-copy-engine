name: p0-90-postgres-logical-audit-readonly

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: read

concurrency:
  group: p0-90-postgres-logical-audit-readonly
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Sync canonical main source only
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          git fetch origin main
          git reset --hard origin/main
          echo "MAIN_SHA=$(git rev-parse HEAD)"

      - name: Read-only local PostgreSQL logical attribution
        shell: bash
        run: |
          set -euo pipefail
          cd /root/hyperliquid-copy-engine
          echo '========== LOCAL POSTGRESQL DATABASES =========='
          runuser -u postgres -- psql -d postgres -X -Atqc \
            "SELECT datname FROM pg_database WHERE datallowconn ORDER BY datname;"
          echo '========== HLCOPY LOGICAL STORAGE =========='
          runuser -u postgres -- psql -d hlcopy -X -v ON_ERROR_STOP=1 \
            -f scripts/postgres_storage_audit.sql
          echo 'READ_ONLY_NO_MUTATION=YES'
          echo 'REAL_TRADING_ENABLED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
