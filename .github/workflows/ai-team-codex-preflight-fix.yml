name: p0-238-supervisor-python310-v2

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manager/238-external-supervisor
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install focused test tools only
        run: |
          python -m pip install -U pip
          python -m pip install pytest ruff
      - name: Apply Python 3.10 compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "23411b89bb93b78f50de2cc6c23fd97ac76e1f3f"
          python - <<'PY'
          from pathlib import Path

          src = Path('scripts/ai_team_external_supervisor.py')
          text = src.read_text()
          anchor = 'from typing import Any\n\n'
          if anchor not in text:
              raise SystemExit('typing import anchor missing')
          text = text.replace(
              anchor,
              anchor + 'UTC = dt.timezone.utc  # noqa: UP017 -- production VM is Python 3.10\n\n',
              1,
          )
          if 'dt.UTC' not in text:
              raise SystemExit('expected dt.UTC usages missing')
          src.write_text(text.replace('dt.UTC', 'UTC'))

          tests = Path('tests/test_ai_team_external_supervisor.py')
          t = tests.read_text()
          if 'dt.UTC' not in t:
              raise SystemExit('expected test dt.UTC usages missing')
          tests.write_text(t.replace('dt.UTC', 'sup.UTC'))
          PY
      - name: Validate on production Python version
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m py_compile scripts/ai_team_external_supervisor.py
          pytest tests/test_ai_team_external_supervisor.py -q
          ruff check scripts/ai_team_external_supervisor.py tests/test_ai_team_external_supervisor.py
          ruff format --check scripts/ai_team_external_supervisor.py tests/test_ai_team_external_supervisor.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = $'scripts/ai_team_external_supervisor.py\ntests/test_ai_team_external_supervisor.py'
          ! git diff | grep -E 'REAL_TRADING_ENABLED[[:space:]]*=[[:space:]]*(YES|TRUE|1)|LIVE_TRADING_ENABLED[[:space:]]*=[[:space:]]*(YES|TRUE|1)'
      - name: Commit Python 3.10 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hyperliquid-ai-team'
          git config user.email 'hyperliquid-ai-team@users.noreply.github.com'
          git add scripts/ai_team_external_supervisor.py tests/test_ai_team_external_supervisor.py
          git commit -m 'P0 #238: support production Python 3.10 supervisor runtime'
          git push origin HEAD:manager/238-external-supervisor
