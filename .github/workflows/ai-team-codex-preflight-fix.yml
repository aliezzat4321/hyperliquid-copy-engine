name: p0-three-lane-readonly-runtime-audit

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, hyperliquid]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd21b0e88873ae88d9ed92aaa169e2c65d3ec413
          fetch-depth: 1
          persist-credentials: false
      - name: Read-only Hyperliquid three-lane runtime audit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aliezzat4321/hyperliquid-copy-engine"
          echo 'TARGET_PROJECT=HYPERLIQUID_ONLY'
          echo 'POLYMARKET_INSPECTION=NO'
          echo 'POLYMARKET_MUTATION=NO'
          echo 'REAL_TRADING_CHANGE=NO'
          date -u '+AUDIT_AT=%Y-%m-%dT%H:%M:%SZ'

          echo '=== LANE 1 UNITS ==='
          for unit in \
            hyperliquid-universe-scout.timer \
            hyperliquid-profitability.timer \
            hyperliquid-wide-trade-watch-live.service \
            hyperliquid-wide-fill-enrichment-live.service \
            hyperliquid-wide-live-scoreboard.timer \
            hyperliquid-validation-cohort.service; do
            printf '%s enabled=' "$unit"
            systemctl is-enabled "$unit" 2>/dev/null || true
            printf '%s active=' "$unit"
            systemctl is-active "$unit" 2>/dev/null || true
          done

          echo '=== LANE 2 UNITS ==='
          for unit in \
            hyperliquid-invo-source-miner.timer \
            hyperliquid-invo-universe-miner.timer \
            hyperliquid-invo-wallet-identifier.service \
            hyperliquid-invo-verified-shadow-sync.service \
            hyperliquid-third-party-profitability.timer; do
            printf '%s enabled=' "$unit"
            systemctl is-enabled "$unit" 2>/dev/null || true
            printf '%s active=' "$unit"
            systemctl is-active "$unit" 2>/dev/null || true
          done

          echo '=== LANE 3 UNITS ==='
          for unit in hyperliquid-invo-notification-executor.service; do
            printf '%s enabled=' "$unit"
            systemctl is-enabled "$unit" 2>/dev/null || true
            printf '%s active=' "$unit"
            systemctl is-active "$unit" 2>/dev/null || true
          done

          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          now = dt.datetime.now(dt.UTC)
          roots = [
              Path('/root/hyperliquid-audit/prospective-champions'),
              Path('/var/lib/hyperliquid-copy-engine/invo'),
              Path('/var/lib/hyperliquid-copy-engine/invo-notification-executor'),
          ]

          def stat(path: Path):
              if not path.exists():
                  print(f'FILE path={path} exists=NO')
                  return
              s = path.stat()
              age = now.timestamp() - s.st_mtime
              print(f'FILE path={path} exists=YES size={s.st_size} mtime={dt.datetime.fromtimestamp(s.st_mtime, dt.UTC).isoformat()} age_s={age:.1f}')

          print('=== KNOWN EVIDENCE FILES ===')
          for p in [
              Path('/root/hyperliquid-audit/prospective-champions/report.json'),
              Path('/var/lib/hyperliquid-copy-engine/invo/identified_wallets.json'),
              Path('/var/lib/hyperliquid-copy-engine/invo/lane2_measurements/latest.json'),
              Path('/var/lib/hyperliquid-copy-engine/invo-notification-executor/audit.jsonl'),
          ]:
              stat(p)

          print('=== RECENT HYPERLIQUID EVIDENCE CANDIDATES ===')
          files = []
          for root in roots:
              if not root.exists():
                  continue
              for dirpath, _, names in os.walk(root):
                  rel_depth = len(Path(dirpath).relative_to(root).parts)
                  if rel_depth > 3:
                      continue
                  for name in names:
                      low = name.lower()
                      if any(k in low for k in ('prospective','challenger','acceptance','shadow','measurement','audit','identified')):
                          p = Path(dirpath) / name
                          try:
                              files.append((p.stat().st_mtime, p))
                          except OSError:
                              pass
          for mtime, p in sorted(files, reverse=True)[:30]:
              age = now.timestamp() - mtime
              print(f'CANDIDATE mtime={dt.datetime.fromtimestamp(mtime, dt.UTC).isoformat()} age_s={age:.1f} path={p}')

          audit = Path('/var/lib/hyperliquid-copy-engine/invo-notification-executor/audit.jsonl')
          if audit.exists():
              count = 0
              last = []
              with audit.open(errors='replace') as fh:
                  for line in fh:
                      count += 1
                      if line.strip():
                          last.append(line)
                          last = last[-5:]
              print(f'LANE3_AUDIT_LINES={count}')
              for idx, line in enumerate(last):
                  try:
                      row = json.loads(line)
                  except Exception:
                      print(f'LANE3_LAST_{idx}=UNPARSEABLE')
                      continue
                  safe = {k: row.get(k) for k in (
                      'type','event','action','coin','status','reason','sourceTimestamp',
                      'receivedAt','receiptTimestamp','decisionTimestamp','orderArrivalTimestamp',
                      'timestamp','ts','createdAt','realizedPnl','unrealizedPnl','netPnl'
                  ) if k in row}
                  print(f'LANE3_LAST_{idx}=' + json.dumps(safe, sort_keys=True))
          PY

          echo 'READ_ONLY_AUDIT=PASS'
          echo 'REAL_TRADING_TOUCHED=NO'
          echo 'POLYMARKET_TOUCHED=NO'
