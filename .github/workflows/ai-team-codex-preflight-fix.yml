name: p0-284-supervisor-progress-fingerprint-fix

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths: [".github/workflows/ai-team-codex-preflight-fix.yml"]

permissions:
  contents: write

concurrency:
  group: p0-284-supervisor-progress-fingerprint-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manager/238-external-supervisor
          fetch-depth: 0
      - name: Apply reviewed semantic-progress repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ai_team_external_supervisor.py')
          s = p.read_text()
          old_agent = '''                "target_sha",\n                "retry_after",\n                "updated_at",\n                "last_progress",\n                "blocker",\n'''
          new_agent = '''                "target_sha",\n                "last_progress",\n                "blocker",\n'''
          if old_agent not in s:
              raise SystemExit('agent material block not found')
          s = s.replace(old_agent, new_agent, 1)
          old_recovery = '''                "assignment_id",\n                "issue",\n                "status",\n                "failure_class",\n                "recovery_fingerprint",\n                "updated_at",\n'''
          new_recovery = '''                "assignment_id",\n                "issue",\n                "pr",\n                "status",\n                "target_sha",\n                "failure_class",\n                "recovery_fingerprint",\n                "last_progress",\n'''
          if old_recovery not in s:
              raise SystemExit('recovery material block not found')
          s = s.replace(old_recovery, new_recovery, 1)
          p.write_text(s)
          PY
          python3 -m py_compile scripts/ai_team_external_supervisor.py
          python3 -m pip install -q pytest ruff
          python3 -m pytest tests/test_ai_team_external_supervisor.py -q
          ruff check scripts/ai_team_external_supervisor.py tests/test_ai_team_external_supervisor.py
          git diff --check
          git diff -- scripts/ai_team_external_supervisor.py
      - name: Commit reviewed blocker repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ai-team-runtime-repair'
          git config user.email 'ai-team-runtime-repair@users.noreply.github.com'
          git add scripts/ai_team_external_supervisor.py
          git commit -m 'P0 #238: fingerprint only semantic supervisor progress'
          git push origin HEAD:manager/238-external-supervisor
