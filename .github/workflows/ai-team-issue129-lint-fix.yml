name: ai-team-issue129-lint-fix

on:
  push:
    branches: [codex/126-ai-orchestrator]
    paths:
      - .github/workflows/ai-team-issue129-lint-fix.yml

permissions:
  contents: read

jobs:
  fix:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0
      - name: Repair lint without breaking VM Python 3.10
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'aliezzat4321/hyperliquid-copy-engine'
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/ai_team_orchestrator.py')
          s = p.read_text()
          old = '    return dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")\n'
          new = '    now = dt.datetime.now(dt.timezone.utc)\n    return now.replace(microsecond=0).isoformat().replace("+00:00", "Z")\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '            retry = dt.datetime.now(dt.timezone.utc) + dt.timedelta(seconds=int(self.cfg["poll_seconds"]))\n'
          new = '            retry = dt.datetime.now(dt.timezone.utc) + dt.timedelta(\n                seconds=int(self.cfg["poll_seconds"])\n            )\n'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))

          p = Path('scripts/ai_team_runtime_ledger.py')
          s = p.read_text()
          old = '    return dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")\n'
          new = '    now = dt.datetime.now(dt.timezone.utc)  # noqa: UP017 - VM supports Python 3.10\n    return now.replace(microsecond=0).isoformat().replace("+00:00", "Z")\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '        checkpoint_data["blockers_json"] = json.dumps(blockers or _safe_blockers(data.get("blockers_json")))\n'
          new = '        checkpoint_data["blockers_json"] = json.dumps(\n            blockers or _safe_blockers(data.get("blockers_json"))\n        )\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '            "Canonical runtime handoff for #129. GitHub remains canonical for accepted code/tasks/reviews; "\n'
          new = '            "Canonical runtime handoff for #129. GitHub remains canonical for accepted "\n            "code/tasks/reviews; "\n'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          old = '            "Fresh-session bootstrap: read this checkpoint and `AGENTS.md`, verify GitHub state, then continue "\n'
          new = '            "Fresh-session bootstrap: read this checkpoint and `AGENTS.md`, verify GitHub "\n            "state, then continue "\n'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/test_ai_team_runtime_ledger.py')
          s = p.read_text()
          old = '        ("task123", "CODEX_CHATGPT", "CODEX_DEFAULT", "2026-09-01T10:01:00Z", 0, "session-abc", 123),\n'
          new = '        (\n            "task123",\n            "CODEX_CHATGPT",\n            "CODEX_DEFAULT",\n            "2026-09-01T10:01:00Z",\n            0,\n            "session-abc",\n            123,\n        ),\n'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          python3 -m venv /tmp/hl-ai-lint
          /tmp/hl-ai-lint/bin/pip -q install 'ruff==0.16.5'
          /tmp/hl-ai-lint/bin/ruff check --fix --select I tests/test_ai_team_runtime_ledger.py
          /tmp/hl-ai-lint/bin/ruff check scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py tests/test_ai_team_runtime_ledger.py
          python3 -m py_compile scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py
          rm -f .github/workflows/ai-team-issue129-lint-fix.yml
          git config user.name 'aliezzat4321'
          git config user.email 'ali.ezzat4321@gmail.com'
          git add scripts/ai_team_orchestrator.py scripts/ai_team_runtime_ledger.py tests/test_ai_team_runtime_ledger.py .github/workflows/ai-team-issue129-lint-fix.yml
          git commit -m 'Fix runtime checkpoint lint with Python 3.10 compatibility'
          git remote set-url origin git@github.com:aliezzat4321/hyperliquid-copy-engine.git
          git push origin HEAD:codex/126-ai-orchestrator
