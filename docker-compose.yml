services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hlcopy
      POSTGRES_PASSWORD: hlcopy
      POSTGRES_DB: hlcopy
    ports:
      - "5432:5432"
    volumes:
      - hlcopy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlcopy -d hlcopy"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hlcopy_pgdata:
